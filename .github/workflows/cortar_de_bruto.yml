name: Cortar (a partir de vídeo já baixado no Drive)

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "ID do arquivo bruto no Drive (pasta 'brutos')"
        required: true
      nome_arquivo:
        description: "Nome do arquivo (extensão importa, ex: fonte.mp4)"
        required: false
        default: "fonte.mp4"
      qtd:
        description: "Quantidade de clipes"
        required: false
        default: "8"
      idioma:
        description: "Idioma da fala (pt, en, es...)"
        required: false
        default: "pt"
      estilo_legenda:
        description: "1 = padrão do canal, 2 = réplica da referência (Poppins, corpo variável) — 2 é o padrão universal desde 05/08/2026"
        required: false
        default: "2"
      pasta_drive:
        description: "ID da pasta pai do Drive (onde nasce a pasta do dia)"
        required: true
      conta:
        description: "Conta do Drive onde o bruto esta (principal | reserva)"
        required: false
        default: "principal"
      conta_saida:
        description: "Conta do Drive que RECEBE os clipes prontos (dona de 'A POSTAR')"
        required: false
        default: "principal"
      dublar:
        description: "Dublar com a voz clonada do Bryan (Chatterbox)"
        required: false
        default: "true"
      fala_literal:
        description: "Só com dublar=true: dubla o que a pessoa REALMENTE está falando (tradução literal), em vez do padrão de narração de contexto do canal. Use pra entrevistas onde a fala em si é o valor editorial (declarações, posições) — é exceção pontual, não o padrão."
        required: false
        default: "false"
      canal:
        description: "Para qual canal e' este corte: modofuturo | cozinha.importada | semanestesia.pod | atefalhar | truque.importado. Decide o token do Buffer E o nome que a guarda confere antes de publicar. O valor tem que bater com o NOME do canal no Buffer."
        required: false
        default: "modofuturo"
      voice_over:
        description: "Mantem o audio ORIGINAL audivel por baixo da dublagem (documentario). Para o Sem Anestesia, onde a voz da pessoa E' parte do argumento. EXIGE fala_literal=true — com narracao de contexto as duas faixas se contradizem, e o motor recusa."
        required: false
        default: "false"
      voz_canal:
        description: "Voz da dublagem: (vazio) = voz clonada do Bryan | feminina | thalita | nome completo do edge-tts. EXIGE voz_clonada=false — o motor recusa a combinacao, porque a clonada venceria em silencio."
        required: false
        default: ""
      voz_clonada:
        description: "Voz clonada (Chatterbox). Desligue para usar a voz de voz_canal."
        required: false
        default: "true"
      amostra_voz:
        description: "De QUEM e' a voz clonada: (vazio) = Bryan | bruna = a irma do Bryan (canal de maquiagem). So' vale com voz_clonada=true."
        required: false
        default: ""
      selecao_modo:
        description: "Criterio de corte. (vazio) = retorico, o corte fecha quando a IDEIA se resolve — os canais de fala. 'procedimento' = o corte tem de ser um PASSO INTEIRO (comeco limpo, meio inteiro, fim resolvido) e descarta se nao couber. OBRIGATORIO no truque.importado: o criterio retorico manda terminar ABRUPTO, que em maquiagem e' o video quebrado."
        required: false
        default: ""
      recorte:
        description: "Trecho exato em segundos INICIO-FIM (ex: 1409.7-1502.4), pula seleção do Gemini"
        required: false
        default: ""

jobs:
  cortar:
    runs-on: ubuntu-latest
    # `contents: write` e' o minimo pro passo "Publicar clipes numa Release":
    # sem declarar, o GITHUB_TOKEN herda o padrao do repo, que pode ser
    # somente leitura, e a criacao da release volta 403.
    permissions:
      contents: write
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4

      # O runner padrão do Actions vem com só ~14GB livres, e SDKs pré-
      # instalados que este job nunca usa (Android, .NET, GHC) já ocupam
      # boa parte disso. Com --dublar (torch + chatterbox-tts + pesos do
      # modelo, ~2GB) o disco estourava ANTES do primeiro clipe terminar
      # ("No space left on device" ainda baixando o modelo, medido em
      # 04/08/2026, run 30908188487, só 14 MB livres). Isso libera
      # tipicamente 20-30GB.
      - name: Liberar espaço em disco
        if: ${{ inputs.dublar == 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libglib2.0-0t64
          # libGLESv2.so.2 — o mediapipe precisa dela e ela NAO vem
          # com libegl1/libgl1. Sem isto o face tracking cai pro crop
          # fixo no centro. Comando separado porque o nome do pacote
          # muda entre versoes do Ubuntu; falhar aqui nao pode
          # derrubar o run inteiro.
          sudo apt-get install -y libgles2 || sudo apt-get install -y libgles2-mesa || true

      - run: pip install -r requirements.txt

      # Cacheia os pesos do modelo de voz clonada (~2GB) entre runs — sem
      # isso, todo run de dublagem baixa tudo de novo do zero (medido em
      # 04/08/2026: só o download já passa de 1min, fora o resto).
      - name: Cache do modelo de voz clonada (Chatterbox)
        if: ${{ inputs.dublar == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/huggingface
          key: chatterbox-hf-cache-v1

      - name: Instalar dependencias da voz clonada (Chatterbox)
        if: ${{ inputs.dublar == 'true' }}
        run: |
          pip install --upgrade "setuptools>=70"
          pip install chatterbox-tts
          pip install --force-reinstall --no-deps resemble-perth

      # A amostra que sera' CLONADA. Era fixa na do Bryan; agora vem do
      # disparo. O `ffmpeg -ar 24000 -ac 1` e' o formato que o Chatterbox
      # espera — a de referencia tem 24 kHz, mono, PCM 16 bits.
      - name: Baixar amostra de voz do Drive
        if: ${{ inputs.dublar == 'true' }}
        env:
          GOOGLE_OAUTH_TOKEN_JSON_2: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_2 }}
          AMOSTRA: ${{ inputs.amostra_voz }}
        run: |
          mkdir -p vozes
          if [ "$AMOSTRA" = "bruna" ]; then
            ID="1RWD71Uyp-UICDfRw4sTiUXXO2u25_wj0"; NOME="bruna_amostra"
          else
            ID="1vGJd2pa-ogzV1Z3vmVR926k72auLbmI-"; NOME="bryan_amostra"
          fi
          # ⚠️ Baixa sempre com nome PROVISORIO. A primeira versao usava o nome
          # final com a extensao de origem, e quebrou no run #192: a amostra da
          # Bruna ja' e' .wav, entao o comando virou
          #     ffmpeg -i vozes/bruna_amostra.wav ... vozes/bruna_amostra.wav
          # e o ffmpeg recusa entrada igual a saida ("Output same as Input").
          # Com o Bryan passava despercebido porque a origem dele e' .m4a.
          # O provisorio faz os dois caminhos ficarem iguais.
          python -X utf8 baixar_bruto_drive.py --file-id "$ID" --destino "vozes/_amostra_bruta" --conta "reserva"
          ffmpeg -y -i "vozes/_amostra_bruta" -ar 24000 -ac 1 "vozes/$NOME.wav"
          rm -f "vozes/_amostra_bruta"
          echo "amostra em uso: $NOME.wav"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "vozes/$NOME.wav"
          # ⚠️ VOZ POR FALANTE: quando o corte tem homem E mulher, cada um
          # ganha a sua voz. Pra isso as DUAS amostras tem de estar em disco,
          # nao so' a do disparo. Baixa a que faltar.
          #
          # Falha ABERTA: se uma nao vier, o motor usa a do disparo pros dois
          # falantes. Clipe com voz unica e' aceitavel; clipe sem voz, nao.
          if [ ! -f vozes/bryan_amostra.wav ]; then
            python -X utf8 baixar_bruto_drive.py --file-id "1vGJd2pa-ogzV1Z3vmVR926k72auLbmI-" --destino "vozes/_m" --conta "reserva" || true
            [ -f vozes/_m ] && ffmpeg -y -i vozes/_m -ar 24000 -ac 1 vozes/bryan_amostra.wav && rm -f vozes/_m
          fi
          if [ ! -f vozes/bruna_amostra.wav ]; then
            python -X utf8 baixar_bruto_drive.py --file-id "1RWD71Uyp-UICDfRw4sTiUXXO2u25_wj0" --destino "vozes/_f" --conta "reserva" || true
            [ -f vozes/_f ] && ffmpeg -y -i vozes/_f -ar 24000 -ac 1 vozes/bruna_amostra.wav && rm -f vozes/_f
          fi
          ls -la vozes/

      - name: Baixar vídeo bruto do Drive
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON_2: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_2 }}
          GOOGLE_OAUTH_TOKEN_JSON_3: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_3 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -X utf8 baixar_bruto_drive.py --file-id "${{ inputs.drive_file_id }}" --destino "${{ inputs.nome_arquivo }}" --conta "${{ inputs.conta }}"

      - name: Cortar (sem download — já está em disco)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 }}
          # ⚠️ O motor precisa saber DE QUAL BRUTO veio o clipe — sem
          # isto o manifesto guarda so' 'fonte.mp4' e dois cortes do
          # mesmo trecho viram dois posts.
          DRIVE_FILE_ID: ${{ inputs.drive_file_id }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          # chave 21, adicionada em 01/09/2026 (conta contato.arcadacad)
          GEMINI_API_KEY_21: ${{ secrets.GEMINI21 }}
          # slots 22-27: chaves que ainda tinham cota em 02/09/2026,
          # gravadas como NOVAS pra nao arriscar sobrescrever uma boa.
          GEMINI_API_KEY_22: ${{ secrets.GEMINI_API_KEY_22 }}
          GEMINI_API_KEY_23: ${{ secrets.GEMINI_API_KEY_23 }}
          GEMINI_API_KEY_24: ${{ secrets.GEMINI_API_KEY_24 }}
          GEMINI_API_KEY_25: ${{ secrets.GEMINI_API_KEY_25 }}
          GEMINI_API_KEY_26: ${{ secrets.GEMINI_API_KEY_26 }}
          GEMINI_API_KEY_27: ${{ secrets.GEMINI_API_KEY_27 }}
          GROQ_API_KEY: ${{ secrets.GROQ1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ7 }}
          GROQ_API_KEY_8: ${{ secrets.GROQ8 }}
          # ⚠️ RESERVA DE TRADUCAO (Nemotron). Sem estas linhas a reserva
          # existe no codigo e NAO EXISTE na nuvem: em 02/09/2026 ela caiu com
          # "Nenhuma chave NVIDIA_API_KEY encontrada" no primeiro run real,
          # porque eu testei o Nemotron na maquina local — onde o .env tem as
          # chaves — e declarei pronto sem conferir os secrets do repositorio.
          # Provei o caminho que eu controlava.
          #
          # ⚠️ Secret ausente vira string vazia, e o `keys.Rotador` ignora
          # vazio: se o Bryan ainda nao cadastrou, a reserva volta a ser inerte
          # em SILENCIO. O log do run e' a unica prova de que ela funcionou.
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          NVIDIA_API_KEY_4: ${{ secrets.NVIDIA_API_KEY_4 }}
          NVIDIA_API_KEY_5: ${{ secrets.NVIDIA_API_KEY_5 }}
          VOICE_OVER: ${{ inputs.voice_over }}
          VOZ_CANAL: ${{ inputs.voz_canal }}
          VOZ_CLONADA: ${{ inputs.voz_clonada }}
          SELECAO_MODO: ${{ inputs.selecao_modo }}
          # Nome do arquivo em vozes/. Casa com o passo que baixou a amostra.
          AMOSTRA_VOZ: ${{ inputs.amostra_voz == 'bruna' && 'bruna_amostra.wav' || 'bryan_amostra.wav' }}
          # De quem e' a voz de cada genero, quando o corte tem os dois.
          # Lidas por `_amostra_do_genero`; sem elas, uma voz so'.
          AMOSTRA_VOZ_MASCULINO: bryan_amostra.wav
          AMOSTRA_VOZ_FEMININO: bruna_amostra.wav
        run: >
          python -X utf8 main.py
          --arquivo "${{ inputs.nome_arquivo }}"
          --qtd "${{ inputs.qtd }}"
          --idioma "${{ inputs.idioma }}"
          --estilo-legenda "${{ inputs.estilo_legenda }}"
          ${{ inputs.dublar == 'true' && '--dublar' || '' }}
          ${{ inputs.fala_literal == 'true' && '--fala-literal' || '' }}
          ${{ inputs.recorte != '' && format('--recorte {0}', inputs.recorte) || '' }}

      - name: Subir clipes prontos pro Drive
        env:
          # OAuth, nao Service Account: SA nao tem cota de armazenamento e
          # o upload morre com 403 "Service Accounts do not have storage
          # quota" (medido no run #8, 28/07/2026). O subir_drive.py da
          # precedencia a esta variavel quando ela existe.
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON_2: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_2 }}
          GOOGLE_OAUTH_TOKEN_JSON_3: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_3 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # ⚠️ `conta_saida`, NAO `conta`. Sao coisas diferentes e estavam
        # coladas no mesmo parametro:
        #
        #   conta        onde o BRUTO esta' (hoje: reserva/cryptozpin)
        #   conta_saida  quem e' dono da pasta 'A POSTAR' (principal)
        #
        # MEDIDO em 02/09/2026: 'A POSTAR' = "2 - CLIPES PRONTOS" pertence a
        # fatoseacontecimentoscontato@gmail.com, e a conta reserva devolve
        # 404 nela — nao enxerga a pasta. Subir clipe com a credencial da
        # reserva nunca podia dar certo; a reserva a 99,8% so' fez o erro
        # aparecer mais cedo, e com cara de cota em vez de cara de permissao.
        #
        # ⚠️ E o prejuizo era o pior possivel: este passo vem DEPOIS do corte,
        # entao o run ja' pagou 40 a 100 min de runner e morria com o clipe
        # pronto na mao. O run 33622779969 perdeu 79,4 min assim.
        run: python -X utf8 subir_drive.py --pasta-id "${{ inputs.pasta_drive }}" --conta "${{ inputs.conta_saida }}"

      # Hospeda os clipes numa Release pra que agendador de rede social
      # consiga puxar por URL publica — nem Buffer nem Zoho aceitam upload de
      # arquivo pela API, e link do Drive aponta pra pagina HTML, nao pro
      # arquivo. `continue-on-error`: publicar na Release e' conveniencia; se
      # falhar, o clipe ja' esta' no Drive e o run nao pode ser reprovado por
      # isso (nem impedir a limpeza do bruto logo abaixo).
      - name: Publicar clipes numa Release (URL publica)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # De QUEM e' este clipe. O manifesto e' unico pro repositorio, e sem
          # este campo o agendador nao tem como saber a origem — foi assim que
          # o primeiro run do @truque.importado encheu a fila do canal de
          # maquiagem com 10 clipes de chips, em 31/08/2026.
          CANAL_ESPERADO: ${{ inputs.canal }}
        run: python -X utf8 publicar_release.py

      # Enfileira no Buffer o que couber, respeitando o teto do plano gratuito
      # (10 agendados por canal) e deixando 1 vaga livre pro Bryan. Roda a cada
      # corte, que e' o momento em que ha' clipe novo — e como cada corte leva
      # ~70 min e ele posta 6x/dia, a fila e' reabastecida na cadencia certa
      # sem tarefa agendada separada.
      # `continue-on-error`: agendar e' conveniencia; o clipe ja' esta' no
      # Drive e na Release, e um erro do Buffer nao pode reprovar o corte.
      - name: Enfileirar no Buffer
        continue-on-error: true
        env:
          # Token POR CANAL. Sem isto o corte de qualquer canal era enfileirado
          # no @modofuturo — em 30/08/2026 um podcast do Sem Anestesia quase
          # foi parar na fila do canal de chips.
          BUFFER_TOKEN: ${{ inputs.canal == 'cozinha.importada'
            && secrets.BUFFER_TOKEN_COZINHA
            || (inputs.canal == 'semanestesia.pod'
                && secrets.BUFFER_TOKEN_SEMANESTESIA
                || (inputs.canal == 'atefalhar'
                    && secrets.BUFFER_TOKEN_ATEFALHAR
                    || (inputs.canal == 'truque.importado'
                        && secrets.BUFFER_TOKEN_TRUQUEIMPORTADO
                        || secrets.BUFFER_TOKEN))) }}
          # E a guarda confere o DESTINO REAL: o agendar_buffer aborta se o
          # token abrir um canal diferente deste. Pega secret trocado, secret
          # vazio e canal reconectado noutra conta — nao so' o caso de hoje.
          CANAL_ESPERADO: ${{ inputs.canal }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -X utf8 agendar_buffer.py

      # So roda se TUDO acima deu certo: bruto de corte que falhou nao pode
      # sumir, senao perde-se a fonte junto com a tentativa.
      - name: Limpar bruto do Drive
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON_2: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_2 }}
          GOOGLE_OAUTH_TOKEN_JSON_3: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_3 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -X utf8 limpar_bruto_drive.py --file-id "${{ inputs.drive_file_id }}" --conta "${{ inputs.conta }}"

      - name: Avisar no Telegram
        if: always()
        run: |
          # ⚠️ QUARENTENA TEM DE APARECER AQUI, e nao no meio do log.
          #
          # Clipe traduzido pela reserva (Nemotron) NAO entra na fila de
          # postagem — o agendador barra. Se o aviso nao disser isso, o Bryan
          # vê "terminou, está no Drive", supõe que foi pra fila como sempre,
          # e o clipe fica parado sem ninguém saber que espera avaliação dele.
          # Silêncio aqui transforma uma quarentena em clipe esquecido.
          QUARENTENA=$(grep -rl '"quarentena": true' saida/ 2>/dev/null | wc -l)
          if [ "${{ job.status }}" = "success" ] && [ "$QUARENTENA" -gt 0 ]; then
            TEXTO="🟡 Corte terminou, mas $QUARENTENA clipe(s) foram traduzidos pela RESERVA (Nemotron — o Gemini estava sem cota). Estão no Drive e NÃO entraram na fila de postagem: esperam você avaliar a tradução. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          elif [ "${{ job.status }}" = "success" ]; then
            TEXTO="✅ Corte (fluxo híbrido) terminou — já está no Drive."
          else
            TEXTO="⚠️ Corte (fluxo híbrido) falhou — confira: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="$TEXTO"
