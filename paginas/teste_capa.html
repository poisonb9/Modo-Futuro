<style>
/* 03/10/2026: desenho de capa de revista teen (ver ferramentas/edicao_design.py) */
:root{--cor:#D6336C;--fundo:#FFF4F8;--amarelo:#FFD60A;--tinta:#141118;--suave:#55505e;--linha:#ebe6ef;
 --logo:'Grand Hotel',cursive;--capa:Anton,Impact,'Arial Narrow',sans-serif;--texto:Archivo,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{background:#fff;color-scheme:light only}
body{background:#fff;color:var(--tinta);font:16px/1.5 var(--texto);-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding:0 16px 48px;min-height:100svh;display:flex;flex-direction:column}
.topo{margin:0 -16px;display:flex;justify-content:space-between;align-items:center;background:var(--cor);color:#fff;padding:10px 16px}
.marca{font:400 18px/1 var(--capa);letter-spacing:.06em}
.selo-topo,.selo{font:400 15px/1 var(--capa);letter-spacing:.06em;color:var(--amarelo);text-transform:uppercase}
.tela{flex:1;display:none;flex-direction:column;padding-top:18px;animation:entra .35s ease both}
.tela.ativa{display:flex}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tela{animation:none}}
.capa{position:relative;padding:4px 0 8px}
.capa::after{content:"TESTE";position:absolute;right:0;top:0;background:var(--amarelo);color:var(--tinta);font:400 22px/1 var(--capa);
 letter-spacing:.06em;padding:8px 12px 6px;transform:rotate(6deg)}
.kicker{font:400 clamp(40px,11vw,58px)/.95 var(--logo);color:var(--cor);text-shadow:2px 2px 0 var(--amarelo);text-transform:none;letter-spacing:0}
h1{margin:10px 0 12px;font:400 clamp(38px,10vw,58px)/.95 var(--capa);text-transform:uppercase;text-wrap:balance}
.lead{color:var(--suave);font-size:17px;font-weight:600;max-width:38ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips span{border:2px solid var(--tinta);padding:6px 10px 5px;font:400 14px/1 var(--capa);letter-spacing:.05em;text-transform:uppercase}
.chips span:first-child{background:var(--amarelo);border-color:var(--amarelo)}
.btn{appearance:none;border:0;cursor:pointer;font:400 22px/1 var(--capa);letter-spacing:.05em;text-transform:uppercase;padding:18px 26px 16px;
 background:var(--cor);color:#fff;width:100%;margin-top:22px;box-shadow:5px 5px 0 var(--tinta);transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--tinta)}
.btn:focus-visible,.op:focus-visible{outline:3px solid var(--amarelo);outline-offset:3px}
.btn.sec{background:#fff;color:var(--tinta);border:3px solid var(--tinta);margin-top:12px}
.barra{height:10px;border:2px solid var(--tinta);background:#fff}
.barra i{display:block;height:100%;width:0;background:var(--cor);transition:width .3s ease}
.passo{margin-top:12px;font:400 16px/1 var(--capa);color:var(--cor);letter-spacing:.08em}
h2{margin:10px 0 16px;font:400 clamp(28px,7.4vw,38px)/1 var(--capa);text-transform:uppercase;text-wrap:balance}
.ops{display:grid;gap:10px}
.op{appearance:none;cursor:pointer;text-align:left;display:flex;gap:14px;align-items:center;background:#fff;border:3px solid var(--tinta);
 padding:14px 14px;font:700 16px/1.3 var(--texto);color:var(--tinta);box-shadow:4px 4px 0 var(--linha);transition:background .12s ease,box-shadow .12s ease}
.op:hover{background:var(--fundo);box-shadow:4px 4px 0 var(--cor)}
.op b{flex:none;width:34px;height:34px;display:grid;place-items:center;background:var(--amarelo);color:var(--tinta);font:400 18px/1 var(--capa)}
.cartao{position:relative;padding:clamp(24px,6vw,34px);color:#fff;background:var(--cor);box-shadow:6px 6px 0 var(--tinta);overflow:hidden}
.cartao::after{content:attr(data-n);position:absolute;right:-6px;bottom:-28px;font:400 150px/1 var(--capa);opacity:.18}
.cartao .kicker{color:#fff;text-shadow:2px 2px 0 var(--tinta);font-size:38px}
.cartao h1{color:#fff;margin:6px 0 10px;text-shadow:3px 3px 0 var(--tinta)}
.cartao p{position:relative;z-index:1;font-weight:600}
.cartao .assin{margin-top:16px;font:400 15px/1 var(--capa);letter-spacing:.12em;color:var(--amarelo)}
.bloco{margin-top:18px;border:3px solid var(--tinta);padding:18px}
.bloco b{display:inline-block;font:400 16px/1 var(--capa);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;background:var(--amarelo);padding:5px 8px 4px}
.bloco ol{list-style:none;padding:0;display:grid;gap:8px;counter-reset:p}
.bloco li{position:relative;padding-left:30px;font-weight:600}
.bloco li::before{counter-increment:p;content:counter(p);position:absolute;left:0;top:0;width:21px;height:21px;background:var(--cor);color:#fff;font:400 13px/21px var(--capa);text-align:center}
.isca{position:relative;margin-top:22px;background:var(--amarelo);padding:22px;transform:rotate(-.5deg)}
.isca .kicker{font-size:34px;color:var(--tinta);text-shadow:none}
.isca h3{font:400 clamp(26px,6.6vw,34px)/1 var(--capa);text-transform:uppercase;margin:6px 0 8px;text-wrap:balance}
.isca p{font-weight:600}
.isca form{display:grid;gap:10px;margin-top:14px}
.isca input[type=email]{font:16px var(--texto);padding:15px 16px;border:3px solid var(--tinta);background:#fff}
.isca input[type=email]:focus{outline:3px solid var(--cor);outline-offset:1px}
.isca label.ok{display:flex;gap:10px;font-size:13px;font-weight:600;align-items:flex-start}
.isca .btn{margin-top:4px}
.mel{position:absolute;left:-9999px}
.msg{font-size:14px;font-weight:700;min-height:1.2em}
.previa{margin-top:10px;font:700 12px/1.4 var(--texto);color:#7a4a00;background:#fff;padding:8px 10px}
.rodape{margin-top:26px;font-size:12px;color:var(--suave);text-align:center}
.rodape a{color:var(--cor);font-weight:800;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app">
  <header class="topo"><span class="marca" id="marca"></span><span class="selo-topo">Teste da capa</span></header>

  <section class="tela ativa" id="t-abre">
    <div class="capa">
      <div class="kicker" id="kicker"></div>
      <h1 id="titulo"></h1>
      <p class="lead" id="lead"></p>
      <div class="chips"><span id="n-perg"></span><span>1 minuto</span><span>Resultado para compartilhar</span></div>
    </div>
    <button class="btn" id="comecar">Começar o teste</button>
  </section>

  <section class="tela" id="t-perg" aria-live="polite">
    <div class="barra"><i id="progresso"></i></div>
    <div class="passo" id="passo"></div>
    <h2 id="pergunta"></h2>
    <div class="ops" id="ops"></div>
  </section>

  <section class="tela" id="t-res">
    <div class="cartao" id="cartao">
      <div class="kicker">Seu resultado</div>
      <h1 id="r-nome"></h1>
      <p id="r-texto"></p>
      <div class="assin" id="r-assin"></div>
    </div>
    <div class="bloco"><b id="r-lista-tit"></b><ol id="r-lista"></ol></div>
    <button class="btn sec" id="compartilhar">Compartilhar meu resultado</button>
    <div class="isca">
      <div class="kicker" id="i-kicker"></div>
      <h3 id="i-titulo"></h3>
      <p id="i-texto"></p>
      <form id="form" novalidate>
        <label class="sr" for="email">seu e-mail</label>
        <input id="email" type="email" required autocomplete="email" placeholder="seu@email.com">
        <input class="mel" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label class="ok"><input type="checkbox" id="aceite"><span id="i-ok"></span></label>
        <button class="btn" type="submit" id="i-botao"></button>
        <p class="msg" id="msg" role="status"></p>
      </form>
      <p class="previa" id="previa" hidden>PRÉVIA: o envio está desligado até a aprovação.</p>
    </div>
    <button class="btn sec" id="refazer">Refazer o teste</button>
  </section>

  <footer class="rodape"><a id="perfil" href="#">Ver os vídeos no TikTok →</a> · <a href="/privacidade">Privacidade</a></footer>
</div>

<script>
(function () {

                   anon: "sb_publishable_0jl-vQuNumE-unzla0XMeQ__cz46cqy" };

  // Cada pergunta: 4 opcoes, cada opcao soma 1 ponto num resultado (indice).

    make: {
      marca: "ACHADINHO MAKE", cor: "#D6336C", fundo: "#FFF4F8",

      titulo: "Qual make de idol combina com você?",

        ["Sexta à noite, você está...", ["Num show, brilhando na pista", "Num jantar, com o olhar marcado", "Num rolê de fotos com as amigas", "Num café, de cara lavada e feliz"]],

        ["Qual cor te representa?", ["Prata e lilás", "Marrom e vinho", "Rosa bebê", "Pêssego"]],
        ["Tempo para se arrumar:", ["O tempo que precisar, é arte", "15 minutos, mas o delineado é sagrado", "10 minutos de blush e alegria", "5 minutos e pronta"]]
      ],
      resultados: [
        { nome: "Fada Brilhante", texto: "Você é a make que vira assunto. Brilho no lugar certo, ponto de luz no olhar e coragem de ser palco. É a vibe da Jiwoo do NMIXX desenhando a própria maquiagem de fada.",
          lista: ["Pele leve e iluminada no centro do rosto", "Glitter só na pálpebra móvel e no canto interno", "Lábio com brilho para fechar"] },
        { nome: "Gatinha Marcante", texto: "Seu olhar fala antes de você. Delineado alongado, sombras quentes e atitude. É a vibe do delineado gatinho que a Noze mostrou no canal.",
          lista: ["Sombra quente esfumada no côncavo", "Delineado puxado para cima, no ângulo da sobrancelha", "Máscara só nos cílios de fora"] },
        { nome: "Bonequinha Dumpling", texto: "Você é fofura com propósito. Bochecha rosada, pele de pêssego e sorriso. É a vibe da famosa make dumpling que o Hyunjin do Stray Kids completou no canal.",
          lista: ["Blush rosado bem no alto das bochechas", "Iluminador por cima do blush", "Lábio em degradê, mais forte no centro"] },
        { nome: "Natural Glow", texto: "Você é a pele mais bonita da sala. Pouca coisa, tudo bem feito. É a vibe da Jiwoo do NMIXX defendendo o protetor solar com a maquiadora.",
          lista: ["Protetor solar como primeiro passo", "Corretivo só onde precisa", "Lip tint e sobrancelha penteada"] }
      ],
      isca: { kicker: "Brinde exclusivo", titulo: "Receba a Make da Semana", texto: "Toda semana, as makes que as idols usaram nos vídeos, com o passo a passo e o que comprar. Cada edição tem número, dá vontade de juntar todas.", ok: "Aceito receber a Make da Semana por e-mail. Saio quando quiser.", botao: "Quero receber" },

    },
    camarim: {
      marca: "CAMARIM K-POP", cor: "#7B2FF7", fundo: "#F6F0FF",
      perfil: "https://www.tiktok.com/@camarim.kpop", origem: "site", produto: "edicao_camarim",
      kicker: "Teste da Capa",
      titulo: "Qual integrante do Stray Kids seria seu BFF?",
      lead: "6 perguntas. No fim, seu BFF do Stray Kids e os bastidores que provam que vocês combinam.",
      perguntas: [
        ["No grupo de amigos, você é...", ["Quem cuida de todo mundo", "Quem faz todo mundo rir", "Quem treina até ficar perfeito", "O caçula mimado da turma"]],
        ["Seu jeito de resolver um problema:", ["Assumo a frente e organizo", "Transformo em piada", "Ensaio sozinho até dar certo", "Faço uma carinha e todo mundo perdoa"]],
        ["Programa perfeito:", ["Live até tarde com os amigos", "Dançar sem parar", "Ficar em casa praticando algo novo", "Comer muito e tirar fotos"]],
        ["O que te irrita?", ["Ver alguém desanimado", "Silêncio constrangedor", "Errar na frente dos outros", "Ser deixado de lado"]],
        ["Sua frase:", ["Pode contar comigo", "Calma, vai dar tudo certo", "Mais uma vez, do começo", "Mas eu sou fofo, né?"]],
        ["Seu superpoder:", ["Liderar", "Alegrar o ambiente", "Disciplina", "Ser impossível de ficar bravo com você"]]
      ],
      resultados: [
        { nome: "Bang Chan", texto: "Seu BFF é o líder que abre o coração. Ele já desabafou sobre o chat do 3RACHA e cuida do grupo como família. Vocês são os que seguram a barra dos amigos.",
          lista: ["Os dois nasceram para cuidar de todo mundo", "Conversam até tarde sem ver a hora", "Nunca deixam ninguém desanimar"] },
        { nome: "Han", texto: "Seu BFF é o que transforma tudo em história. Ele contou que foi ignorado por 2 semanas no grupo e riu disso. Vocês dois fazem piada até do perrengue.",
          lista: ["Humor é a língua oficial da amizade", "Perrengue vira meme em 5 minutos", "Ninguém fica sério perto de vocês"] },
        { nome: "Seungmin", texto: "Seu BFF é o disciplinado de coração mole. Ele treinava choro no espelho para acertar a cena. Vocês dois ensaiam até ficar perfeito.",
          lista: ["Os dois levam o que amam a sério", "Treino é forma de carinho", "Perfeccionistas, mas morrem de rir juntos"] },
        { nome: "I.N", texto: "Seu BFF é o caçula que se livra de tudo sendo fofo. Ele comete erros e é perdoado na hora. Vocês dois são impossíveis de ficar bravos.",
          lista: ["Carinha de inocente é a arma secreta", "Fazem bagunça e saem ilesos", "O grupo inteiro protege vocês"] }
      ],
      isca: { kicker: "Brinde exclusivo", titulo: "Receba o Photocard da Semana", texto: "Toda semana, os bastidores que mais deram o que falar, contados como fã conta pra fã. Cada photocard tem número, dá vontade de completar a coleção.", ok: "Aceito receber o Photocard da Semana por e-mail. Saio quando quiser.", botao: "Quero o meu photocard" },
      compartilha: "Fiz o teste e meu BFF do Stray Kids é"
    }
  };

  var chave = (location.hash.slice(1) || new URLSearchParams(location.search).get("c") || "make").toLowerCase();
  var T = TESTES[chave] || TESTES.make;
  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement.style;
  root.setProperty("--cor", T.cor); root.setProperty("--fundo", T.fundo);
  document.title = T.titulo + " · " + T.marca;

  $("marca").textContent = T.marca; $("kicker").textContent = T.kicker;
  $("titulo").textContent = T.titulo; $("lead").textContent = T.lead;
  $("n-perg").textContent = T.perguntas.length + " perguntas";
  $("perfil").href = T.perfil;
  $("i-kicker").textContent = T.isca.kicker; $("i-titulo").textContent = T.isca.titulo;
  $("i-texto").textContent = T.isca.texto; $("i-ok").textContent = T.isca.ok;
  $("i-botao").textContent = T.isca.botao;
  if (PREVIA) { $("previa").hidden = false; }

  var atual = 0, pontos = [];
  function mostrar(id) {
    ["t-abre", "t-perg", "t-res"].forEach(function (t) { $(t).classList.toggle("ativa", t === id); });
    window.scrollTo(0, 0);
  }
  function pergunta() {
    var p = T.perguntas[atual];
    $("progresso").style.width = (100 * atual / T.perguntas.length) + "%";
    $("passo").textContent = "PERGUNTA " + (atual + 1) + " DE " + T.perguntas.length;
    $("pergunta").textContent = p[0];
    var ops = $("ops"); ops.innerHTML = "";
    p[1].forEach(function (txt, i) {
      var b = document.createElement("button");
      b.className = "op"; b.type = "button";
      b.innerHTML = "<b>" + String.fromCharCode(65 + i) + "</b><span></span>";
      b.querySelector("span").textContent = txt;
      b.addEventListener("click", function () { pontos[i] = (pontos[i] || 0) + 1; avancar(); });
      ops.appendChild(b);
    });
    ops.firstChild.focus({ preventScroll: true });
  }
  function avancar() {
    atual++;
    if (atual < T.perguntas.length) { pergunta(); } else { resultado(); }
  }
  function resultado() {
    var melhor = 0;
    for (var i = 1; i < T.resultados.length; i++) { if ((pontos[i] || 0) > (pontos[melhor] || 0)) melhor = i; }
    var r = T.resultados[melhor];
    $("cartao").setAttribute("data-n", String(melhor + 1).padStart(2, "0"));
    $("r-nome").textContent = r.nome; $("r-texto").textContent = r.texto;
    $("r-assin").textContent = T.marca;
    $("r-lista-tit").textContent = chave === "camarim" ? "Por que vocês combinam" : "Seu passo a passo";
    var ol = $("r-lista"); ol.innerHTML = "";
    r.lista.forEach(function (x) { var li = document.createElement("li"); li.textContent = x; ol.appendChild(li); });

      if (navigator.share) { navigator.share({ title: T.titulo, text: txt, url: location.href }).catch(function () {}); }

    mostrar("t-res");
  }
  $("comecar").addEventListener("click", function () { atual = 0; pontos = []; mostrar("t-perg"); pergunta(); });
  $("refazer").addEventListener("click", function () { mostrar("t-abre"); });

  $("form").addEventListener("submit", function (ev) {

    var v = $("email").value.trim().toLowerCase(), msg = $("msg"), bt = $("i-botao");

    if (document.querySelector(".mel").value) { return; }
    if (PREVIA) { msg.textContent = "Prévia: nada foi enviado."; return; }
    bt.disabled = true; msg.textContent = "Enviando…";
    fetch(SUPABASE.url + "/rest/v1/contato", {
      method: "POST",
      headers: { "apikey": SUPABASE.anon, "Authorization": "Bearer " + SUPABASE.anon,

      body: JSON.stringify({ email: v, origem: T.origem, produto: T.produto })
    }).then(function (r) {
      if (!r.ok) { throw new Error(r.status); }
      $("form").innerHTML = "<p class='msg'>Pronto! A primeira edição chega em " + v.replace(/</g, "") + ".</p>";
    }).catch(function () { bt.disabled = false; msg.textContent = "Não deu agora. Tente de novo."; });
  });
})();
</script>
</body>
</html>
