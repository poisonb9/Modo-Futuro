name: Apagar ou mover agendados (por horario)
# 02/10/2026: apaga posts agendados de UM canal pelo horario exato (UTC). So' com pedido do dono.
on:
  workflow_dispatch:
    inputs:
      canal:
        required: true
      horarios:
        description: "AAAA-MM-DDTHH:MM (UTC) separados por ||"
        required: true
      simular:
        default: "true"
      mover_em_min:
        description: "vazio = apagar; N = MOVER o 1o horario para daqui a N min"
        default: ""
      mover_para:
        description: "MOVER para este horario exato (UTC AAAA-MM-DDTHH:MM)"
        default: ""
permissions:
  contents: read
jobs:
  apagar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_TOKEN_SEMANESTESIA: ${{ secrets.BUFFER_TOKEN_SEMANESTESIA }}
          BUFFER_TOKEN_ATEFALHAR: ${{ secrets.BUFFER_TOKEN_ATEFALHAR }}
          BUFFER_TOKEN_TRUQUEIMPORTADO: ${{ secrets.BUFFER_TOKEN_TRUQUEIMPORTADO }}
          BUFFER_TOKEN_CAMARIM: ${{ secrets.BUFFER_TOKEN_CAMARIM }}
          BUFFER_TOKEN_COZINHA: ${{ secrets.BUFFER_TOKEN_COZINHA }}
        run: |
          S=""; [ "${{ inputs.simular }}" = "true" ] && S="--simular"
          if [ -n "${{ inputs.mover_para }}" ]; then
            python -X utf8 ferramentas/mover_agendado.py --canal "${{ inputs.canal }}" --de "${{ inputs.horarios }}" --para "${{ inputs.mover_para }}" $S
            exit $?
          fi
          if [ -n "${{ inputs.mover_em_min }}" ]; then
            python -X utf8 ferramentas/mover_agendado.py --canal "${{ inputs.canal }}" --de "${{ inputs.horarios }}" --em-min "${{ inputs.mover_em_min }}" $S
            exit $?
          fi
          python -X utf8 ferramentas/apagar_agendados.py --canal "${{ inputs.canal }}" --horarios "${{ inputs.horarios }}" $S
