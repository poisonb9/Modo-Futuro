<!DOCTYPE html>
<html lang="pt-BR">
<meta charset="utf-8">
<!-- ⚠️ SEM ESTA LINHA O IPHONE ABRE A PAGINA MINUSCULA.

     Medido em 14/09/2026, na foto do Bryan: sem `viewport` o Safari
     desenha a pagina como se a tela tivesse 980px e depois encolhe tudo
     pra caber — texto de 14px vira texto de 5px, e so' da' pra ler dando
     zoom. Vale pra QUALQUER visita, dentro ou fora do TikTok.

     ⚠️ E a pagina inteira e' feita pra celular: quem chega vem de video
     vertical. A bio era o unico lugar da operacao sem esta linha. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contra-capa Modo Futuro</title>
<!-- ⚠️ SEM ISTO O ICONE DO ATALHO VIRA UMA LETRA CINZA: o iOS desenha a
     inicial quando nao acha `apple-touch-icon`. O arquivo sobe junto no
     deploy — ver `_por_icone()` em `publicar_bio.py`, que copia nas DUAS
     pastas (bios e site mae). -->
<link rel="apple-touch-icon" href="/icone_app.png?v=branco">
<link rel="icon" href="/icone.png">
<!-- ⭐ SEO (22/09/2026, item 8 da fila): NOINDEX de proposito. Esta MESMA
     pagina e' publicada em 5-7 subdominios (um por canal) com o mesmo HTML
     — se o Google indexasse os sete, seria conteudo duplicado competindo
     contra o proprio dominio principal, que e' quem o `sitemap.xml` ja'
     assume como o unico endereco canonico (so' lista achadinhototal.com.br).
     `follow` continua: o link pro site mae (achadinhototal.com.br) nesta
     pagina ainda deve contar peso pra ele, so' esta pagina que nao compete. -->
<meta name="robots" content="noindex,follow">
<!-- Verificacao de propriedade do Awin (12/09/2026): eles pedem a palavra
     "Awin" no codigo-fonte pra confirmar que a pagina e' nossa. Meta tag,
     e nao comentario, porque o publicador TIRA comentario. -->
<meta name="awin" content="publisher">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    /* o respiro lateral da pagina. Mora aqui porque a esteira sangra por ele
       — dois numeros iguais escritos em dois lugares divergem um dia. */
    --respiro: 18px;
    --tinta:       #141218;
    --tinta-fraca: #5B5563;
    --fundo:       #F7F6F8;
    --superficie:  #FFFFFF;
    --linha:       #E4E1E8;
    --acento:      #1B5BFF;
    --acento-leve: #E8EFFF;
    --sombra:      #141218;
    --aviso:       #8A6A00;
    --aviso-fundo: #FFF6DA;
    --raio: 14px;
  }
  @media (prefers-color-scheme: dark) and (prefers-color-scheme: light) /* TRAVADO-SEMPRE-CLARO 24-09 */ {
    :root:not([data-theme="light"]) {
      --tinta:       #F2EFF4;
      --tinta-fraca: #A7A0B2;
      --fundo:       #121016;
      --superficie:  #1D1A22;
      --linha:       #322D3B;
      --acento-leve: #241F33;
      --aviso:       #FFD98A;
      --aviso-fundo: #2A2212;
    }
  }
  :root[data-theme="dark"] {
    --tinta:       #F2EFF4;
    --tinta-fraca: #A7A0B2;
    --fundo:       #121016;
    --superficie:  #1D1A22;
    --linha:       #322D3B;
    --acento-leve: #241F33;
    --aviso:       #FFD98A;
    --aviso-fundo: #2A2212;
  }

  * { box-sizing: border-box; }

  /* ⚠️ TRAVA DE ARRASTO LATERAL. A pagina e' uma coluna: rolar pro lado nunca
     e' intencional aqui, e um elemento largo demais em qualquer lugar da
     pagina soltava ela inteira. `clip` (e nao `hidden`) porque `hidden` cria
     um container de rolagem e quebraria o `scrollIntoView` do botao. */
  html { overflow-x: clip; }
  body {
    overflow-x: clip;
    margin: 0;
    background: var(--fundo);
    color: var(--tinta);
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .envelope { max-width: 440px; margin: 0 auto; padding: var(--respiro) var(--respiro) 56px; }

  /* ---------------- controle de previa: nao vai ao ar ---------------- */
  .previa {
    border: 1px dashed var(--linha);
    border-radius: var(--raio);
    padding: 12px;
    margin-bottom: 28px;
  }
  .previa h2 {
    margin: 0 0 3px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--tinta-fraca);
  }
  .previa p { margin: 0 0 10px; font-size: 11.5px; line-height: 1.45; color: var(--tinta-fraca); }
  .abas { display: flex; flex-wrap: wrap; gap: 6px; }
  .aba {
    font: 500 11.5px/1 "Poppins", sans-serif;
    padding: 7px 10px; border-radius: 999px;
    border: 1px solid var(--linha);
    background: var(--superficie); color: var(--tinta-fraca);
    cursor: pointer;
  }
  .aba[aria-pressed="true"] {
    border-color: var(--acento); background: var(--acento-leve);
    color: var(--acento); font-weight: 600;
  }
  .aba:focus-visible,
  .botao:focus-visible,
  .produto:focus-visible,
  .interruptor:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }

  /* ---------------- topo ---------------- */
  .topo { display: flex; flex-direction: column; align-items: center; gap: 9px; text-align: center; position: relative; }
  /* o balao do canal: enfeite puro ao lado do brasao, fio pendurado da foto
     original. Absoluto, sem toque, parado em reduced-motion. */
  .balao-canal {
    position: absolute; top: 26px; left: calc(50% + 62px); width: 58px;
    pointer-events: none; transform-origin: 50% 100%;
  }
  .balao-canal img { width: 100%; height: auto; display: block;
    filter: drop-shadow(0 6px 10px rgba(20, 16, 30, .14)); }
  .balao-canal img:not([src]) { display: none; }
  @media (prefers-reduced-motion: no-preference) {
    .balao-canal { animation: flutuar 6.4s ease-in-out -2s infinite alternate; }
  }
  @keyframes flutuar {
    from { transform: translate3d(0, -5px, 0) rotate(-3deg); }
    to   { transform: translate3d(0, 5px, 0) rotate(3deg); }
  }
  /* ⭐ A INAUGURACAO NAS BIOS (24/09/2026, Bryan: "aplicar o conceito de
     inauguracao nos sites de cada bio tambem"). O mesmo varal do site mae,
     em arco por cima do brasao (as pontas descem pelos lados), letras com
     vida propria (dois periodos independentes, mesma semente 2409), e um arco
     pequeno de festa: laranja e laco a` esquerda, o balao do canal (que ja'
     existia) e o cupom a` direita. O topo ganha 30 px para o varal respirar.
     Enfeite puro: absoluto, aria-hidden, sem toque. */
  .topo { padding-top: 30px; }
  .varal-bio { position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    display: flex; align-items: center; gap: 1px; pointer-events: none;
    --lh: 21px; --sag: 10px; z-index: 1; }
  .varal-bio span { display: block;
    transform: translateY(calc(var(--arco) * var(--sag) + var(--dy) * var(--lh))); }
  .varal-bio img { height: var(--lh); width: auto; display: block; }
  .festa-bio { position: absolute; pointer-events: none; transform-origin: 50% 100%; }
  .festa-bio img { width: 100%; height: auto; display: block; }
  .festa-bio.presente { width: 34px; top: 66px; left: calc(50% - 150px); }
  .festa-bio.laco    { width: 32px; top: 40px; left: calc(50% - 116px); }
  .festa-bio.cupom   { width: 30px; top: 74px; left: calc(50% + 116px); }
  @media (prefers-reduced-motion: no-preference) {
    .varal-bio img { animation: vbSobe var(--d1) ease-in-out var(--a1) infinite alternate,
                               vbGira var(--d2) ease-in-out var(--a2) infinite alternate; }
    .festa-bio.presente { animation: flutuar 6.1s ease-in-out -1.4s infinite alternate; }
    .festa-bio.laco    { animation: flutuar 7.3s ease-in-out -3.9s infinite alternate; }
    .festa-bio.cupom   { animation: flutuar 6.7s ease-in-out -2.2s infinite alternate; }
  }
  @keyframes vbSobe { from { translate: 0 calc(var(--amp) * -1); } to { translate: 0 var(--amp); } }
  @keyframes vbGira { from { rotate: calc(var(--rot) * -1); } to { rotate: var(--rot); } }
  .varal-bio span:nth-child(1) img { --d1:3.99s; --d2:5.39s; --a1:-1.25s; --a2:-0.71s; --amp:1.2px; --rot:2.5deg; }
  .varal-bio span:nth-child(2) img { --d1:5.09s; --d2:5.99s; --a1:-3.2s; --a2:-4.92s; --amp:1.9px; --rot:2.3deg; }
  .varal-bio span:nth-child(3) img { --d1:3.18s; --d2:4.77s; --a1:-2.37s; --a2:-1.6s; --amp:1.9px; --rot:1.7deg; }
  .varal-bio span:nth-child(4) img { --d1:3.66s; --d2:4.83s; --a1:-1.17s; --a2:-0.1s; --amp:1.6px; --rot:1.8deg; }
  .varal-bio span:nth-child(5) img { --d1:3.59s; --d2:7.07s; --a1:-2.08s; --a2:-2.19s; --amp:1.2px; --rot:2.8deg; }
  .varal-bio span:nth-child(6) img { --d1:4.6s; --d2:5.98s; --a1:-1.06s; --a2:-4.4s; --amp:1.7px; --rot:1.8deg; }
  .varal-bio span:nth-child(7) img { --d1:3.44s; --d2:6.34s; --a1:-0.97s; --a2:-6.32s; --amp:1.2px; --rot:2.6deg; }
  .varal-bio span:nth-child(8) img { --d1:3.67s; --d2:5.87s; --a1:-0.73s; --a2:-2.85s; --amp:1.2px; --rot:1.6deg; }
  .varal-bio span:nth-child(9) img { --d1:4.83s; --d2:7.18s; --a1:-2.23s; --a2:-1.59s; --amp:1.7px; --rot:2.4deg; }
  .varal-bio span:nth-child(10) img { --d1:4.84s; --d2:4.57s; --a1:-0.91s; --a2:-0.47s; --amp:1.2px; --rot:1.9deg; }
  .varal-bio span:nth-child(11) img { --d1:4.83s; --d2:5.57s; --a1:-2.27s; --a2:-2.91s; --amp:1.8px; --rot:1.6deg; }
  /* ⚠️ O TOPO E' O UNICO LUGAR QUE TODO MUNDO VE'.

     MEDIDO nesta operacao: 98,7% do trafego vem da Para Voce e a
     audiencia sai em 0:02. Quem chega na bio ja' gastou a paciencia dele
     no video — o topo tem que entregar PRODUTO, nao apresentacao.

     ⭐ Por isso a linha viva mostra um produto de verdade, com preco de
     verdade, ANTES de qualquer rolagem. O que faz rolar e' curiosidade
     especifica ('quanto custa o resto?'), nao enfeite. */
  .heroi { text-align: center; padding: 4px 0 2px; }
  .marca {
    font: 700 12px/1 var(--fonte-mono, monospace);
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--fraco); margin: 10px 0 4px;
  }
  .chamada {
    font-family: 'Archivo Black', system-ui, sans-serif;
    font-size: clamp(27px, 8.4vw, 38px); line-height: 1.04;
    letter-spacing: -.02em; margin: 6px 0 12px;
  }
  .chamada em { font-style: normal; color: var(--acento); }
  /* a linha viva: altura FIXA, senao a pagina pula a cada troca de
     produto — e pulo no topo e' o jeito mais rapido de perder o toque */
  /* ⚠️ ALTURA FIXA, e nao `min-height`. Com altura variavel, um nome de
     DUAS linhas empurrava a pagina inteira pra baixo e o de UMA puxava de
     volta, a cada 2,5 segundos: no iPhone do Bryan parecia a pagina
     tremendo (14/09/2026).

     ⭐ O nome tem SEMPRE duas linhas reservadas (`line-clamp: 2`), ocupadas
     ou nao. O espaco e' pago uma vez, na carga, e nao se mexe mais. */
  .vivo {
    height: 98px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    margin: 0 auto 14px; max-width: 30ch;
  }
  .vivo { text-decoration: none; color: inherit; }
  /* ⚠️ alvo de toque com folga: o dedo nao acerta uma linha de 14px */
  .vivo[href] { padding: 6px 10px; border-radius: 12px; }
  .vivo[href]:active { background: var(--tinta-mais-fraca, rgba(0,0,0,.05)); }
  .vivo .oque {
    font-size: 14.5px; line-height: 1.25; color: var(--tinta);
    /* duas linhas SEMPRE: 2 x 1.25 x 14.5px */
    height: 36px; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .vivo .dica {
    font-size: 11.5px; color: var(--fraco); letter-spacing: .04em;
  }
  .vivo .cursor {
    display: inline-block; width: 2px; height: 1em; margin-left: 1px;
    background: var(--acento); vertical-align: -2px;
    animation: piscar 1.05s step-end infinite;
  }
  @keyframes piscar { 50% { opacity: 0; } }
  /* ⚠️ o preco so' aparece quando o nome termina de ser digitado; sem altura
     propria ele nascia do nada e empurrava a dica 21px pra baixo */
  /* ⚠️ O IMPULSO DO PRECO.

     O nome e' digitado letra a letra e o preco aparecia de uma vez, seco.
     Aqui ele ENTRA: cresce um triquinho alem do tamanho e volta, com um
     brilho que passa. E' o momento em que a pagina entrega o que promete,
     e e' o unico lugar onde exagerar um pouco ajuda.

     ⚠️ SEM DESLOCAR NADA: `transform` nao tira o elemento do fluxo, entao
     a pagina nao volta a tremer (o defeito de 14/09). */
  .vivo .quanto.entrando {
    animation: impulso .52s cubic-bezier(.2,1.5,.3,1) both;
  }
  @keyframes impulso {
    0%   { transform: scale(.72); opacity: 0; }
    58%  { transform: scale(1.1);  opacity: 1; }
    100% { transform: scale(1);    opacity: 1; }
  }
  .vivo .caiu-aqui { animation: chegar .5s .18s backwards; }
  @keyframes chegar {
    0%   { transform: scale(.4) rotate(-14deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .vivo .quanto.entrando, .vivo .caiu-aqui { animation: none; }
  }

  /* ⭐ O SELO DE ACHADO NOVO. Produto que entrou hoje nao tem serie pra
     mostrar — e em vez de um cartao mais pobre que os outros, ele ganha o
     unico atributo que so' ele tem: ser novidade. */
  .novo {
    position: absolute; top: 7px; right: 7px; z-index: 1;
    background: #16a34a; color: #fff;
    font: 700 10.5px/1 var(--fonte-mono, monospace);
    padding: 5px 8px; border-radius: 999px;
    box-shadow: 0 1px 4px rgba(0,0,0,.18);
  }
  .achado-hoje { color: #16a34a; }

  .vivo .antes {
    font-size: 12px; color: var(--fraco); margin-left: 8px;
    font-weight: 400; text-decoration-thickness: 1px;
  }
  .vivo .caiu-aqui {
    display: inline-block; margin-left: 8px; vertical-align: 2px;
    background: var(--acento); color: #fff;
    font: 700 11px/1 var(--fonte-mono, monospace);
    padding: 4px 6px; border-radius: 999px;
  }
  .vivo .quanto {
    height: 24px;
    font: 700 21px/1 var(--fonte-mono, monospace); color: var(--acento);
  }
  .rolar {
    display: inline-flex; align-items: center; gap: 8px;
    border: 0; cursor: pointer; font: 600 14.5px/1 inherit;
    background: var(--tinta); color: var(--fundo);
    padding: 13px 20px; border-radius: 999px; margin-bottom: 4px;
  }
  .rolar .seta { animation: descer 1.6s ease-in-out infinite; }
  @keyframes descer { 0%,100% { transform: translateY(0); }
                      50% { transform: translateY(3px); } }
  .prova {
    font-size: 12px; color: var(--fraco); margin: 10px 0 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .vivo .cursor, .rolar .seta { animation: none; }
  }
  /* ⚠️ AQUI FICAVA A BIO (promessa do canal + tres vantagens).

     Ela repetia o que o topo acabou de dizer e empurrava o produto pra
     baixo da dobra. Bryan, 14/09/2026, vendo no iPhone: "vamos tirar esse
     eu garimpo e tal, essa bio".

     ⭐ No lugar entra PROVA, nao mais promessa. Os tres numeros sao
     medidos: quantos achadinhos ha' hoje, o menor preco, e quantas vendas
     essas pecas ja' tem na loja. Nenhum e' escrito na mao. */
  .prova_forte {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin: 20px 0 4px; text-align: center;
  }
  .prova_forte div { padding: 2px 4px; }
  .prova_forte .numero {
    display: block; font: 700 19px/1.1 var(--fonte-mono, monospace);
    color: var(--acento);
  }
  .prova_forte .oque {
    display: block; font-size: 11.5px; line-height: 1.3;
    color: var(--fraco); margin-top: 4px;
  }

  /* a esteira: prova VISUAL de sortimento. Empurra o olho pra baixo
     porque o movimento e' horizontal e o conteudo continua abaixo. */
  .esteira {
    /* ⚠️ O SANGRAMENTO TEM DE BATER COM O PADDING DO ENVELOPE, que e' 18px.
       Com -20px a esteira ficava 379px numa tela de 375 e a PAGINA INTEIRA
       arrastava 2px pro lado — no iPhone, com o repique do Safari, isso
       parece pagina solta. Medido em 14/09/2026 no aparelho do Bryan.

       ⭐ E vem da mesma variavel do envelope, pra nao voltar a divergir. */
    margin: 14px calc(var(--respiro) * -1) 2px; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent,
      #000 8%, #000 92%, transparent);
    mask-image: linear-gradient(90deg, transparent,
      #000 8%, #000 92%, transparent);
  }
  .esteira .trilho {
    display: flex; gap: 9px; width: max-content;
    animation: correr 42s linear infinite;
  }
  .esteira:active .trilho, .esteira:hover .trilho {
    animation-play-state: paused;
  }
  @keyframes correr { to { transform: translateX(-50%); } }
  .esteira a {
    display: block; width: 88px; flex: 0 0 88px;
    border-radius: 12px; overflow: hidden;
    border: 1px solid var(--linha, rgba(0,0,0,.08));
    background: var(--caixa, #fff); text-decoration: none;
  }
  .esteira img { width: 88px; height: 88px; object-fit: cover; display: block; }
  .esteira .etiq {
    display: block; font: 700 11px/1 var(--fonte-mono, monospace);
    color: var(--acento); padding: 6px 5px 7px; text-align: center;
  }
  @media (prefers-reduced-motion: reduce) {
    .esteira .trilho { animation: none; }
    .esteira { overflow-x: auto; }
  }
  .avatar {
    width: 104px; height: 104px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--acento); color: #fff;
    font-family: "Archivo Black", system-ui, sans-serif;
    font-size: 33px; letter-spacing: -.02em;
    overflow: hidden;
  }
  /* Com brasao o fundo sai de baixo: o proprio brasao tem aro de cromo, e o
     acento atras dele viraria uma borda colorida que ninguem pediu. */
  .avatar.com-brasao { background: transparent; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 {
    margin: 3px 0 0;
    font-family: "Archivo Black", system-ui, sans-serif;
    font-size: clamp(24px, 7vw, 30px); line-height: 1.1;
    letter-spacing: -.01em; text-wrap: balance;
  }
  .arroba {
    margin: 0;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px; color: var(--tinta-fraca);
  }
  .promessa { margin: 4px 0 0; max-width: 32ch; font-size: 14.5px; color: var(--tinta-fraca); text-wrap: balance; }

  /* ---------------- vantagens ---------------- */
  .vantagens { list-style: none; margin: 26px 0 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .vantagens li {
    display: grid; grid-template-columns: 22px 1fr; gap: 9px; align-items: start;
    font-size: 14px; font-weight: 500;
  }
  .marca { font-size: 16px; line-height: 1.35; }

  /* ---------------- grupos de botoes ---------------- */
  .grupo { margin-top: 30px; display: flex; flex-direction: column; gap: 11px; }
  .guia { margin: 0; text-align: center; font-size: 13.5px; font-weight: 600; color: var(--tinta-fraca); text-wrap: balance; }

  .botao {
    display: grid; grid-template-columns: 44px 1fr 22px; gap: 10px; align-items: center;
    padding: 12px;
    background: var(--superficie); color: var(--tinta);
    border: 1.5px solid var(--tinta); border-radius: var(--raio);
    box-shadow: 4px 4px 0 var(--sombra);
    text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  a.botao:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--sombra); }
  a.botao:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--sombra); }
  .botao.desligado { opacity: .55; }
  .selo {
    width: 44px; height: 44px; border-radius: 10px;
    display: grid; place-items: center; font-size: 21px;
    background: var(--acento-leve);
    overflow: hidden;
  }
  /* A miniatura real: o FRAME do clipe, que o motor ja' gera (render.capa) e
     agora sobe pra release. Quando nao ha' capa, o mosaico do fundo aparece —

  function desenhar(chave) {

  });

  // ⚠️ O CANAL VEM DA URL. Cada canal tem o seu endereco (`?c=c2`), que e' o
  // que vai na bio dele. Sem isto, todos os sete links da bio abririam o
  // mesmo canal — e a contagem por canal, que e' o ponto de tudo isto, nao
  // diria nada.
  // ⚠️ O CANAL VEM DO CAMINHO OU DA URL, nesta ordem. O caminho
  // (`/bio/c1`) e' o endereco bonito, e e' o que vai na bio; o `?c=c1`
  // continua valendo porque link ja' publicado nao pode quebrar quando a
  // gente melhora o formato.
  // ⚠️ CADA CANAL TEM SEU PROPRIO ENDERECO, e e' o endereco que diz qual
  // canal e'. `oachadinho.pages.dev` abre o Achadinho Make sem barra, sem
  // codigo, sem nada depois — e' isso que vai na bio.
  //
  // O caminho (`/bio/c1`) e o `?c=` continuam valendo: link ja' publicado nao
  // pode quebrar quando o formato melhora.
  var PORTAS = {
    "oachadinho": "c1",   // Achadinho Make
    "meulivro": "c2",     // Sem Anestesia
    "achadinhochef": "c5",
    "pagomenos": "c6",    // Fatura Chora
    "achadinhodehoje": "c7"
  };
  var doHost = PORTAS[location.hostname.split(".")[0]];

  var doCaminho = (location.pathname.match(/\/(c[1-9])\/?$/) || [])[1];
  var pedido = doHost || doCaminho ||
              new URLSearchParams(location.search).get("c");
  if (pedido) {
    var achado = Object.keys(CANAIS).filter(function (k) {
      return CANAIS[k].banco === pedido || k === pedido;
    })[0];
    if (achado) atual = achado;
  }

  desenhar(atual);

  // ⚠️ A VISITA E' CONTADA UMA VEZ, NO CARREGAMENTO — e nao dentro do
  // `desenhar`, onde ela estava. MEDIDO em 12/09/2026, na primeira leitura do
  // placar: o @achadinho.make aparecia com 4 visitas porque cada troca de aba
  // contava outra. Numero inflado e' pior que numero ausente: o ausente a
  // gente sabe que nao sabe.
  medir("visita", { canal: CANAIS[atual].banco });
})();
</script>
</html>
