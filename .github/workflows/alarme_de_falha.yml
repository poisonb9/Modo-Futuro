# 06/10/2026 — "fluxo de erro" (acervo maestros: Error Trigger / error workflow,
# Nate Herk e benai92). O repor_fila travou 01, 02, 05 e 06/10 e o ofertas falhou
# 05 e 06/10 sem ninguem saber. Agora QUALQUER falha/cancelamento destas
# automacoes avisa o dono no Telegram na hora, com o link do run.
name: Alarme de falha

on:
  workflow_run:
    workflows:
      - "Repor fila (diario, 09:00 Sao Paulo)"
      - "Ofertas"
      - "Vigia de postagem"
      - "Cortar vídeo e subir pro Drive"
      - "Garimpo"
      - "Notas do dia (balao do perfil de cada canal)"
    types: [completed]

jobs:
  avisar:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TOK: ${{ secrets.TELEGRAM_BOT_ALERTA }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_DONO }}
          NOME: ${{ github.event.workflow_run.name }}
          FIM: ${{ github.event.workflow_run.conclusion }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          curl -s -m 30 "https://api.telegram.org/bot${TOK}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=🚨 Automacao com problema: ${NOME} (${FIM}). Claude ja' pode olhar: ${URL}" \
            -o /dev/null -w "telegram %{http_code}\n"
