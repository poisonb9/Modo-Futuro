<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achadinho Total — tudo o que estou acompanhando</title>
<!-- ⚠️ O NOME QUE O IPHONE SALVA NA TELA DE INICIO NAO E' O <title>.
     Sem `apple-mobile-web-app-title` o iOS pega o <title> inteiro, corta
     pelo COMECO e mostra "Total — tudo o que estou acompanha...". Foi o que
     apareceu no telefone do Bryan em 15/09/2026. O atalho fica sem nome
     reconhecivel justo na tela onde ele deveria ser reconhecido. -->
<meta name="apple-mobile-web-app-title" content="Achadinho Total">
<meta name="application-name" content="Achadinho Total">
<!-- ⚠️ E SEM ISTO O ICONE VIRA UMA LETRA "A" CINZA: o iOS desenha a inicial
     quando nao acha `apple-touch-icon`. O arquivo tem de existir no deploy —
     ver `publicar_bio.py`, que copia o PNG junto com o index. -->
<link rel="apple-touch-icon" href="/icone.png">
<link rel="icon" href="/icone.png">
<meta name="description" content="O catálogo do Achadinho Total: produto, preço acompanhado dia a dia e link direto pra loja. O desconto é medido contra o preço que nós vimos.">
<meta name="awin" content="publisher">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* ⚠️ A COPY DESTA PAGINA SEGUE UMA LISTA DE VERIFICACAO, e nao o gosto de
     quem escreveu. Ela vem do acervo dos Maestros (Nick Saraev, DEMONSTRADO):
     giving · micro commitment · social proof · authority · rapport · scarcity.

     Onde cada uma esta', e com o que a gente PROVA:
       giving      o preco acompanhado e a queda medida — informacao que a
                   loja nao da'
       micro       o pedido nao e' "compre": e' ver, filtrar, entrar no canal
       social      as vendas que as pecas ja' tem na loja, medidas
       authority   a nossa serie de precos, com data e numero de pontos
       rapport     primeira pessoa, sem jargao de loja
       scarcity    ⚠️ AQUI A GENTE DIVERGE DO ACERVO DE PROPOSITO. A ficha
                   demonstra timer de 90s e "so' restam 150 copias" (Iman
                   Gadzhi). Numa pagina cujo unico diferencial e' o preco ser
                   VERIFICAVEL, escassez fabricada queima exatamente o que
                   sustenta tudo. A nossa e' real: o preco muda, e o que esta'
                   aqui e' o de hoje. */

  /* ⚠️ A PALETA SAI DA MARCA, e nao do padrao de quem gerou o codigo.

     O acervo dos Maestros tem uma ficha DEMONSTRADA que descreve o defeito
     com todas as letras: "evitar que o modelo gere interfaces genericas
     ROXAS" — o remedio proposto e' paleta exata, tipografia com intencao,
     elemento de assinatura e risco estetico.

     Esta pagina era #5B21F5: o roxo padrao. A marca ja' tinha cor propria
     e ninguem tinha olhado pra ela — a lupa e' OURO com cromo.

     ⭐ E A HIERARQUIA PASSA A TER UM DONO SO': o Bryan viu o bloco de prova
     e o preco com a mesma cor e a mesma fonte, competindo ("ta meio
     redundante"). Agora o PRECO e' tinta cheia em Archivo Black, e o ouro
     e' so' de selo e numero de prova. Duas vozes, nao duas cores iguais. */
  :root {
    --respiro: 18px;
    --tinta: #16151c;
    --fraco: #6f6b7d;
    --linha: #e6e3ec;
    --fundo: #faf9fc;
    --caixa: #fff;
    /* o ouro da lupa, e o cromo que faz o aro dela */
    --ouro: #C8901A;
    --ouro-claro: #F2C94C;
    --painel: #17161d;
    --verde: #16a34a;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --tinta: #f4f2f9; --fraco: #a5a1b4; --linha: #2b2733;
      --fundo: #0f0e13; --caixa: #191823; --painel: #08080b;
      --ouro: #F0B62E;
    }
  }
  * { box-sizing: border-box; }
  html { overflow-x: clip; }
  body {
    margin: 0; overflow-x: clip;
    background: var(--fundo); color: var(--tinta);
    font: 16px/1.55 Poppins, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .faixa { max-width: 980px; margin: 0 auto; padding: 0 var(--respiro); }

  /* ---------------- topo ---------------- */
  header { text-align: center; padding: 34px 0 6px; }
  .marca-logo {
    width: 86px; height: 86px; margin: 0 auto 12px; border-radius: 50%;
    overflow: hidden; display: block;
  }
  .marca-logo img { width: 100%; height: 100%; display: block; }
  .marca-nome {
    font: 700 12px/1 var(--mono); letter-spacing: .2em;
    text-transform: uppercase; color: var(--fraco); margin: 0 0 8px;
  }
  h1 {
    font-family: "Archivo Black", system-ui, sans-serif;
    font-size: clamp(28px, 7.2vw, 46px); line-height: 1.05;
    letter-spacing: -.025em; margin: 0 0 12px;
  }
  /* o unico ouro do texto: a promessa. Duas palavras, e so' */
  h1 em { font-style: normal; color: var(--ouro); }
  .promessa {
    margin: 0 auto 18px; max-width: 46ch; color: var(--fraco);
    font-size: 15.5px;
  }

  /* ⚠️ ALTURA FIXA. Nome de uma ou de duas linhas mudava a altura e a
     pagina inteira subia e descia a cada troca — o defeito que o Bryan
     chamou de "tremendo" nas bios, em 14/09/2026. */
  .vivo {
    height: 92px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    margin: 0 auto 6px; max-width: 34ch; text-decoration: none;
    color: inherit; border-radius: 12px; padding: 6px 10px;
  }
  .vivo:active { background: color-mix(in srgb, var(--tinta) 6%, transparent); }
  .vivo-nome {
    font-size: 15px; line-height: 1.25; color: var(--tinta);
    height: 38px; overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .vivo-preco {
    height: 26px; font: 700 22px/1 var(--mono); color: var(--tinta);
  }
  .vivo-preco s {
    font: 400 12px/1 var(--mono); color: var(--fraco); margin-left: 8px;
  }
  .vivo-preco .pct {
    display: inline-block; margin-left: 8px; vertical-align: 2px;
    background: var(--ouro-claro); color: #17161d;
    font: 700 11px/1 var(--mono); padding: 4px 6px; border-radius: 999px;
  }
  .vivo-preco.entra { animation: impulso .5s cubic-bezier(.2,1.5,.3,1) both; }
  @keyframes impulso {
    0% { transform: scale(.74); opacity: 0; }
    58% { transform: scale(1.09); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .vivo-dica { font-size: 11.5px; color: var(--fraco); }
  .cursor {
    display: inline-block; width: 2px; height: 1em; margin-left: 1px;
    background: var(--ouro); vertical-align: -2px;
    animation: piscar 1.05s step-end infinite;
  }
  @keyframes piscar { 50% { opacity: 0; } }

  /* ⭐ O UPSELL. Aparece DEPOIS do clique, no lugar onde a pessoa estava —
     a loja abriu noutra aba, e quando ela volta o complemento esta' aqui. */
  .junto {
    grid-column: 1 / -1; border: 1px dashed var(--ouro);
    border-radius: 14px; padding: 13px; margin: 2px 0;
    background: color-mix(in srgb, var(--ouro) 7%, transparent);
  }
  .junto h3 {
    margin: 0 0 9px; font-size: 13.5px; display: flex;
    align-items: center; gap: 7px;
  }
  .junto .fila { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  .junto .fechar {
    margin-left: auto; border: 0; background: none; cursor: pointer;
    color: var(--fraco); font: 500 12px/1 var(--mono);
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor, .vivo-preco.entra { animation: none; }
  }

  /* ---------------- prova ---------------- */
  /* ⭐ O RISCO ESTETICO: um painel escuro no meio de uma pagina clara.

     Ele separa a prova do resto sem precisar de cor forte no texto, e da'
     a cara de instrumento — que e' o que a operacao faz de diferente:
     medir preco. Os numeros sao OURO, o preco dos produtos e' TINTA: cada
     um com a sua voz, e nenhum competindo com o outro. */
  .prova {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 4px; margin: 20px 0 8px; text-align: center;
    background: var(--painel); border-radius: 16px;
    padding: 16px 8px; align-items: start;
  }
  .prova > div { padding: 0 4px; position: relative; }
  .prova > div + div::before {
    content: ""; position: absolute; left: 0; top: 3px; bottom: 3px;
    width: 1px; background: rgba(255,255,255,.12);
  }
  .prova .numero {
    display: block; font: 700 19px/1.1 var(--mono); color: var(--ouro-claro);
    letter-spacing: -.02em;
  }
  .prova .oque {
    display: block; font-size: 10.5px; line-height: 1.35;
    color: rgba(255,255,255,.62); margin-top: 6px;
  }

  /* ---------------- filtros ---------------- */
  .ferramentas {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--fundo) 92%, transparent);
    backdrop-filter: blur(9px);
    padding: 12px 0 10px; margin: 16px 0 0;
    border-bottom: 1px solid var(--linha);
  }
  .busca {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--linha); background: var(--caixa);
    color: var(--tinta); font: 15px/1 Poppins, sans-serif;
  }
  .busca::placeholder { color: var(--fraco); }
  /* ⛔ DUAS TENTATIVAS ERRADAS ANTES DESTA, e vale saber por que:
       1. fila unica com ROLAGEM HORIZONTAL — escondia metade das opcoes; pra
          achar "Fitness" a pessoa arrastava sem saber o que havia adiante.
       2. chips quebrando em LINHAS — tudo visivel, mas viraram CINCO linhas
          e empurraram os produtos pra fora da tela. Pior que o problema
          original: o filtro e' acessorio, o produto e' o principal.

     ⭐ Dois seletores NATIVOS resolvem os dois de uma vez: ocupam UMA linha,
     e ao tocar o iPhone abre a roda do sistema com todas as opcoes de uma
     vez — sem rolar a pagina e sem empurrar nada. */
  .filtros {
    display: flex; gap: 7px; margin-top: 10px;
  }
  /* ⭐ MENU PROPRIO, e nao o <select> nativo. O nativo resolvia o espaco mas
     trazia a roda do iOS, que e' a cara do sistema e nao da pagina.

     ⚠️ O QUE NAO PODE MUDAR: o painel abre SOBREPOSTO (position: absolute),
     nunca empurrando a lista. Foi esse o erro da versao de chips em linhas —
     cinco linhas de filtro jogaram os produtos pra fora da primeira tela. */
  .escolha-caixa { position: relative; flex: 1 1 0; min-width: 0; }
  .escolha {
    width: 100%; text-align: left;
    border: 1px solid var(--linha); background: var(--caixa);
    color: var(--tinta); border-radius: 999px;
    padding: 9px 30px 9px 14px;
    font: 600 13px/1 Poppins, sans-serif; cursor: pointer;
    text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
    /* a setinha, desenhada em SVG pra nao depender de fonte de icone */
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1l5 5 5-5' fill='none' stroke='%23A7A0B2' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center; background-size: 10px;
  }
  /* ⭐ ACESO quando ha' filtro: a pessoa precisa ver que a lista esta'
     recortada, senao acha que o catalogo encolheu. */
  .escolha[data-ativo="sim"] {
    background-color: var(--tinta); color: var(--fundo); border-color: var(--tinta);
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1l5 5 5-5' fill='none' stroke='%23FFFFFF' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");
  }
  .escolha[aria-expanded="true"] { border-color: var(--ouro); }
  /* ⭐ O ROTULO FIXO e' quem da' o ar profissional: o menu se apresenta
     ("Preço") antes de mostrar a escolha ("tudo"). Peso e cor diferentes,
     senao vira uma frase so' e perde a hierarquia. */
  .escolha .rotulo-fixo {
    color: var(--fraco); font-weight: 500; margin-right: 5px;
  }
  .escolha .valor-escolhido { font-weight: 700; }
  .escolha .n {
    font: 500 11px/1 var(--mono); color: var(--fraco); margin-left: 6px;
  }
  .escolha[data-ativo="sim"] .rotulo-fixo,
  .escolha[data-ativo="sim"] .n {
    color: color-mix(in srgb, var(--fundo) 72%, transparent);
  }
  /* ⚠️ ICONE DESENHADO EM SVG, nao emoji: emoji muda de cara em cada
     aparelho e num rodape de loja isso aparece como descuido. */
  .escolha::before {
    content: ""; display: inline-block; width: 13px; height: 13px;
    vertical-align: -2px; margin-right: 7px;
    background-repeat: no-repeat; background-position: center;
    background-size: contain; opacity: .55;
  }
  .escolha[data-icone="preco"]::before {
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%236f6b7d' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 2v12M11 5H6.5a2 2 0 000 4h3a2 2 0 010 4H5'/%3E%3C/svg%3E");
  }
  .escolha[data-icone="categoria"]::before {
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%236f6b7d' stroke-width='1.6' stroke-linejoin='round'%3E%3Crect x='2' y='2' width='5' height='5' rx='1'/%3E%3Crect x='9' y='2' width='5' height='5' rx='1'/%3E%3Crect x='2' y='9' width='5' height='5' rx='1'/%3E%3Crect x='9' y='9' width='5' height='5' rx='1'/%3E%3C/svg%3E");
  }
  .escolha[data-ativo="sim"]::before { filter: invert(1) brightness(2); opacity: .8; }
  .opcoes {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40;
    background: var(--caixa); border: 1px solid var(--linha);
    border-radius: 14px; padding: 5px; overflow: hidden;
    box-shadow: 0 14px 34px rgba(0,0,0,.16);
  }
  .opcao {
    display: flex; align-items: center; gap: 8px; width: 100%;
    border: 0; background: none; cursor: pointer; text-align: left;
    color: var(--tinta); border-radius: 10px; padding: 9px 11px;
    font: 500 13.5px/1.2 Poppins, sans-serif;
  }
  .opcao:active { background: color-mix(in srgb, var(--tinta) 7%, transparent); }
  .opcao[aria-selected="true"] { font-weight: 700; }
  /* o numero fica a' direita, alinhado — vira coluna e da' pra comparar */
  .opcao .n {
    margin-left: auto; font: 500 11.5px/1 var(--mono); color: var(--fraco);
  }
  .opcao[aria-selected="true"]::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: var(--ouro); flex: 0 0 5px;
  }
  .opcao:not([aria-selected="true"])::before {
    content: ""; width: 5px; flex: 0 0 5px;
  }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--linha); background: var(--caixa);
    color: var(--fraco); border-radius: 999px; padding: 8px 14px;
    font: 600 13px/1 Poppins, sans-serif; cursor: pointer; white-space: nowrap;
  }
  .chip[aria-pressed="true"] {
    background: var(--tinta); color: var(--fundo); border-color: var(--tinta);
  }
  /* ⭐ O "ver mais" ocupa a largura da grade: e' o fim da lista, nao mais um
     cartao. Parecer cartao faria a pessoa tocar achando que e' produto. */
  .ver-mais {
    grid-column: 1 / -1; width: 100%;
    border: 1px dashed var(--linha); background: none; cursor: pointer;
    color: var(--fraco); border-radius: 14px; padding: 15px;
    font: 600 13px/1 var(--mono); letter-spacing: -.01em;
  }
  .ver-mais:active { background: color-mix(in srgb, var(--tinta) 5%, transparent); }
  .contagem {
    font: 500 12px/1 var(--mono); color: var(--fraco);
    margin: 12px 0 0; display: block;
  }

  /* ---------------- grade ---------------- */
  .grade {
    display: grid; gap: 13px; margin: 14px 0 0;
    grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
  }
  .item {
    display: flex; flex-direction: column; height: 100%;
    background: var(--caixa); border: 1px solid var(--linha);
    border-radius: 16px; overflow: hidden; text-decoration: none;
    color: inherit; box-shadow: 0 1px 2px rgba(20,19,26,.05);
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .item:active { transform: scale(.985); }
  @media (hover: hover) {
    .item:hover { box-shadow: 0 6px 18px rgba(20,19,26,.10); transform: translateY(-2px); }
  }
  .foto { position: relative; aspect-ratio: 1; background: var(--linha); }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 46px;
    background: linear-gradient(rgba(0,0,0,.24), rgba(0,0,0,0));
    pointer-events: none;
  }
  .caiu, .novo {
    position: absolute; top: 8px; z-index: 1; color: #fff;
    font: 700 10.5px/1 var(--mono); padding: 5px 8px; border-radius: 999px;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  /* ⭐ O SELO E' O OURO DA MARCA, com texto escuro: alto contraste, e
     amarra o cartao a` lupa sem repetir a cor do preco. */
  .caiu { left: 8px; background: var(--ouro-claro); color: #17161d;
          box-shadow: 0 1px 5px rgba(0,0,0,.28); }
  .novo { right: 8px; background: var(--verde); }
  .corpo { display: flex; flex-direction: column; flex: 1 1 auto; padding: 11px 12px 12px; gap: 7px; }
  .nome { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .linha-preco { margin-top: auto; display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  /* ⚠️ O PRECO E' TINTA CHEIA. Ele ja' e' o maior e o mais pesado do
     cartao — nao precisa de cor tambem, e com cor ele empatava com o
     painel de prova. */
  .preco { font-family: "Archivo Black", system-ui, sans-serif;
           font-size: 17.5px; color: var(--tinta); letter-spacing: -.01em; }
  .de { font: 400 11.5px/1 var(--mono); color: var(--fraco); text-decoration: line-through; }
  /* ⚠️ SEM `nowrap`. A linha 'acompanhando ha 1 dia' em fonte mono nao cabia
     na largura do cartao e VAZAVA pra fora da borda arredondada — apareceu
     assim no iPhone do Bryan (14/09/2026). Texto que sai do cartao faz a
     pagina inteira parecer quebrada, mesmo com todo o resto certo. */
  /* ⛔ O `overflow: hidden` NAO PODE FICAR NO CONTAINER. Ele corta o
     `box-shadow` da animacao do pulso, e a bolinha verde aparece COMIDA do
     lado esquerdo — visto no iPhone do Bryan em 15/09/2026, e causado pelo
     proprio conserto do vazamento de texto.

     ⭐ Quem corta e' o SPAN DO TEXTO, so' ele. O container fica com
     `min-width: 0` (que nao corta nada, mas deixa o filho encolher no flex) e
     um respiro a esquerda para o halo da animacao caber. */
  .rodape-item {
    display: flex; align-items: center; gap: 5px;
    font: 500 10px/1.25 var(--mono); color: var(--fraco);
    min-width: 0; padding-left: 3px;
  }
  .rodape-item span:last-child {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pulso {
    width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px;
    background: var(--verde); box-shadow: 0 0 0 0 rgba(22,163,74,.55);
    animation: bater 2.4s ease-out infinite;
  }
  @keyframes bater {
    70% { box-shadow: 0 0 0 6px rgba(22,163,74,0); }
    100% { box-shadow: 0 0 0 0 rgba(22,163,74,0); }
  }
  .vazio {
    border: 1px dashed var(--linha); border-radius: 14px;
    padding: 26px 18px; text-align: center; color: var(--fraco);
    grid-column: 1 / -1;
  }

  /* ---------------- fim ---------------- */
  .convite {
    margin: 30px 0 0; border: 1px solid var(--linha); border-radius: 16px;
    background: var(--caixa); padding: 20px; text-align: center;
  }
  .convite h2 { font-size: 18px; margin: 0 0 6px; }
  .convite p { margin: 0 0 14px; color: var(--fraco); font-size: 14px; }
  .botao {
    display: inline-flex; align-items: center; gap: 9px;
    background: var(--tinta); color: var(--fundo); text-decoration: none;
    padding: 13px 20px; border-radius: 999px; font-weight: 600; font-size: 15px;
  }
  footer {
    margin-top: 28px; padding: 20px 0 54px; border-top: 1px solid var(--linha);
    font-size: 12px; color: var(--fraco); text-align: center;
  }
  footer p { margin: 0 0 5px; }
  /* ⭐ A MARCA PRIMEIRO, o aviso depois e menor. A hierarquia e' o que faz o
     rodape parecer de loja e nao de blog: quem assina a pagina vem em tinta
     cheia, e a obrigacao legal fica legivel sem disputar atencao. */
  .marca-rodape {
    font-weight: 600; color: var(--tinta); letter-spacing: -.01em;
  }
  .aviso-rodape { font-size: 11px; opacity: .72; }
  @media (prefers-reduced-motion: reduce) {
    .pulso { animation: none; }
    .item { transition: none; }
  }
</style>

<script>
(function () {
  "use strict";

  // Substituidos na publicacao (ver paginas/publicar_bio.py).
  var PRODUTOS = [];
  var BRASAO = "";

  var grade = document.getElementById("grade");
  var contagem = document.getElementById("contagem");
  var busca = document.getElementById("busca");

  // ⚠️ OS FILTROS SAO PERGUNTAS DIFERENTES, nao rotulos bonitos. "Caiu mais" e
  // "mais barato" ordenam por coisas distintas e as duas listas podem nao se
  // cruzar — a mesma licao de campeoes x tendencia no garimpo.
  var FILTROS = [
    { id: "todos",  rotulo: "tudo",             cabe: function () { return true; },
      // ⭐ A ORDEM DE ABERTURA E' A DECISAO MAIS CARA DA PAGINA.
      // Antes era por DATA: o melhor produto podia estar em 40o lugar, e
      // com centenas de pecas isso vira desperdicio puro. Agora abre
      // pelo que tem mais chance de virar dinheiro.
      //
      // ⚠️ `ganho x vendas` NAO E' CONVERSAO NOSSA. `vendas` e' o que o
      // mercado inteiro comprou na loja — nos nao vendemos nada ainda.
      // Serve pra COMPARAR dois produtos, nao pra prometer faturamento.
      // Vira medicao de verdade quando houver `tracking_id` por canal e
      // venda atribuida.
      ordem: function (a, b) {
        return ((b.ganho || 0) * (b.vendas || 0))
             - ((a.ganho || 0) * (a.vendas || 0));
      } },
    { id: "caiu",   rotulo: "caiu de preço",    cabe: function (p) { return (p.queda || 0) >= 5; },
      ordem: function (a, b) { return (b.queda || 0) - (a.queda || 0); } },
    { id: "novo",   rotulo: "achados novos",    cabe: function (p) { return !(p.pontos >= 2); } },
    { id: "olho",   rotulo: "sendo acompanhados", cabe: function (p) { return p.pontos >= 2; },
      ordem: function (a, b) { return (b.dias || 0) - (a.dias || 0); } },
    { id: "barato", rotulo: "mais baratos",     cabe: function () { return true; },
      ordem: function (a, b) { return num(a.preco) - num(b.preco); } }
  ];
  // ⭐ QUANTOS APARECEM DE PRIMEIRA. O catalogo vai ter centenas de pecas e
  // ninguem rola centenas — quem explora usa o filtro e a busca. O papel da
  // abertura e' mostrar os CAMPEOES, nao o acervo inteiro.
  //
  // ⚠️ E isto NAO e' paginacao: os dados ja' estao todos no navegador, entao
  // filtrar e buscar continuam INSTANTANEOS. O que muda e' so' quantos
  // cartoes sao desenhados de uma vez.
  var PASSO = 30;
  var mostrando = PASSO;
  var atual = "todos";
  var canal = "";

  function num(t) {
    return parseFloat(String(t).replace(/[^0-9,]/g, "").replace(",", ".")) || 0;
  }
  function el(tag, classe, texto) {
    var e = document.createElement(tag);
    if (classe) { e.className = classe; }
    if (texto !== undefined) { e.textContent = texto; }
    return e;
  }
  function normal(t) {
    return String(t || "").toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  function montar(p) {
    var a = document.createElement("a");
    a.className = "item";
    a.href = p.link;
    a.rel = "noopener";
    // ⚠️ SEM `target=_blank`, E ISSO CONSERTA O DEFEITO MAIOR DA PAGINA.
    //
    // MEDIDO em 14/09/2026: no iPhone do Bryan nenhum link abria — nem o
    // cartao, nem a linha do topo. O proprio navegador disse por que:
    // "the page tried to open a new tab and the pane BLOCKED it". Abrir
    // aba nova e' tratado como pop-up, e o bloqueador do Safari vem
    // ligado de fabrica. O link funcionava; a ABA e' que nao abria.
    //
    // ⭐ E o upsell nao depende mais da aba de tras: ele aparece quando a
    // pessoa VOLTA (ver `pageshow` no fim do arquivo), que e' o momento em
    // que ela realmente esta' aqui de novo.

    var foto = el("div", "foto");
    if ((p.queda || 0) >= 5) {
      foto.appendChild(el("span", "caiu", "caiu " + Math.round(p.queda) + "%"));
    }
    if (!(p.pontos >= 2)) {
      foto.appendChild(el("span", "novo", "novo"));
    }
    if (p.imagem) {
      var img = document.createElement("img");
      img.src = p.imagem;
      img.alt = p.nome || "";
      img.loading = "lazy";
      img.decoding = "async";
      foto.appendChild(img);
    }
    a.appendChild(foto);

    var corpo = el("div", "corpo");
    corpo.appendChild(el("div", "nome", p.nome));

    var lp = el("div", "linha-preco");
    lp.appendChild(el("span", "preco", p.preco));
    // ⚠️ O RISCADO SO' EXISTE SE FOR NOSSO. `antes` e' o maior valor da nossa
    // serie; sem ele, nao ha' riscado — e nao se inventa um.
    if (p.antes) { lp.appendChild(el("span", "de", p.antes)); }
    corpo.appendChild(lp);

    var rod = el("div", "rodape-item");
    rod.appendChild(el("span", "pulso"));
    rod.appendChild(el("span", null, p.pontos >= 2
      ? (p.dias <= 0 ? "no radar desde hoje"
         : (p.dias === 1 ? "no radar há 1 dia"
            : "no radar há " + p.dias + " dias"))
      : "achado agora"));
    corpo.appendChild(rod);

    a.appendChild(corpo);

    // ⚠️ O UPSELL NAO ATRAPALHA O CLIQUE PRINCIPAL.
    //
    // Nada de modal antes de ir pra loja: isso e' atrito no unico momento
    // em que a pessoa decidiu comprar. O link abre em OUTRA aba, entao a
    // nossa pagina continua viva atras — e e' la' que o complemento
    // aparece, pra quando ela voltar.
    //
    // ⚠️ E NAO E' 'produto relacionado' generico: e' do MESMO canal e
    // custa no maximo METADE do que ela acabou de olhar. Um complemento
    // mais caro que o principal nao e' complemento, e' outra decisao.
    a.addEventListener("click", function () {
      // ⚠️ CARTAO DE DENTRO DA SUGESTAO NAO GERA OUTRA SUGESTAO.
      //
      // E nao e' so' pra evitar recursao: `sugerir` REMOVE o bloco antigo, e
      // o cartao clicado esta' dentro dele. Tirar o proprio elemento do DOM
      // no meio do clique CANCELA a navegacao — o cartao simplesmente nao
      // abria (medido no iPhone do Bryan, 14/09/2026).
      // ⚠️ Guarda ANTES de sair: quando a pessoa voltar, a pagina recarrega
      // do zero e a unica memoria que sobra e' esta.
      try {
        sessionStorage.setItem("ultimo", p.id || p.link);
      } catch (e) { /* navegacao privada: sem upsell, e tudo bem */ }
      if (a.closest("#junto")) { return; }
    });
    return a;
  }

  // ⚠️ AS PALAVRAS QUE NAO DIZEM NADA ficam de fora da conta. 'kit',
  // 'conjunto' e 'para' aparecem em metade do catalogo e inflariam a
  // semelhanca entre produtos que nao tem nada a ver.
  var VAZIAS = ("kit conjunto jogo pacote unidades unidade para com sem "
                + "peças pecas novo nova mini super multi").split(" ");

  function palavras(t) {
    return String(t || "").toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .split(/[^a-z0-9]+/)
      .filter(function (w) { return w.length >= 4 && VAZIAS.indexOf(w) < 0; });
  }

  function parecidos(a, b) {
    var A = palavras(a), B = palavras(b);
    if (!A.length || !B.length) { return 0; }
    var juntas = {}, comuns = 0;
    A.forEach(function (w) { juntas[w] = 1; });
    B.forEach(function (w) {
      if (juntas[w] === 1) { comuns += 1; juntas[w] = 2; }
      else { juntas[w] = juntas[w] || 1; }
    });
    var total = Object.keys(juntas).length;
    return total ? comuns / total : 0;
  }

  function sugerir(card, base) {
    // ⚠️ 'METADE DO PRECO' NAO EXISTE NESTE CATALOGO.
    //
    // A primeira versao exigia <= 50% do item clicado. Num catalogo onde
    // quase tudo custa entre R$ 10 e R$ 20, isso pede um produto de R$ 6 —
    // e o bloco NUNCA aparecia (medido no ar, em 14/09/2026, com um item de
    // R$ 13,52: zero candidatos).
    //
    // ⭐ 20% mais barato E' o que da' a sensacao de 'ja que estou aqui': o
    // suficiente pra parecer acrescimo, nao outra compra. E continua sendo
    // sempre MAIS BARATO que o principal — complemento mais caro nao e'
    // complemento.
    // ⚠️ O TETO E' ARREDONDADO EM CENTAVOS. Sem isso, 13,52 x 0,8 da'
    // 10,816 e o candidato de R$ 10,82 fica de fora por meio centavo — o
    // bloco sumia e parecia que nao havia complemento nenhum (medido no ar).
    var teto = Math.round(num(base.preco) * 80) / 100;
    // ⚠️ COMPLEMENTO NAO E' SUBSTITUTO.
    //
    // A primeira versao sugeria 'Kit de maquiagem com potes e esponjas' pra
    // quem abriu 'Conjunto de esponjas para maquiagem' — o MESMO produto com
    // outro nome. Isso nao soma venda: faz a pessoa reconsiderar a que ela ja'
    // tinha escolhido.
    //
    // ⭐ A medida e' de sobreposicao de palavras (Jaccard). Dois nomes que
    // dividem metade do vocabulario falam da mesma coisa; complemento divide
    // a AREA (que ja' esta' garantida) e pouco mais.
    // ⭐ O JULGAMENTO DO MODELO VEM PRIMEIRO. Ele sabe que esponja combina
    // com estojo e que pote combina com organizador — coisa que contagem de
    // palavra nunca saberia. A regra de palavras fica como RESERVA, pro
    // produto que ainda nao foi julgado.
    var porId = {};
    PRODUTOS.forEach(function (p) { porId[String(p.id)] = p; });
    // ⚠️ QUANDO O MODELO JA' JULGOU, O TETO DE PRECO AFROUXA.
    //
    // Exigir 80% do valor E estar na lista julgada derrubava tudo: o
    // complemento aprovado pelo Gemini quase sempre custa perto do
    // principal, e o bloco simplesmente nao aparecia (medido em 14/09/2026
    // — clique registrado, volta certa, e nenhuma sugestao).
    //
    // ⭐ O que fica de pe' e' 'mais barato que o que voce viu', que e' a
    // promessa; os 80% continuam valendo pra regra de palavras, que nao tem
    // julgamento nenhum pra se apoiar.
    var escolhidos = (base.combina || []).map(function (id) {
      return porId[String(id)];
    }).filter(function (p) {
      return p && p.link !== base.link && num(p.preco) > 0 &&
             num(p.preco) < num(base.preco);
    }).sort(function (a, b) { return num(a.preco) - num(b.preco); });
    if (escolhidos.length) {
      mostrarJuntos(card, escolhidos.slice(0, 2));
      return;
    }

    var juntos = PRODUTOS.filter(function (p) {
      return p.link !== base.link && p.canal === base.canal &&
             num(p.preco) > 0 && num(p.preco) <= teto &&
             parecidos(p.nome, base.nome) <= 0.25;
    }).sort(function (a, b) {
      // o mais barato entre os que mais cairam: barato chama o olho,
      // queda medida sustenta a escolha
      return (b.queda || 0) - (a.queda || 0) || num(a.preco) - num(b.preco);
    }).slice(0, 2);

    // ⚠️ SEM CANDIDATO, NAO INVENTA. Puxar de outro canal, ou produto mais
    // caro, seria encher a tela por encher — e a pessoa acabou de sair.
    if (!juntos.length) { return; }
    mostrarJuntos(card, juntos);
  }

  function mostrarJuntos(card, juntos) {
    var antigo = document.getElementById("junto");
    if (antigo) { antigo.remove(); }

    var caixa = el("div", "junto");
    caixa.id = "junto";
    var titulo = el("h3");
    titulo.appendChild(el("span", "pulso"));
    // ⚠️ NAO SE FALA DE CANAL AQUI. Quem abre o site mae nao precisa saber
    // que existem cinco TikToks por tras — isso e' estrutura nossa, nao
    // informacao util pra quem esta' comprando.
    //
    // ⚠️ E NAO SE ANUNCIA "mais barato": dizer isso sugere que havia algo
    // mais barato guardado. O criterio de escolha continua sendo preco (e
    // isso e' bom), mas o texto fala de COMBINACAO, que e' o motivo real de
    // mostrar.
    titulo.appendChild(el("span", null, "vai bem com o que você viu"));
    var x = el("button", "fechar", "fechar");
    x.type = "button";
    x.addEventListener("click", function (ev) {
      ev.preventDefault();
      caixa.remove();
    });
    titulo.appendChild(x);
    caixa.appendChild(titulo);
    var fila = el("div", "fila");
    juntos.forEach(function (p) { fila.appendChild(montar(p)); });
    caixa.appendChild(fila);
    // ⚠️ SEM CARTAO (veio da linha viva do topo): o bloco entra na FRENTE da
    // grade. Insistir em colocar 'depois do card' quebraria — e cair fora da
    // tela seria pior que nao aparecer.
    if (card) {
      card.insertAdjacentElement("afterend", caixa);
    } else {
      grade.insertBefore(caixa, grade.firstChild);
    }
  }

  function desenhar() {
    var f = FILTROS.filter(function (x) { return x.id === atual; })[0];
    var termo = normal(busca.value.trim());
    var lista = PRODUTOS.filter(function (p) {
      if (!f.cabe(p)) { return false; }
      if (canal && p.canal !== canal) { return false; }
      if (termo && normal(p.nome).indexOf(termo) < 0) { return false; }
      return true;
    });
    if (f.ordem) { lista = lista.slice().sort(f.ordem); }

    grade.innerHTML = "";
    if (!lista.length) {
      var v = el("div", "vazio");
      v.appendChild(el("strong", null, "Nada aqui com esse filtro."));
      v.appendChild(document.createElement("br"));
      v.appendChild(document.createTextNode(
        "Tente outra palavra, ou volte pra Tudo."));
      grade.appendChild(v);
    } else {
      var pedaco = document.createDocumentFragment();
      lista.slice(0, mostrando).forEach(function (p) {
        pedaco.appendChild(montar(p));
      });
      grade.appendChild(pedaco);
      // ⚠️ O BOTAO SO' APARECE SE HOUVER RESTO. Botao que nao faz nada ensina
      // a pessoa a ignorar botao.
      if (lista.length > mostrando) {
        var falta = lista.length - mostrando;
        var mais = el("button", "ver-mais",
          "ver mais " + Math.min(falta, PASSO) + " de " + falta);
        mais.type = "button";
        mais.addEventListener("click", function () {
          mostrando += PASSO;
          desenhar();
        });
        grade.appendChild(mais);
      }
    }
    // ⚠️ A CONTAGEM E' DA LISTA NA TELA, sempre. Numero de cabecalho que nao
    // bate com o que se ve' embaixo e' a mentira mais facil de cometer.
    contagem.textContent = lista.length === 1
      ? "1 achadinho" : lista.length + " achadinhos";
  }

  // ⚠️ FECHAR AO TOCAR FORA. Sem isto o painel fica aberto por cima da
  // lista e a pessoa nao encontra como sair — no telefone nao ha' Esc.
  function fecharMenus() {
    var abertos = document.querySelectorAll(".opcoes");
    for (var i = 0; i < abertos.length; i++) { abertos[i].hidden = true; }
    var bs = document.querySelectorAll(".escolha[aria-expanded='true']");
    for (var j = 0; j < bs.length; j++) {
      bs[j].setAttribute("aria-expanded", "false");
    }
  }
  document.addEventListener("click", fecharMenus);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { fecharMenus(); }
  });

  function montarChips() {
    var caixa = document.getElementById("chips");
    // limpar antes de remontar: sem isto cada troca ANEXA controles novos e
    // os antigos ficam na tela com o estado velho.
    caixa.innerHTML = "";

    // DOIS SELETORES, UMA LINHA.
    //
    // Duas tentativas erradas antes desta, e vale saber por que:
    //   1. fila de chips com ROLAGEM HORIZONTAL — escondia metade das
    //      opcoes; pra achar "Fitness" a pessoa arrastava as cegas.
    //   2. chips quebrando em LINHAS — tudo visivel, mas viraram CINCO
    //      linhas e empurraram os produtos pra fora da tela.
    //
    // O seletor nativo resolve os dois: ocupa UMA linha e, ao tocar, o iOS
    // abre a roda do sistema com todas as opcoes de uma vez. O filtro e'
    // acessorio; o produto e' o principal e nao pode sair da primeira tela.
    //
    // A contagem vai DENTRO da opcao ("Beleza (13)"): responde antes da
    // escolha o que a pessoa so' descobriria depois.
    function seletor(titulo, opcoes, valorAtual, aoMudar, temFiltro) {
      var cx = el("div", "escolha-caixa");
      var sel = opcoes.filter(function (o) { return o.id === valorAtual; })[0]
                || opcoes[0];
      // ⭐ ROTULO FIXO + VALOR, e nao so' o valor. "Tudo (62)" sozinho nao
      // diz sobre O QUE aquele menu decide; "Preço: tudo" diz. E' o padrao
      // de loja seria — o menu se apresenta antes de mostrar a escolha.
      var b = el("button", "escolha");
      var fixo = el("span", "rotulo-fixo", titulo);
      var val = el("span", "valor-escolhido", sel.rotulo);
      b.appendChild(fixo);
      b.appendChild(val);
      if (sel.n != null) { b.appendChild(el("span", "n", String(sel.n))); }
      b.type = "button";
      b.setAttribute("aria-expanded", "false");
      b.setAttribute("aria-haspopup", "listbox");
      b.setAttribute("data-ativo", temFiltro ? "sim" : "nao");
      b.setAttribute("data-icone",
        titulo === "Preço" ? "preco" : "categoria");

      var painel = el("div", "opcoes");
      painel.setAttribute("role", "listbox");
      painel.hidden = true;
      opcoes.forEach(function (o) {
        var op = el("button", "opcao", o.rotulo);
        op.type = "button";
        op.setAttribute("role", "option");
        op.setAttribute("aria-selected", String(o.id === valorAtual));
        if (o.n != null) { op.appendChild(el("span", "n", String(o.n))); }
        op.addEventListener("click", function (ev) {
          ev.stopPropagation();
          fecharMenus();
          aoMudar(o.id);
        });
        painel.appendChild(op);
      });

      b.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var vaiAbrir = painel.hidden;
        // fecha o OUTRO menu antes: dois paineis abertos se sobrepoem e a
        // pessoa toca no que nao esta' vendo.
        fecharMenus();
        if (vaiAbrir) {
          painel.hidden = false;
          b.setAttribute("aria-expanded", "true");
        }
      });

      cx.appendChild(b);
      cx.appendChild(painel);
      return cx;
    }

    var deEstado = FILTROS.map(function (f) {
      return {
        id: f.id, rotulo: f.rotulo,
        n: PRODUTOS.filter(function (p) {
          return f.cabe(p) && (!canal || p.canal === canal);
        }).length
      };
    });
    caixa.appendChild(seletor("Preço", deEstado, atual, function (v) {
      atual = v;
      mostrando = PASSO;
      montarChips();
      desenhar();
    }, atual !== "todos"));

    var canais = {};
    PRODUTOS.forEach(function (p) {
      if (p.canal) { canais[p.canal] = (canais[p.canal] || 0) + 1; }
    });
    var areas = Object.keys(canais).sort(function (a, b) {
      return canais[b] - canais[a];
    });
    if (areas.length) {
      var deArea = [{ id: "", rotulo: "todas", n: PRODUTOS.length }];
      areas.forEach(function (c) {
        deArea.push({ id: c, rotulo: c, n: canais[c] });
      });
      caixa.appendChild(seletor("Categoria", deArea, canal, function (v) {
        canal = v;
        montarChips();
        desenhar();
      }, canal !== ""));
    }
  }

  function montarProva() {
    var caixa = document.getElementById("prova");
    if (!PRODUTOS.length) { return; }
    var precos = PRODUTOS.map(function (p) { return num(p.preco); })
      .filter(function (v) { return v > 0; });
    var vendas = PRODUTOS.reduce(function (a, p) { return a + (p.vendas || 0); }, 0);
    var caiu = PRODUTOS.filter(function (p) { return (p.queda || 0) >= 5; }).length;

    // ⚠️ CADA NUMERO SO' APARECE SE EXISTIR. Prova social com zero prova o
    // contrario do que pretende.
    var linhas = [[String(PRODUTOS.length), "achadinhos de pé agora"]];
    if (caiu) { linhas.push([caiu + " de " + PRODUTOS.length, "baixaram de preço"]); }
    if (vendas > 0) {
      linhas.push([vendas.toLocaleString("pt-BR"), "vendas destes na loja"]);
    } else if (precos.length) {
      linhas.push(["R$ " + Math.min.apply(null, precos).toFixed(2).replace(".", ","),
                   "o mais barato de hoje"]);
    }
    linhas.forEach(function (par) {
      var d = el("div");
      d.appendChild(el("strong", "numero", par[0]));
      d.appendChild(el("span", "oque", par[1]));
      caixa.appendChild(d);
    });
  }

  // ⚠️ UM RELOGIO SO'. Dois `setTimeout` escrevendo no mesmo paragrafo
  // embaralham o texto — letra de um produto no meio do outro.
  var relogio = null;
  var vivoAtual = null;

  function escapar(t) {
    var d = document.createElement("div");
    d.textContent = t;
    return d.innerHTML;
  }

  function animarVivo() {
    var alvo = document.getElementById("vivo");
    var aNome = document.getElementById("vivo_nome");
    var aPreco = document.getElementById("vivo_preco");
    var aDica = document.getElementById("vivo_dica");
    if (relogio) { clearTimeout(relogio); relogio = null; }

    // ⭐ OS QUE MAIS CAIRAM PRIMEIRO: se so' da' tempo de ver um, que seja
    // o que melhor prova a promessa da pagina.
    var lista = PRODUTOS.slice().sort(function (a, b) {
      return (b.queda || 0) - (a.queda || 0);
    }).slice(0, 8);
    if (!lista.length) { alvo.hidden = true; return; }

    var calmo = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var i = 0;

    function proximo() {
      var p = lista[i % lista.length];
      i += 1;
      vivoAtual = p;
      alvo.href = p.link;
      aDica.textContent = "toque para ver na loja →";
      aPreco.innerHTML = "";
      var curto = String(p.nome || "").trim();

      function fecharPreco() {
        aPreco.innerHTML = escapar(p.preco) +
          (p.antes ? "<s>" + escapar(p.antes) + "</s>" : "") +
          ((p.queda || 0) >= 5
            ? '<span class="pct">↓ ' + Math.round(p.queda) + '%</span>'
            : "");
        aPreco.classList.remove("entra");
        void aPreco.offsetWidth;
        aPreco.classList.add("entra");
      }
      if (calmo) {
        aNome.textContent = curto;
        fecharPreco();
        relogio = setTimeout(proximo, 3400);
        return;
      }
      var n = 0;
      (function digitar() {
        n += 1;
        aNome.innerHTML = escapar(curto.slice(0, n)) + '<span class="cursor"></span>';
        if (n < curto.length) {
          relogio = setTimeout(digitar, 24);
          return;
        }
        aNome.textContent = curto;
        fecharPreco();
        relogio = setTimeout(proximo, 2600);
      })();
    }
    proximo();

    // ⚠️ O DEDO PARA O CARROSSEL, e ele volta sozinho em 6s. Sem parar, o
    // produto podia rodar entre o toque e o clique e a pessoa abriria um
    // item que nao escolheu. Sem voltar, um encostao congelava a linha.
    var retomar = null;
    ["pointerdown", "touchstart"].forEach(function (ev) {
      alvo.addEventListener(ev, function () {
        if (relogio) { clearTimeout(relogio); relogio = null; }
        if (retomar) { clearTimeout(retomar); }
        retomar = setTimeout(function () {
          if (!relogio) { animarVivo(); }
        }, 6000);
      }, { passive: true });
    });
    alvo.addEventListener("click", function () {
      if (!vivoAtual) { return; }
      try {
        sessionStorage.setItem("ultimo", vivoAtual.id || vivoAtual.link);
      } catch (e) { /* sem sessao: segue sem upsell */ }
    });
  }

  if (BRASAO) {
    var img = document.createElement("img");
    img.src = BRASAO;
    img.alt = "Achadinho Total";
    document.getElementById("logo").appendChild(img);
  }
  // ⚠️ O UPSELL ACONTECE NA VOLTA, e nao na saida.
  //
  // Antes ele contava com a nossa aba viva atras — e como a aba nova nem
  // abria, ele nunca era visto no celular. Agora o gatilho e' a pessoa
  // ESTAR aqui de novo: ela viu o produto na loja e voltou.
  //
  // ⚠️ `pageshow` e nao `load`: voltando pelo botao 'voltar' o Safari
  // restaura a pagina do cache (bfcache) e `load` NAO dispara.
  window.addEventListener("pageshow", function () {
    var id;
    try {
      id = sessionStorage.getItem("ultimo");
      sessionStorage.removeItem("ultimo");
    } catch (e) { return; }
    if (!id) { return; }
    var base = PRODUTOS.filter(function (p) {
      return String(p.id) === String(id) || p.link === id;
    })[0];
    if (!base) { return; }
    // espera a grade existir antes de tentar encaixar o bloco
    setTimeout(function () { sugerir(null, base); }, 60);
  });

  animarVivo();
  montarProva();
  montarChips();
  desenhar();
  // ⚠️ BUSCAR REINICIA A CONTAGEM. Sem isto, quem ja' tinha clicado em "ver
  // mais" e depois digita fica com um limite alto colado numa lista curta —
  // e o oposto tambem: acha 80 resultados e ve' 30 sem entender por que.
  busca.addEventListener("input", function () {
    mostrando = PASSO;
    desenhar();
  });
})();
</script>
