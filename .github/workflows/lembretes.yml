name: Lembretes (datas de promocao + pendencias abertas)

on:
  schedule:
    - cron: "0 11 * * *"   # 08:00 Sao Paulo
  workflow_dispatch:
    inputs:
      pendencias:
        description: "1 = manda a lista de pendencias hoje (normal: so' segunda)"
        required: false
        default: ""

jobs:
  lembrar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -X utf8 ferramentas/lembretes.py ${{ inputs.pendencias == '1' && '--forcar-pendencias' || '' }}
