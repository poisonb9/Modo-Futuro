# Videos de oferta do dia — Pago Menos (@fatura.chora), @achadinhos.instantaneos e @achadinhototal.
#
# ⭐ 29/09/2026 (dono): 4 videos por dia em cada canal, so' com queda REAL
# (engine/ofertas.py: mediana da nossa serie, nota >= 4,7, >= 1.000 vendas,
# sem marca famosa). ⛔ Por enquanto SO' A MAO e SO' GERA: os canais ainda nao
# tem Buffer, e o dono aprova a previa antes de ligar o horario.
name: Ofertas

on:
  workflow_dispatch:
    inputs:
      ensaio:
        description: "so' dizer o que faria (true/false)"
        default: "true"
      registrar:
        description: "o video VAI AO AR? (entra na bio e no registro) true/false"
        default: "false"
      agendar:
        description: "por na fila do Buffer de cada canal? (exige registrar=true)"
        default: "false"
      ja:
        description: "1o post de cada canal sai em 5-15 min (true/false)"
        default: "false"
      so:
        description: "so' estes ids de produto (virgula); vazio = todos"
        default: ""

jobs:
  gerar:
    runs-on: ubuntu-latest
    concurrency:
      group: ofertas
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y -qq ffmpeg && pip install -q pillow edge-tts requests python-dotenv
      # ⭐ 30/09/2026 (dono: "a dublagem esta' horrivel... como nos nossos
      # canais"): a MESMA voz dos cortes — edge-tts -> ChatterboxVC com o timbre
      # da amostra (engine/voz_clonada, motor D). Passos copiados do
      # cortar_de_bruto.yml. Se algo aqui falhar, o video sai com a voz simples.
      - name: Cache do modelo de voz clonada (Chatterbox)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/huggingface
          key: chatterbox-hf-cache-v1
      - name: Instalar voz clonada e amostra
        continue-on-error: true
        env:
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
          GOOGLE_OAUTH_TOKEN_JSON_2: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_2 }}
        run: |
          pip install -q -r requirements.txt
          pip install -q --upgrade "setuptools>=70"
          pip install -q chatterbox-tts
          pip install -q --force-reinstall --no-deps resemble-perth
          mkdir -p vozes
          python -X utf8 baixar_bruto_drive.py --file-id "1vGJd2pa-ogzV1Z3vmVR926k72auLbmI-" --destino "vozes/_m" --conta "reserva"
          ffmpeg -y -v error -i vozes/_m -ar 24000 -ac 1 vozes/bryan_amostra.wav && rm -f vozes/_m
          ls -la vozes/
      - name: Gerar
        env:
          GH_TOKEN: ${{ github.token }}
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
          # ⭐ 30/09/2026: um secret por canal (nomes do canais_registro.env).
          PAGOMENOS: ${{ secrets.PAGOMENOS }}
          ACHADINHOSINSTANTANEOS: ${{ secrets.ACHADINHOSINSTANTANEOS }}
          ACHADINHOTOTAL: ${{ secrets.ACHADINHOTOTAL }}
        run: |
          E=""; [ "${{ inputs.ensaio }}" = "true" ] && E="--ensaio"
          [ "${{ inputs.registrar }}" = "true" ] && E="$E --registrar"
          [ "${{ inputs.agendar }}" = "true" ] && E="$E --agendar"
          [ "${{ inputs.ja }}" = "true" ] && E="$E --ja"
          python -X utf8 ferramentas/ofertas_do_dia.py --pasta saida $E --so "${{ inputs.so }}"
      - name: Guardar o registro
        if: inputs.ensaio != 'true' && inputs.registrar == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in estado/ofertas_feitas.jsonl estado/produtos_publicados.jsonl; do
            [ -f "$f" ] && git add -f "$f" || true
          done
          git diff --cached --quiet && exit 0
          git commit -m "ofertas: videos do dia"
          git pull --rebase
          git push
