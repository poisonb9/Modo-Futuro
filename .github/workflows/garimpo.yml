# O garimpo: acha o produto que merece video.
#
# ⚠️ RODA NA NUVEM porque a maquina local NAO alcanca os gateways da API do
# AliExpress (timeout no handshake TLS, medido em 12/09/2026).
#
# ⚠️ E ELE COMMITA O HISTORICO DE PRECO DE VOLTA. Runner e' efemero: sem o
# commit, a serie de precos morre no fim do job — e a serie E' o ativo, e' o
# que separa desconto de verdade do "de/por" inflado da loja. Este motor ja'
# perdeu estado tres vezes por esquecer isso.
name: Garimpo

on:
  workflow_dispatch:
    inputs:
      canal:
        description: canal
        required: true
        default: achadinhos.instantaneos
  schedule:
    - cron: '0 11 * * *'

jobs:
  garimpar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests python-dotenv
      - name: Garimpar
        env:
          ALIEXPRESS_APP_KEY:    ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          MELI_CLIENT_ID:        ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET:    ${{ secrets.MELI_CLIENT_SECRET }}
          MELI_MATT_WORD:        ${{ secrets.MELI_MATT_WORD }}
          MELI_MATT_TOOL:        ${{ secrets.MELI_MATT_TOOL }}
          AWIN_TOKEN:            ${{ secrets.AWIN_TOKEN }}
          AWIN_PUBLISHER_ID:     ${{ secrets.AWIN_PUBLISHER_ID }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # ⚠️ EM PARALELO, e nao em fila. Ate' 13/09/2026 os cinco canais
          # rodavam em sequencia: se um travava numa chamada lenta, os
          # outros quatro esperavam — e o Actions cobra minuto.
          #
          # ⚠️ `wait` no fim e' obrigatorio: sem ele o passo termina antes
          # dos filhos e o commit do estado sai pela metade, sem erro.
          # ⚠️ 8 POR CANAL (era 5) e 97 termos (eram 27), desde 14/09/2026:
          # o catalogo tinha 25 produtos e isso e' pouco pra vitrine e pouco
          # demais pro upsell. Ampliar a BUSCA, sem baixar o filtro.
          for c in truque.importado cozinha.importada achadinhos.instantaneos fatura.chora atefalhar; do
            ( echo "===== $c"; python -X utf8 -m engine.garimpo --canal "$c" --quantos 8 2>&1 ) &
          done
          wait
          # ⚠️ A VARREDURA VEM DEPOIS DOS CANAIS, e nunca antes: ela e'
          # bonus (so' alimenta o historico de preco) e nao pode consumir
          # cota de API que o garimpo de verdade precisa.
          echo "===== varredura (so historico)"
          python -X utf8 -m engine.garimpo --varrer || true
          echo "===== vigia (itens que acompanhamos de perto)"
          python -X utf8 -m engine.garimpo --vigiar || true
          # ⚠️ DEPOIS da varredura: os campeoes saem DOS DADOS que ela
          # acabou de coletar. Rodar antes acompanharia a lista de ontem.
          echo "===== campeoes (os que mais vendem, pelo ID)"
          python -X utf8 -m engine.garimpo --campeoes || true
          # ⚠️ DEPOIS dos campeoes: a tendencia le' a serie que eles
          # acabaram de alimentar. E responde outra pergunta — campeao e'
          # NIVEL (quem vende muito), tendencia e' MOMENTUM (quem vende
          # cada vez mais). As duas listas podem nao se cruzar.
          echo "===== tendencia (quem esta acelerando)"
          python -X utf8 -m engine.garimpo --tendencia || true
          # ⚠️ POR ULTIMO, e com `|| true`: e' AVISO, nao coleta. Se o Awin
          # estiver fora do ar, ou se faltar o secret, a rodada do garimpo
          # nao pode morrer por causa disso — o ativo aqui e' a serie de
          # precos, e ela ja' foi coletada acima.
          #
          # ⚠️ NA ESTREIA ELE NAO AVISA NADA, de proposito: sem linha de
          # base as 28 pendentes virariam 28 'novidades'.
          echo "===== awin (avisa so se mudou)"
          python -X utf8 -m engine.awin --vigiar || true
          echo "===== pedidos e placar"
          python -X utf8 -m engine.resultado --pedidos --placar || true
      - name: Guardar o historico de preco
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ⚠️ UM POR UM, E SO' SE EXISTIR. MEDIDO em 13/09/2026: eu pus os
          # tres arquivos num `git add` so', e o `estado/pedidos.jsonl`
          # ainda nao existia (nao ha' pedido nenhum). O git recusou a
          # LISTA INTEIRA, o passo morreu com `set -e`, e o runner efemero
          # levou embora os precos que a rodada tinha acabado de coletar.
          #
          # ⭐ Terceira vez que este motor perde estado por `git add` que
          # falha. Arquivo que pode nao existir NUNCA entra numa lista com
          # os outros.
          for f in estado/precos_vistos.jsonl estado/produtos_publicados.jsonl estado/pedidos.jsonl estado/awin_programas.json; do
            [ -f "$f" ] && git add -f "$f" || echo "  (ainda nao existe: $f)"
          done
          git diff --cached --quiet || git commit -m "garimpo: precos vistos"
          # ⚠️ `git push` TEM DE FALHAR ALTO se nao subir. Empurrar sem
          # conferir e' como dizer "esta' no ar" olhando o status do
          # push — erro que ja' custou uma tarde nesta operacao.
          git push
          echo "estado commitado: $(git rev-parse --short HEAD)"
