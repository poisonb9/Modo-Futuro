name: Repor fila (diario, 09:00 Sao Paulo)

# Confere a fila dos canais e repoe a que estiver abaixo do piso.
#
# POR QUE AQUI E NAO NUM AGENTE DE NUVEM
#
# Pedido do Bryan em 31/08/2026: "olha uma vez por dia e cheque a fila e
# reponha ela caso tenha videos bons confirmados para rodar".
#
# ⚠️ Um agente na nuvem da Anthropic NAO consegue ler o `CREDENCIAIS.md`, que
# e' local e esta' fora de todo repositorio de proposito. Os tokens do Buffer
# so' existem em dois lugares: no disco do Bryan e nos SECRETS deste
# repositorio. O Actions e' o unico que ja' tem tudo — e roda de graca, porque
# o repo e' publico.
#
# ⚠️ NAO CORTA VIDEO. So' agenda o que ja' existe no manifesto das releases.
# Se nao houver clipe elegivel, avisa no Telegram e para. Disparar corte novo
# custa runner e e' decisao do Bryan.

on:
  schedule:
    # 12:00 UTC = 09:00 em Sao Paulo (UTC-3)
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      piso:
        description: "Repoe o canal quando a fila estiver ABAIXO deste numero"
        required: false
        default: "5"
      detalhe:
        description: "1 = lista horarios (saiu/agendado) de cada canal"
        required: false
        default: ""
      canais:
        description: "Quais conferir, separados por virgula. Vazio = os que o Bryan liberou (hoje so' modofuturo)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  repor:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: bash ferramentas/instalar_ffmpeg.sh && pip install -r requirements.txt

      - name: Conferir e repor
        env:
          PISO: ${{ inputs.piso || '5' }}
          CANAIS: ${{ inputs.canais }}
          DETALHE: ${{ inputs.detalhe }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_TOKEN_COZINHA: ${{ secrets.BUFFER_TOKEN_COZINHA }}
          BUFFER_TOKEN_SEMANESTESIA: ${{ secrets.BUFFER_TOKEN_SEMANESTESIA }}
          BUFFER_TOKEN_ATEFALHAR: ${{ secrets.BUFFER_TOKEN_ATEFALHAR }}
          BUFFER_TOKEN_TRUQUEIMPORTADO: ${{ secrets.BUFFER_TOKEN_TRUQUEIMPORTADO }}
          BUFFER_TOKEN_CAMARIM: ${{ secrets.BUFFER_TOKEN_CAMARIM }}
          # 29/09/2026: o agendador OUVE o clipe e confere o titulo (Gemini)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          GEMINI_API_KEY_21: ${{ secrets.GEMINI21 }}
          GEMINI_API_KEY_22: ${{ secrets.GEMINI_API_KEY_22 }}
          GEMINI_API_KEY_23: ${{ secrets.GEMINI_API_KEY_23 }}
          GEMINI_API_KEY_24: ${{ secrets.GEMINI_API_KEY_24 }}
          GEMINI_API_KEY_25: ${{ secrets.GEMINI_API_KEY_25 }}
          GEMINI_API_KEY_26: ${{ secrets.GEMINI_API_KEY_26 }}
          GEMINI_API_KEY_27: ${{ secrets.GEMINI_API_KEY_27 }}
          GEMINI_API_KEY_28: ${{ secrets.GEMINI_API_KEY_28 }}
          GEMINI_API_KEY_29: ${{ secrets.GEMINI_API_KEY_29 }}
          GEMINI_API_KEY_30: ${{ secrets.GEMINI_API_KEY_30 }}
          GEMINI_API_KEY_31: ${{ secrets.GEMINI_API_KEY_31 }}
        run: python -X utf8 -u repor_fila.py

      - name: Conferir o que ja' foi ao ar (registro de clipes)
        if: always()
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_TOKEN_COZINHA: ${{ secrets.BUFFER_TOKEN_COZINHA }}
          BUFFER_TOKEN_SEMANESTESIA: ${{ secrets.BUFFER_TOKEN_SEMANESTESIA }}
          BUFFER_TOKEN_ATEFALHAR: ${{ secrets.BUFFER_TOKEN_ATEFALHAR }}
          BUFFER_TOKEN_TRUQUEIMPORTADO: ${{ secrets.BUFFER_TOKEN_TRUQUEIMPORTADO }}
          BUFFER_TOKEN_CAMARIM: ${{ secrets.BUFFER_TOKEN_CAMARIM }}
        run: python -X utf8 conferir_postados.py

      - name: Guardar o registro
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet registro_clipes.json 2>/dev/null; then
            git add registro_clipes.json && git commit -m "registro: postagens conferidas" && git push
          else
            echo "registro inalterado"
          fi

      - name: Painel das filas
        if: always()
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_TOKEN_COZINHA: ${{ secrets.BUFFER_TOKEN_COZINHA }}
          BUFFER_TOKEN_SEMANESTESIA: ${{ secrets.BUFFER_TOKEN_SEMANESTESIA }}
          BUFFER_TOKEN_ATEFALHAR: ${{ secrets.BUFFER_TOKEN_ATEFALHAR }}
          BUFFER_TOKEN_TRUQUEIMPORTADO: ${{ secrets.BUFFER_TOKEN_TRUQUEIMPORTADO }}
          BUFFER_TOKEN_CAMARIM: ${{ secrets.BUFFER_TOKEN_CAMARIM }}
        run: python -X utf8 painel_filas.py | tee -a relato_fila.txt

      - name: Avisar no Telegram
        # ⛔ 26/09/2026, dono: "por enquanto sem avisos pra mim". Religar com a
        # variavel do repo AVISOS_TELEGRAM=1 (gh variable set AVISOS_TELEGRAM --body 1).
        if: ${{ always() && vars.AVISOS_TELEGRAM == '1' }}
        env:
          RELATO: ${{ env.RELATO }}
        run: |
          if [ -f relato_fila.txt ]; then T="$(cat relato_fila.txt)"
          elif [ "${{ job.status }}" = "success" ]; then T="Fila conferida — nada a repor."
          else T="Conferencia de fila FALHOU: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode text="$T"
