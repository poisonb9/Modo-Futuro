# Troca a legenda dos posts ja' agendados no Buffer pelo formato do canal
# (engine/legenda_canais.py). Criado em 27/09/2026. Ver trocar_legendas_agendadas.py.
name: Trocar legendas agendadas
on:
  workflow_dispatch:
    inputs:
      canal:
        description: "modofuturo, truque.importado, semanestesia.pod ou atefalhar"
        required: true
      simular:
        description: "true = so' mostra o antes/depois"
        default: "true"
      id:
        description: "(opcional) so' este post do Buffer"
        default: ""
      video:
        description: "(opcional, com id) url do video novo; mantem o texto"
        default: ""
      hora:
        description: "(opcional, com id) novo horario ISO UTC; mantem texto e video"
        default: ""
      criar:
        description: "(opcional) url do video: cria post NOVO; com hora (SP, AAAA-MM-DDTHH:MM) e titulo"
        default: ""
      titulo:
        description: "(opcional, com criar) parte do titulo do clipe no manifesto"
        default: ""
      so_hashtags:
        description: "true = so' corta pra 3 hashtags (mantem texto e video)"
        default: "false"
      texto:
        description: "(opcional, com id) corpo da legenda; use \n para quebrar linha"
        default: ""
      linha:
        description: "(opcional, com id e hora) linha inserida antes das hashtags"
        default: ""
      apagar:
        description: "true = com id, EXCLUI o post agendado (so' com pedido do dono)"
        default: "false"
jobs:
  trocar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests python-dotenv
      - name: Trocar
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_TOKEN_SEMANESTESIA: ${{ secrets.BUFFER_TOKEN_SEMANESTESIA }}
          BUFFER_TOKEN_ATEFALHAR: ${{ secrets.BUFFER_TOKEN_ATEFALHAR }}
          BUFFER_TOKEN_TRUQUEIMPORTADO: ${{ secrets.BUFFER_TOKEN_TRUQUEIMPORTADO }}
          BUFFER_TOKEN_COZINHA: ${{ secrets.BUFFER_TOKEN_COZINHA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          GEMINI_API_KEY_21: ${{ secrets.GEMINI21 }}
          GEMINI_API_KEY_22: ${{ secrets.GEMINI_API_KEY_22 }}
          GEMINI_API_KEY_23: ${{ secrets.GEMINI_API_KEY_23 }}
          GEMINI_API_KEY_24: ${{ secrets.GEMINI_API_KEY_24 }}
          GEMINI_API_KEY_25: ${{ secrets.GEMINI_API_KEY_25 }}
          GEMINI_API_KEY_26: ${{ secrets.GEMINI_API_KEY_26 }}
          GEMINI_API_KEY_27: ${{ secrets.GEMINI_API_KEY_27 }}
          GEMINI_API_KEY_28: ${{ secrets.GEMINI_API_KEY_28 }}
          GEMINI_API_KEY_29: ${{ secrets.GEMINI_API_KEY_29 }}
          GEMINI_API_KEY_30: ${{ secrets.GEMINI_API_KEY_30 }}
          GEMINI_API_KEY_31: ${{ secrets.GEMINI_API_KEY_31 }}
        run: |
          if [ "${{ inputs.simular }}" = "true" ]; then S=--simular; else S=; fi
          EXTRA=()
          [ -n "${{ inputs.id }}" ] && EXTRA+=(--id "${{ inputs.id }}")
          [ -n "${{ inputs.texto }}" ] && EXTRA+=(--texto "${{ inputs.texto }}")
          [ -n "${{ inputs.hora }}" ] && EXTRA+=(--hora "${{ inputs.hora }}")
          [ -n "${{ inputs.criar }}" ] && EXTRA+=(--criar "${{ inputs.criar }}" --titulo "${{ inputs.titulo }}")
          [ "${{ inputs.so_hashtags }}" = "true" ] && EXTRA+=(--so-hashtags)
          [ "${{ inputs.apagar }}" = "true" ] && EXTRA+=(--apagar)
          [ -n "${{ inputs.linha }}" ] && EXTRA+=(--linha "${{ inputs.linha }}")
          [ -n "${{ inputs.video }}" ] && EXTRA+=(--video "${{ inputs.video }}")
          python -X utf8 trocar_legendas_agendadas.py --canal "${{ inputs.canal }}" $S "${EXTRA[@]}"
