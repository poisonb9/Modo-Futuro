<style>
  /* ⚠️ A COPY DESTA PAGINA SEGUE UMA LISTA DE VERIFICACAO, e nao o gosto de
     quem escreveu. Ela vem do acervo dos Maestros (Nick Saraev, DEMONSTRADO):
     giving · micro commitment · social proof · authority · rapport · scarcity.

     Onde cada uma esta', e com o que a gente PROVA:
       giving      o preco acompanhado e a queda medida — informacao que a
                   loja nao da'
       micro       o pedido nao e' "compre": e' ver, filtrar, entrar no canal
       social      as vendas que as pecas ja' tem na loja, medidas
       authority   a nossa serie de precos, com data e numero de pontos
       rapport     primeira pessoa, sem jargao de loja
       scarcity    ⚠️ AQUI A GENTE DIVERGE DO ACERVO DE PROPOSITO. A ficha
                   demonstra timer de 90s e "so' restam 150 copias" (Iman
                   Gadzhi). Numa pagina cujo unico diferencial e' o preco ser
                   VERIFICAVEL, escassez fabricada queima exatamente o que
                   sustenta tudo. A nossa e' real: o preco muda, e o que esta'
                   aqui e' o de hoje. */

  /* ⚠️ A PALETA SAI DA MARCA, e nao do padrao de quem gerou o codigo.

     O acervo dos Maestros tem uma ficha DEMONSTRADA que descreve o defeito
     com todas as letras: "evitar que o modelo gere interfaces genericas
     ROXAS" — o remedio proposto e' paleta exata, tipografia com intencao,
     elemento de assinatura e risco estetico.

     Esta pagina era #5B21F5: o roxo padrao. A marca ja' tinha cor propria
     e ninguem tinha olhado pra ela — a lupa e' OURO com cromo.

     ⭐ E A HIERARQUIA PASSA A TER UM DONO SO': o Bryan viu o bloco de prova
     e o preco com a mesma cor e a mesma fonte, competindo ("ta meio
     redundante"). Agora o PRECO e' tinta cheia em Archivo Black, e o ouro
     e' so' de selo e numero de prova. Duas vozes, nao duas cores iguais. */
  :root {
    --respiro: 18px;
    --tinta: #16151c;
    --fraco: #6f6b7d;
    --linha: #e6e3ec;
    --fundo: #faf9fc;
    --caixa: #fff;
    /* o ouro da lupa, e o cromo que faz o aro dela */
    --ouro: #C8901A;
    --ouro-claro: #F2C94C;
    --painel: #17161d;
    --verde: #16a34a;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --tinta: #f4f2f9; --fraco: #a5a1b4; --linha: #2b2733;
      --fundo: #0f0e13; --caixa: #191823; --painel: #08080b;
      --ouro: #F0B62E;
    }
  }
  * { box-sizing: border-box; }
  html { overflow-x: clip; }
  body {
    margin: 0; overflow-x: clip;
    background: var(--fundo); color: var(--tinta);
    font: 16px/1.55 Poppins, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .faixa { max-width: 980px; margin: 0 auto; padding: 0 var(--respiro); }

  /* ---------------- topo ---------------- */
  header { text-align: center; padding: 34px 0 6px; }
  .marca-logo {
    width: 86px; height: 86px; margin: 0 auto 12px; border-radius: 50%;
    overflow: hidden; display: block;
  }
  .marca-logo img { width: 100%; height: 100%; display: block; }
  .marca-nome {
    font: 700 12px/1 var(--mono); letter-spacing: .2em;
    text-transform: uppercase; color: var(--fraco); margin: 0 0 8px;
  }
  h1 {
    font-family: "Archivo Black", system-ui, sans-serif;
    font-size: clamp(28px, 7.2vw, 46px); line-height: 1.05;
    letter-spacing: -.025em; margin: 0 0 12px;
  }
  /* o unico ouro do texto: a promessa. Duas palavras, e so' */
  h1 em { font-style: normal; color: var(--ouro); }
  .promessa {
    margin: 0 auto 18px; max-width: 46ch; color: var(--fraco);
    font-size: 15.5px;
  }

  /* ⚠️ ALTURA FIXA. Nome de uma ou de duas linhas mudava a altura e a
     pagina inteira subia e descia a cada troca — o defeito que o Bryan
     chamou de "tremendo" nas bios, em 14/09/2026. */
  .vivo {
    height: 92px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    margin: 0 auto 6px; max-width: 34ch; text-decoration: none;
    color: inherit; border-radius: 12px; padding: 6px 10px;
  }
  .vivo:active { background: color-mix(in srgb, var(--tinta) 6%, transparent); }
  .vivo-nome {
    font-size: 15px; line-height: 1.25; color: var(--tinta);
    height: 38px; overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .vivo-preco {
    height: 26px; font: 700 22px/1 var(--mono); color: var(--tinta);
  }
  .vivo-preco s {
    font: 400 12px/1 var(--mono); color: var(--fraco); margin-left: 8px;
  }
  .vivo-preco .pct {
    display: inline-block; margin-left: 8px; vertical-align: 2px;
    background: var(--ouro-claro); color: #17161d;
    font: 700 11px/1 var(--mono); padding: 4px 6px; border-radius: 999px;
  }
  .vivo-preco.entra { animation: impulso .5s cubic-bezier(.2,1.5,.3,1) both; }
  @keyframes impulso {
    0% { transform: scale(.74); opacity: 0; }
    58% { transform: scale(1.09); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .vivo-dica { font-size: 11.5px; color: var(--fraco); }
  .cursor {
    display: inline-block; width: 2px; height: 1em; margin-left: 1px;
    background: var(--ouro); vertical-align: -2px;
    animation: piscar 1.05s step-end infinite;
  }
  @keyframes piscar { 50% { opacity: 0; } }

  /* ⭐ O UPSELL. Aparece DEPOIS do clique, no lugar onde a pessoa estava —
     a loja abriu noutra aba, e quando ela volta o complemento esta' aqui. */
  .junto {
    grid-column: 1 / -1; border: 1px dashed var(--ouro);
    border-radius: 14px; padding: 13px; margin: 2px 0;
    background: color-mix(in srgb, var(--ouro) 7%, transparent);
  }
  .junto h3 {
    margin: 0 0 9px; font-size: 13.5px; display: flex;
    align-items: center; gap: 7px;
  }
  .junto .fila { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  .junto .fechar {
    margin-left: auto; border: 0; background: none; cursor: pointer;
    color: var(--fraco); font: 500 12px/1 var(--mono);
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor, .vivo-preco.entra { animation: none; }
  }

  /* ---------------- prova ---------------- */
  /* ⭐ O RISCO ESTETICO: um painel escuro no meio de uma pagina clara.

     Ele separa a prova do resto sem precisar de cor forte no texto, e da'
     a cara de instrumento — que e' o que a operacao faz de diferente:
     medir preco. Os numeros sao OURO, o preco dos produtos e' TINTA: cada
     um com a sua voz, e nenhum competindo com o outro. */
  .prova {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 4px; margin: 20px 0 8px; text-align: center;
    background: var(--painel); border-radius: 16px;
    padding: 16px 8px; align-items: start;
  }
  .prova > div { padding: 0 4px; position: relative; }
  .prova > div + div::before {
    content: ""; position: absolute; left: 0; top: 3px; bottom: 3px;
    width: 1px; background: rgba(255,255,255,.12);
  }
  .prova .numero {
    display: block; font: 700 19px/1.1 var(--mono); color: var(--ouro-claro);
    letter-spacing: -.02em;
  }
  .prova .oque {
    display: block; font-size: 10.5px; line-height: 1.35;
    color: rgba(255,255,255,.62); margin-top: 6px;
  }

  /* ⭐ O MULTOMETRO — DENTRO da prova, como quarta linha, fina. "Junta os
     dois paineis, grafico bem fininho, o valor tem que chamar atencao, nao
     quero card grande" (Bryan, 16/09/2026). */
  /* COMPACTA (Bryan, 16/09): uma linha so' — valor, rotulo ao lado, linha
     fininha a` direita. "medido por mim" vai pro title. */
  /* ⚠️ o fio fica a MESMA distancia dos numeros de cima e do valor de
     baixo (14 px / 14 px) — antes o valor colava no fio (Bryan, 16/09) */
  /* ⚠️ `.prova > .economia`, e nao `.economia`: a regra `.prova > div`
     (padding 0 4px) ganhava por especificidade e ZERAVA o respiro — o valor
     ficou colado no fio (Bryan viu, 16/09). */
  .prova > .economia {
    grid-column: 1 / -1; display: flex; gap: 10px; align-items: center;
    margin-top: 12px; padding: 13px 4px 3px; text-align: left;
    border-top: 1px solid rgba(255,255,255,.12);
  }
  .economia .lado { flex: 0 0 auto; }
  .economia .numero {
    display: block; font: 700 17px/1 var(--mono); color: var(--verde);
    letter-spacing: -.02em;
  }
  .economia .oque {
    display: block; font-size: 9.5px; line-height: 1.2; margin-top: 3px;
    color: rgba(255,255,255,.55); white-space: nowrap;
  }
  .economia .como { display: none; }
  .economia svg.serie { flex: 1 1 60px; min-width: 50px; height: 22px; display: block; overflow: visible; }
  .economia svg.serie .linha { stroke-width: 1.2px; }
  .economia .serie-wrap { flex: 1 1 60px; min-width: 50px; margin: 0; padding: 0; }
  .economia .serie-wrap .agora { display: none; }
  .economia svg.serie .area { fill: var(--verde); opacity: .14; }

  .economia.so-numero { grid-template-columns: 1fr; }
  /* o fio vertical da prova nao se aplica a` faixa */
  .prova > .economia::before { display: none; }

  /* ---------------- filtros ---------------- */
  .ferramentas {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--fundo) 92%, transparent);
    backdrop-filter: blur(9px);
    padding: 12px 0 10px; margin: 16px 0 0;
    border-bottom: 1px solid var(--linha);
  }
  .busca {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--linha); background: var(--caixa);
    color: var(--tinta); font: 15px/1 Poppins, sans-serif;
  }
  .busca::placeholder { color: var(--fraco); }
  /* ⛔ DUAS TENTATIVAS ERRADAS ANTES DESTA, e vale saber por que:
       1. fila unica com ROLAGEM HORIZONTAL — escondia metade das opcoes; pra
          achar "Fitness" a pessoa arrastava sem saber o que havia adiante.
       2. chips quebrando em LINHAS — tudo visivel, mas viraram CINCO linhas
          e empurraram os produtos pra fora da tela. Pior que o problema
          original: o filtro e' acessorio, o produto e' o principal.

     ⭐ Dois seletores NATIVOS resolvem os dois de uma vez: ocupam UMA linha,
     e ao tocar o iPhone abre a roda do sistema com todas as opcoes de uma
     vez — sem rolar a pagina e sem empurrar nada. */
  .filtros {
    display: flex; gap: 7px; margin-top: 10px;
  }
  /* ⚠️ TRES SELETORES NO CELULAR (Preco, Categoria, Loja — desde 16/09/2026).
     A 375 px os tres cortavam em "Preç… Cate… Loja…" (o Bryan viu). Com tres
     caixas, o rotulo encolhe e a contagem some: "Preço tudo · Categoria
     todas · Loja todas" cabe em 343 px; o numero continua dentro do painel.
     Continua em UMA linha: painel em segunda linha ja' foi recusado por
     empurrar os produtos pra fora da primeira tela. */
  /* ⭐ NO CELULAR, ROTULO OU VALOR — nunca os dois: caixa sem filtro mostra
     "Preço" / "Categoria" / "Loja"; caixa com filtro mostra so' o escolhido
     ("Cozinha", "Mercado Livre"), ja' pintada de ativa. Medido: com os dois
     e o icone, cada caixa tem 110 px e corta ate' com fonte 12 px. */
  @media (max-width: 430px) {
    .filtros.tres { gap: 5px; }
    .filtros.tres .escolha { font-size: 12px; padding: 8px 20px 8px 10px;
                             background-position: right 7px center; }
    .filtros.tres .escolha::before { display: none; }
    .filtros.tres .escolha .n { display: none; }
    .filtros.tres .escolha[data-ativo="nao"] .valor-escolhido { display: none; }
    .filtros.tres .escolha[data-ativo="nao"] .rotulo-fixo { color: var(--tinta); font-weight: 600; margin: 0; }
    .filtros.tres .escolha[data-ativo="sim"] .rotulo-fixo { display: none; }
  }
  /* ⭐ MENU PROPRIO, e nao o <select> nativo. O nativo resolvia o espaco mas
     trazia a roda do iOS, que e' a cara do sistema e nao da pagina.

     ⚠️ O QUE NAO PODE MUDAR: o painel abre SOBREPOSTO (position: absolute),
     nunca empurrando a lista. Foi esse o erro da versao de chips em linhas —
     cinco linhas de filtro jogaram os produtos pra fora da primeira tela. */
  .escolha-caixa { position: relative; flex: 1 1 0; min-width: 0; }
  .escolha {
    width: 100%; text-align: left;
    border: 1px solid var(--linha); background: var(--caixa);
    color: var(--tinta); border-radius: 999px;
    padding: 9px 30px 9px 14px;
    font: 600 13px/1 Poppins, sans-serif; cursor: pointer;
    text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
    /* a setinha, desenhada em SVG pra nao depender de fonte de icone */
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1l5 5 5-5' fill='none' stroke='%23A7A0B2' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center; background-size: 10px;
  }
  /* ⭐ ACESO quando ha' filtro: a pessoa precisa ver que a lista esta'
     recortada, senao acha que o catalogo encolheu. */
  .escolha[data-ativo="sim"] {
    background-color: var(--tinta); color: var(--fundo); border-color: var(--tinta);
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1l5 5 5-5' fill='none' stroke='%23FFFFFF' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");
  }
  .escolha[aria-expanded="true"] { border-color: var(--ouro); }
  /* ⭐ O ROTULO FIXO e' quem da' o ar profissional: o menu se apresenta
     ("Preço") antes de mostrar a escolha ("tudo"). Peso e cor diferentes,
     senao vira uma frase so' e perde a hierarquia. */
  .escolha .rotulo-fixo {
    color: var(--fraco); font-weight: 500; margin-right: 5px;
  }
  .escolha .valor-escolhido { font-weight: 700; }
  .escolha .n {
    font: 500 11px/1 var(--mono); color: var(--fraco); margin-left: 6px;
  }
  .escolha[data-ativo="sim"] .rotulo-fixo,
  .escolha[data-ativo="sim"] .n {
    color: color-mix(in srgb, var(--fundo) 72%, transparent);
  }
  /* ⚠️ ICONE DESENHADO EM SVG, nao emoji: emoji muda de cara em cada
     aparelho e num rodape de loja isso aparece como descuido. */
  .escolha::before {
    content: ""; display: inline-block; width: 13px; height: 13px;
    vertical-align: -2px; margin-right: 7px;
    background-repeat: no-repeat; background-position: center;
    background-size: contain; opacity: .55;
  }
  .escolha[data-icone="preco"]::before {
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%236f6b7d' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 2v12M11 5H6.5a2 2 0 000 4h3a2 2 0 010 4H5'/%3E%3C/svg%3E");
  }
  .escolha[data-icone="categoria"]::before {
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%236f6b7d' stroke-width='1.6' stroke-linejoin='round'%3E%3Crect x='2' y='2' width='5' height='5' rx='1'/%3E%3Crect x='9' y='2' width='5' height='5' rx='1'/%3E%3Crect x='2' y='9' width='5' height='5' rx='1'/%3E%3Crect x='9' y='9' width='5' height='5' rx='1'/%3E%3C/svg%3E");
  }
  .escolha[data-icone="loja"]::before {
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%236f6b7d' stroke-width='1.6' stroke-linejoin='round'%3E%3Cpath d='M2 6l1.5-3h9L14 6M2 6h12M3 6v7h10V6M6 13V9h4v4'/%3E%3C/svg%3E");
  }
  .escolha[data-ativo="sim"]::before { filter: invert(1) brightness(2); opacity: .8; }
  /* ⚠️ largura pelo CONTEUDO (min = a caixa): a 375 px o painel de 110 px
     cortava o numero ("AliExpress 1|") e quebrava "caiu de preco" em tres
     linhas (Bryan, 16/09). O ultimo seletor abre ancorado a` direita. */
  .opcoes {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 40;
    min-width: 100%; width: max-content; max-width: min(260px, calc(100vw - 32px));
    background: var(--caixa); border: 1px solid var(--linha);
    border-radius: 14px; padding: 5px; overflow: hidden;
    box-shadow: 0 14px 34px rgba(0,0,0,.16);
  }
  .opcao {
    display: flex; align-items: center; gap: 8px; width: 100%;
    border: 0; background: none; cursor: pointer; text-align: left;
    color: var(--tinta); border-radius: 10px; padding: 9px 11px;
    font: 500 13.5px/1.2 Poppins, sans-serif; white-space: nowrap;
  }
  .escolha-caixa:last-child .opcoes { left: auto; right: 0; }
  .opcao:active { background: color-mix(in srgb, var(--tinta) 7%, transparent); }
  .opcao[aria-selected="true"] { font-weight: 700; }
  /* o numero fica a' direita, alinhado — vira coluna e da' pra comparar */
  .opcao .n {
    margin-left: auto; padding-left: 10px; flex: 0 0 auto;
    font: 500 11.5px/1 var(--mono); color: var(--fraco);
  }
  .opcao[aria-selected="true"]::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: var(--ouro); flex: 0 0 5px;
  }
  .opcao:not([aria-selected="true"])::before {
    content: ""; width: 5px; flex: 0 0 5px;
  }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--linha); background: var(--caixa);

    var e = document.createElement(tag);
    if (classe) { e.className = classe; }
    if (texto !== undefined) { e.textContent = texto; }
    return e;
  }
  // ⭐ O GRAFICO DA SERIE — o desenho do preco que NOS vimos, dia a dia.
  //
  // ⚠️ A DECISAO QUE MAIS IMPORTA AQUI E' A ESCALA, e ela e' contra-intuitiva:
  // o eixo NAO se ajusta ao minimo e maximo da serie. Sparkline auto-ajustada
  // transforma oscilacao de 1,6% numa montanha — o Carregador 120W (36,59 ->
  // 36,59 -> 37,19) sairia com a mesma cara dramatica da Lanterna, que caiu
  // 12,2% de verdade. Seria a mentira de 15/09/2026 outra vez, trocando o
  // numero inflado por tinta inflada.
  //
  // ⭐ Por isso o eixo tem PISO: ele cobre no minimo 10% do preco. Abaixo
  // disso a linha sai quase reta, que e' a verdade — o preco nao fez nada.
  // Quem tem queda real e' quem ocupa a altura toda.
  var PISO_DO_EIXO = 0.10;

  function grafico(p) {
    var s = p.serie || [];
    // ⛔ Menos de 3 pontos nao vira linha. Quem decide isso e' o publicador
    // (`_serie_curta`), e aqui a guarda se repete: pagina antiga com dado
    // novo, ou o contrario, nao pode desenhar segmento nenhum.
    if (s.length < 3) { return null; }

    var vals = s.map(function (x) { return x[1]; });
    var menor = Math.min.apply(null, vals);
    var maior = Math.max.apply(null, vals);
    var faixa = Math.max(maior - menor, maior * PISO_DO_EIXO);
    // centraliza a serie dentro da faixa minima
    var meio = (maior + menor) / 2;
    var topo = meio + faixa / 2;

    var L = 100, A = 22, m = 2;
    var pts = s.map(function (x, i) {
      var px = s.length === 1 ? L / 2 : (i / (s.length - 1)) * L;
      var py = m + (topo - x[1]) / faixa * (A - 2 * m);
      return [px, py];
    });

    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + L + " " + A);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    // ⭐ Caiu de verdade = verde; o resto e' cinza. O limiar e' o MESMO 5%
    // que o selo "caiu X%" usa — duas leituras diferentes do mesmo dado na
    // mesma pagina e' como nasce "o grafico diz uma coisa e o selo, outra".
    svg.setAttribute("class", "serie" + ((p.queda || 0) >= 5 ? " baixou" : ""));

    var d;
    if (p.suave) {
      // ⭐ CURVA SUAVE (Catmull-Rom -> Bezier) so' pro multometro: 4 pontos
      // diarios em reta pareciam regua (Bryan pediu "menos linear"). A curva
      // passa EXATAMENTE pelos mesmos pontos — muda o traco, nao o dado.
      d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
      for (var k = 0; k < pts.length - 1; k++) {
        var p0 = pts[Math.max(k - 1, 0)], p1 = pts[k],
            p2 = pts[k + 1], p3 = pts[Math.min(k + 2, pts.length - 1)];
        var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
        var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
        d += " C" + c1x.toFixed(1) + " " + c1y.toFixed(1) + " " + c2x.toFixed(1) +
             " " + c2y.toFixed(1) + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
      }
      var area = document.createElementNS(NS, "path");
      area.setAttribute("d", d + " L" + pts[pts.length - 1][0].toFixed(1) + " " + A +
                             " L" + pts[0][0].toFixed(1) + " " + A + " Z");
      area.setAttribute("class", "area");
      svg.appendChild(area);
      // ⚠️ SEM bolinhas por dia: o SVG e' esticado sem proporcao e o circulo
      // vira elipse disforme (Bryan viu, 16/09). A cadencia dos dias ja'
      // aparece na propria curva — dia que cresce mais inclina mais.
    } else {
      d = pts.map(function (q, i) {
        return (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1);
      }).join(" ");
    }
    var linha = document.createElementNS(NS, "path");
    linha.setAttribute("d", d);
    linha.setAttribute("class", "linha");
    // ⚠️ `preserveAspectRatio=none` estica o desenho e esticaria a espessura
    // do traco junto; sem isto a linha fica grossa e borrada no cartao largo.
    linha.setAttribute("vector-effect", "non-scaling-stroke");
    svg.appendChild(linha);

    // ⛔ O PONTO "AGORA" NAO E' MAIS UM <circle>: com preserveAspectRatio=none
    // o SVG e' esticado e o circulo virava elipse, e na borda direita saia
    // cortado (Bryan viu os dois em 16/09). Agora e' um <span> redondo de
    // verdade, posicionado por porcentagem dentro do involucro — e o
    // involucro tem folga a` direita pra ele nunca ser cortado.
    var ult = pts[pts.length - 1];
    var ponto = document.createElement("span");
    ponto.className = "agora";
    ponto.style.left = (ult[0] / L * 100).toFixed(1) + "%";
    ponto.style.top = (ult[1] / A * 100).toFixed(1) + "%";

    // ⭐ O QUE O DESENHO ESCONDE, EM TEXTO. A linha mostra a forma; o titulo
    // devolve os numeros exatos, que e' o que sustenta a promessa da pagina.
    var t = document.createElementNS(NS, "title");
    t.textContent = s.map(function (x) {
      return x[0].split("-").reverse().join("/") + " R$ " +
             x[1].toFixed(2).replace(".", ",");
    }).join(" · ");
    svg.appendChild(t);
    var wrap = document.createElement("div");
    wrap.className = "serie-wrap" + ((p.queda || 0) >= 5 ? " baixou" : "");
    wrap.appendChild(svg);
    wrap.appendChild(ponto);
    return wrap;
  }

  function normal(t) {
    return String(t || "").toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  // ⛔ O TETO DA VITRINE — decidido com o Bryan em 15/09/2026.
  //
  // ⚠️ SEM ISTO A PAGINA SE INVERTE SOZINHA, e nao por escolha de ninguem: a
  // lista abre ordenada por `ganho x vendas`, e um tenis de marca rende ~R$ 37
  // por venda contra ~R$ 2 de um achadinho. No dia em que o primeiro par
  // entrar no catalogo, ele assume a frente e empurra todo achadinho pra
  // baixo — a pagina viraria loja de tenis sem ninguem ter decidido isso.
  //
  // ⭐ E o numero serve a DOIS usos de proposito, pra nao existir um segundo
  // limiar pra lembrar: ele tira o produto da lista principal, e e' ele que
  // divide os dois blocos dentro da categoria.
  //
  // ⚠️ MEDIDO no catalogo de 15/09: mediana R$ 30,99, maior R$ 231,99. R$ 250
  // pega todo tenis de marca (R$ 400 a R$ 700) e NAO esconde nenhum achadinho
  // que ja' estava rodando. Um teto de R$ 150 tiraria da frente o Projetor de
  // R$ 231,99, que tem queda medida e rende video — efeito colateral, nao
  // objetivo.
  var TETO_VITRINE = 250;

  // ⛔ CATEGORIAS QUE SO' EXISTEM NO SEGMENTO, caras ou baratas.
  //
  // Calcado de R$ 180 nao choca ninguem, mas quebra o ritmo: um tenis no meio
  // de organizadores de R$ 11 muda o que a pagina parece ser. A promessa do
  // topo e' "eu garimpo, voce paga menos" — calcado de marca e' outro momento
  // de compra, e mora atras do menu Categoria.
  var SO_NO_SEGMENTO = ["Calçados"];

  function caro(p) { return num(p.preco) > tetoAtual(); }
  function soNoSegmento(p) {
    // ⚠️ TODA categoria externa e' so'-no-segmento, sem precisar ser
    // listada: se ela fosse pro rolar principal, o "so' baixa ao clicar"
    // deixaria de fazer sentido — a lista principal a pediria de cara.
    return SO_NO_SEGMENTO.indexOf(p.canal) >= 0 || externa(p.canal);
  }

  // ⭐ NAVEGAR E' PASSIVO, BUSCAR E' INTENCAO. Quem digitou "nike" ja' disse o
  // que quer: esconder dele seria atrapalhar, nao proteger. O mesmo vale pra
  // quem escolheu a categoria no menu. O recorte existe pra quem so' rola a
  // pagina sem pedir nada.
  function visivel(p) {
    if (canal || loja) { return true; }
    if (normal(busca.value.trim())) { return true; }
    return !caro(p) && !soNoSegmento(p);
  }

  function montar(p) {
    var a = document.createElement("a");
    a.className = "item";
    a.href = p.link;
    a.rel = "noopener";
    // ⚠️ SEM `target=_blank`, E ISSO CONSERTA O DEFEITO MAIOR DA PAGINA.
    //
    // MEDIDO em 14/09/2026: no iPhone do Bryan nenhum link abria — nem o
    // cartao, nem a linha do topo. O proprio navegador disse por que:
    // "the page tried to open a new tab and the pane BLOCKED it". Abrir
    // aba nova e' tratado como pop-up, e o bloqueador do Safari vem
    // ligado de fabrica. O link funcionava; a ABA e' que nao abria.
    //
    // ⭐ E o upsell nao depende mais da aba de tras: ele aparece quando a
    // pessoa VOLTA (ver `pageshow` no fim do arquivo), que e' o momento em
    // que ela realmente esta' aqui de novo.

    var foto = el("div", "foto");
    if ((p.queda || 0) >= 5) {
      foto.appendChild(el("span", "caiu", "caiu " + Math.round(p.queda) + "%"));
    }
    if (!(p.pontos >= 2)) {
      foto.appendChild(el("span", "novo", "novo"));
    }
    // ⭐ O FOGUINHO: so' a chama, no canto de baixo da foto, nos poucos que
    // passam na regua do publicador (`marcar_fogo`: nota, queda, vendas,
    // rendimento; teto 6). Sem texto — o que ele significa esta' na linha
    // "98% positivas · 12 mil vendas" que so' o cartao com fogo ganha.
    if (p.fogo) {
      // ⚠️ SELO pequeno e redondo no canto superior direito, chama em SVG
      // (emoji renderiza diferente em cada aparelho e saiu grande e solto —
      // Bryan, 16/09: "nao tem nada a ver com um botao no canto").
      var fogo = el("span", "fogo");
      fogo.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 2c1 3.5 4 5 4 9a4 4 0 0 1-8 0c0-1 .3-2 .8-2.8C8 9.5 9 11 10 11c0-3 .5-6 2-9z"/></svg>';
      fogo.title = "escolhido: " + Math.round(p.nota) + "% de avaliações positivas e caiu " + Math.round(p.queda) + "%";
      foto.appendChild(fogo);
    }
    if (p.imagem) {
      var img = document.createElement("img");
      img.src = p.imagem;
      img.alt = p.nome || "";
      img.loading = "lazy";
      img.decoding = "async";
      foto.appendChild(img);
    }
    a.appendChild(foto);

    var corpo = el("div", "corpo");
    var nome = el("div", "nome", p.nome);
    // ⭐ O SELO DA LOJA: no FIM DO NOME, na mesma linha do texto, cinza
    // vazado — sem cor, sem linha propria. Quarta casa dele em 16/09: na
    // foto cobria legenda; no rodape cortava o radar; acima do preco
    // "dividia o cartao, e o vermelho da' impressao de negacao" (Bryan). A
    // cor da loja fica so' no seletor "Loja", onde ela ajuda a escolher.
    if (p.loja) {
      var cfg = LOJAS[p.loja] || { sigla: String(p.loja).slice(0, 2).toUpperCase() };
      var selo;
      if (SIMBOLOS[p.loja]) {

        // fim do nome, sem borda — a marca fala por si (Bryan, 16/09)
        selo = el("img", "loja loja-simbolo");
        selo.src = SIMBOLOS[p.loja];
        selo.alt = p.loja;
        selo.loading = "lazy";
      } else {
        selo = el("span", "loja", cfg.sigla);
        // ⭐ transparente, so' a tinta na cor da loja (Bryan, 16/09: "testar
        // assim transparente e mudar so' a cor pela cor do Ali")
        if (cfg.tinta) { selo.style.color = cfg.tinta; selo.style.borderColor = cfg.tinta; }
      }
      selo.title = p.loja;
      nome.appendChild(document.createTextNode(" "));
      nome.appendChild(selo);
    }
    corpo.appendChild(nome);

    // ⭐ PROVA SOCIAL EM TODOS (Bryan, 16/09: "gostei, poderiamos adotar para
    // todos"), DISCRETA: cinza, na fonte do rodape; verde so' com fogo. So'
    // aparece com nota >= 90% e >= 100 vendas — vazio nao e' prova.
    // "vendas na loja" = volume do PRODUTO somando vendedores (a pagina do
    // AliExpress mostra "este vendedor: 2.000+" e o total separado).
    // ⭐ UMA LINHA DE SINAIS acima do preco: "Promo · X% OFF" com a seta a`
    // esquerda (vermelho da AliExpress; X% = a NOSSA queda), e o polegar com
    // a % de avaliacoes positivas a` direita — compacto, como a propria loja
    // mostra ("people gave it a positive review"). Decisao do Bryan, 16/09.
    //
    // ⛔ SEM VENDAS (o visitante nao confere) e SEM ESTRELA: a API da' so' o
    // % positivo; "98%" nao vira "4.9" por conta nenhuma honesta.
    var temPromo = (p.queda || 0) >= 5;
    var temNota = p.nota >= 90;
    var temVendeu = !temPromo && p.vendeu && p.vendeu[0] >= 20;
    // ⭐ MERCADO LIVRE: a API nao da' vendas, da' VENDEDORES — um anuncio
    // por vendedor, numero que a pessoa confere na pagina da loja. Piso 2:
    // e' o que `mercadolivre.buscar` ja' exige pra chamar de produto real.
    var temVendedores = !temPromo && !temVendeu && p.vendedores && p.vendedores[0] >= 2;
    var temConferido = !temPromo && !temVendeu && !temVendedores && p.conferido;
    if (temPromo || temNota || temVendeu || temVendedores || temConferido) {
      var sinais = el("div", "sinais");
      // ⭐ sem Promo e sem vendas medidas, a ancora e' o que TODO produto tem:
      // "conferido hoje as 19:00". Medicao que falta nao desqualifica o
      // anuncio (Bryan, 16/09) — a regua da pagina e' o preco conferido.
      if (temConferido) {
        var conf = el("span", "vendeu", "preço conferido " + p.conferido);
        conf.title = "última vez que eu reconferi o preço na loja";
        sinais.appendChild(conf);
      }
      // ⭐ SEM PROMO, a ancora da esquerda e' "+792 vendidos desde 14/09":
      // crescimento do volume da loja medido por NOS (piso 20, senao e'
      // ruido). E' o numero de vendas "mais real" que o Bryan pediu de
      // volta — nao briga com o "10.000+" da loja porque nao e' o total.
      if (temVendeu) {
        var vend = el("span", "vendeu", "+" + p.vendeu[0].toLocaleString("pt-BR") +
          " vendidos desde " + p.vendeu[1]);
        vend.title = "quanto o volume de vendas na loja cresceu desde que eu acompanho este produto";
        sinais.appendChild(vend);
      }
      // ⭐ "+2 vendedores desde 16/09" quando cresceu; "13 vendedores na
      // loja" quando nao — nunca "vendidos", que no ML nao medimos.
      if (temVendedores) {
        var vs = p.vendedores;
        var txt = vs[1] >= 1
          ? "+" + vs[1] + (vs[1] === 1 ? " vendedor" : " vendedores") + " desde " + vs[2]
          : vs[0] + " vendedores na loja";
        var vd = el("span", "vendeu", txt);
        vd.title = vs[1] >= 1
          ? "quantos vendedores a mais anunciam este produto desde que eu acompanho"
          : "quantos vendedores anunciam este produto no Mercado Livre agora";
        sinais.appendChild(vd);
      }
      if (temPromo) {
        var promo = el("span", "promo");
        promo.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#FF4747" d="M9.5 1 4 9h3.2L6 15l6-8H8.8z"/></svg>' +
          '<span>Promo · ' + Math.round(p.queda) + '% OFF</span>';
        promo.title = "queda medida por mim contra o maior preço que eu mesmo vi";
        sinais.appendChild(promo);
      }
      if (temNota) {
        var nota = el("span", "nota" + (p.fogo ? " em-fogo" : ""));
        // ⭐ estrela fina, de traco (nao o icone cheio): elegante, e nao
        // promete "4.9" — o numero ao lado continua sendo o % positivo
        nota.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>' +
          '<span>' + Math.round(p.nota) + '%</span>';
        nota.title = Math.round(p.nota) + "% de avaliações positivas na loja";
        sinais.appendChild(nota);
      }
      corpo.appendChild(sinais);
    }
    var lp = el("div", "linha-preco");
    // ⭐ O SELO DA LOJA: linha propria ACIMA do preco, a esquerda, pequeno —
    // onde o Bryan desenhou (16/09). Ja' morou na foto (cobria legenda de
    // vendedor), no rodape (cortava o "no radar") e a direita do preco.
    // Aqui ele le como "de onde vem", colado ao nome, e o preco fica limpo.
    lp.appendChild(el("span", "preco", p.preco));

    if (p.antes) { lp.appendChild(el("span", "de", p.antes)); }
    corpo.appendChild(lp);
    // ⭐ "JA' ESTEVE A": produto que subiu mas ainda esta' abaixo do maior que
    // vimos. Discreto, na fonte do rodape, com a data — deixa a pessoa
    // decidir esperar. Quem esta' no minimo ganha o "de" riscado, nao isto.
    if (p.ja_esteve && p.ja_esteve.preco) {
      var je = el("div", "ja-esteve", "já esteve a " + p.ja_esteve.preco + " · " + p.ja_esteve.em);
      je.title = "menor preço que eu mesmo vi para este produto, e quando";
      corpo.appendChild(je);
    }
    // ⭐ O grafico entra DEPOIS do preco e ANTES do rodape: ele explica o
    // numero que acabou de ser lido. Volta `null` quando nao ha' 3 pontos.
    var gr = grafico(p);
    if (gr) { corpo.appendChild(gr); }

    var rod = el("div", "rodape-item");
    rod.appendChild(el("span", "pulso"));
    rod.appendChild(el("span", null, p.pontos >= 2
      ? (p.dias <= 0 ? "no radar desde hoje"
         : (p.dias === 1 ? "no radar há 1 dia"
            : "no radar há " + p.dias + " dias"))
      : "achado agora"));
    corpo.appendChild(rod);

    a.appendChild(corpo);

    // ⚠️ O UPSELL NAO ATRAPALHA O CLIQUE PRINCIPAL.
    //
    // Nada de modal antes de ir pra loja: isso e' atrito no unico momento
    // em que a pessoa decidiu comprar. O link abre em OUTRA aba, entao a
    // nossa pagina continua viva atras — e e' la' que o complemento
    // aparece, pra quando ela voltar.
    //
    // ⚠️ E NAO E' 'produto relacionado' generico: e' do MESMO canal e
    // custa no maximo METADE do que ela acabou de olhar. Um complemento
    // mais caro que o principal nao e' complemento, e' outra decisao.
    a.addEventListener("click", function () {
      // ⚠️ CARTAO DE DENTRO DA SUGESTAO NAO GERA OUTRA SUGESTAO.
      //
      // E nao e' so' pra evitar recursao: `sugerir` REMOVE o bloco antigo, e
      // o cartao clicado esta' dentro dele. Tirar o proprio elemento do DOM
      // no meio do clique CANCELA a navegacao — o cartao simplesmente nao
      // abria (medido no iPhone do Bryan, 14/09/2026).
      // ⚠️ Guarda ANTES de sair: quando a pessoa voltar, a pagina recarrega
      // do zero e a unica memoria que sobra e' esta.
      try {
        sessionStorage.setItem("ultimo", p.id || p.link);
      } catch (e) { /* navegacao privada: sem upsell, e tudo bem */ }

    });

  }

  // ⚠️ AS PALAVRAS QUE NAO DIZEM NADA ficam de fora da conta. 'kit',
  // 'conjunto' e 'para' aparecem em metade do catalogo e inflariam a
  // semelhanca entre produtos que nao tem nada a ver.
  var VAZIAS = ("kit conjunto jogo pacote unidades unidade para com sem "
                + "peças pecas novo nova mini super multi").split(" ");

  function palavras(t) {
    return String(t || "").toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .split(/[^a-z0-9]+/)
      .filter(function (w) { return w.length >= 4 && VAZIAS.indexOf(w) < 0; });
  }

  function parecidos(a, b) {
    var A = palavras(a), B = palavras(b);
    if (!A.length || !B.length) { return 0; }
    var juntas = {}, comuns = 0;
    A.forEach(function (w) { juntas[w] = 1; });
    B.forEach(function (w) {
      if (juntas[w] === 1) { comuns += 1; juntas[w] = 2; }
      else { juntas[w] = juntas[w] || 1; }
    });
    var total = Object.keys(juntas).length;
    return total ? comuns / total : 0;
  }

  function sugerir(card, base) {
    // ⚠️ 'METADE DO PRECO' NAO EXISTE NESTE CATALOGO.
    //
    // A primeira versao exigia <= 50% do item clicado. Num catalogo onde
    // quase tudo custa entre R$ 10 e R$ 20, isso pede um produto de R$ 6 —
    // e o bloco NUNCA aparecia (medido no ar, em 14/09/2026, com um item de
    // R$ 13,52: zero candidatos).
    //
    // ⭐ 20% mais barato E' o que da' a sensacao de 'ja que estou aqui': o
    // suficiente pra parecer acrescimo, nao outra compra. E continua sendo
    // sempre MAIS BARATO que o principal — complemento mais caro nao e'
    // complemento.
    // ⚠️ O TETO E' ARREDONDADO EM CENTAVOS. Sem isso, 13,52 x 0,8 da'
    // 10,816 e o candidato de R$ 10,82 fica de fora por meio centavo — o
    // bloco sumia e parecia que nao havia complemento nenhum (medido no ar).
    var teto = Math.round(num(base.preco) * 80) / 100;
    // ⚠️ COMPLEMENTO NAO E' SUBSTITUTO.
    //
    // A primeira versao sugeria 'Kit de maquiagem com potes e esponjas' pra
    // quem abriu 'Conjunto de esponjas para maquiagem' — o MESMO produto com
    // outro nome. Isso nao soma venda: faz a pessoa reconsiderar a que ela ja'
    // tinha escolhido.
    //
    // ⭐ A medida e' de sobreposicao de palavras (Jaccard). Dois nomes que
    // dividem metade do vocabulario falam da mesma coisa; complemento divide
    // a AREA (que ja' esta' garantida) e pouco mais.
    // ⭐ O JULGAMENTO DO MODELO VEM PRIMEIRO. Ele sabe que esponja combina
    // com estojo e que pote combina com organizador — coisa que contagem de
    // palavra nunca saberia. A regra de palavras fica como RESERVA, pro
    // produto que ainda nao foi julgado.
    var porId = {};
    PRODUTOS.forEach(function (p) { porId[String(p.id)] = p; });
    // ⚠️ QUANDO O MODELO JA' JULGOU, O TETO DE PRECO AFROUXA.
    //
    // Exigir 80% do valor E estar na lista julgada derrubava tudo: o
    // complemento aprovado pelo Gemini quase sempre custa perto do
    // principal, e o bloco simplesmente nao aparecia (medido em 14/09/2026
    // — clique registrado, volta certa, e nenhuma sugestao).
    //
    // ⭐ O que fica de pe' e' 'mais barato que o que voce viu', que e' a
    // promessa; os 80% continuam valendo pra regra de palavras, que nao tem
    // julgamento nenhum pra se apoiar.
    var escolhidos = (base.combina || []).map(function (id) {
      return porId[String(id)];
    }).filter(function (p) {
      return p && p.link !== base.link && num(p.preco) > 0 &&
             num(p.preco) < num(base.preco);
    }).sort(function (a, b) { return num(a.preco) - num(b.preco); });
    if (escolhidos.length) {
      mostrarJuntos(card, escolhidos.slice(0, 2));
      return;
    }

    var juntos = PRODUTOS.filter(function (p) {
      return p.link !== base.link && p.canal === base.canal &&
             num(p.preco) > 0 && num(p.preco) <= teto &&
             parecidos(p.nome, base.nome) <= 0.25;
    }).sort(function (a, b) {
      // o mais barato entre os que mais cairam: barato chama o olho,
      // queda medida sustenta a escolha
      return (b.queda || 0) - (a.queda || 0) || num(a.preco) - num(b.preco);
    }).slice(0, 2);

    // ⚠️ SEM CANDIDATO, NAO INVENTA. Puxar de outro canal, ou produto mais
    // caro, seria encher a tela por encher — e a pessoa acabou de sair.
    if (!juntos.length) { return; }
    mostrarJuntos(card, juntos);
  }

  function mostrarJuntos(card, juntos) {
    var antigo = document.getElementById("junto");
    if (antigo) { antigo.remove(); }

    var caixa = el("div", "junto");
    caixa.id = "junto";
    var titulo = el("h3");
    titulo.appendChild(el("span", "pulso"));
    // ⚠️ NAO SE FALA DE CANAL AQUI. Quem abre o site mae nao precisa saber
    // que existem cinco TikToks por tras — isso e' estrutura nossa, nao
    // informacao util pra quem esta' comprando.
    //
    // ⚠️ E NAO SE ANUNCIA "mais barato": dizer isso sugere que havia algo
    // mais barato guardado. O criterio de escolha continua sendo preco (e
    // isso e' bom), mas o texto fala de COMBINACAO, que e' o motivo real de
    // mostrar.
    titulo.appendChild(el("span", null, "vai bem com o que você viu"));
    var x = el("button", "fechar", "fechar");
    x.type = "button";
    x.addEventListener("click", function (ev) {
      ev.preventDefault();
      caixa.remove();
    });
    titulo.appendChild(x);
    caixa.appendChild(titulo);
    var fila = el("div", "fila");
    juntos.forEach(function (p) { fila.appendChild(montar(p)); });
    caixa.appendChild(fila);
    // ⚠️ SEM CARTAO (veio da linha viva do topo): o bloco entra na FRENTE da
    // grade. Insistir em colocar 'depois do card' quebraria — e cair fora da
    // tela seria pior que nao aparecer.
    if (card) {
      card.insertAdjacentElement("afterend", caixa);
    } else {
      grade.insertBefore(caixa, grade.firstChild);
    }
  }

  // Um bloco titulado com a sua propria fila e o seu proprio "ver mais".
  //
  // ⚠️ A GRADE E' UM GRID CSS, e titulo e botao NAO sao cartoes: os dois
  // levam `grid-column: 1/-1` pra ocupar a linha inteira. Sem isso o titulo
  // vira uma coluna estreita ao lado do primeiro produto.
  // ⭐ A CATEGORIA TEM ENDERECO. Sem isto havia UMA url pro catalogo inteiro
  // e nao dava pra mandar ninguem direto pra uma prateleira — nem pela bio,
  // nem pela descricao do video. Agora `/#calcados` abre ja' filtrado.
  //
  // ⛔ E O VALOR DA URL NUNCA E' ESCRITO NA PAGINA. Ele so' e' COMPARADO com
  // as categorias que ja' existem nos produtos; o que nao casar e' ignorado e
  // abre o catalogo normal. Endereco que vira texto na tela (`innerHTML`) e'
  // porta de injecao — aqui ele nao chega nem perto do DOM.
  //
  // ⚠️ E isto nao esconde nada de ninguem: os produtos ja' estao todos no
  // fonte da pagina. Tirar da lista principal e' decisao EDITORIAL, nao
  // segredo — endereco "criptografado" nao protegeria nada e so' quebraria o
  // link que a pessoa precisa ditar num video.
  function daUrl() {
    var h = "";
    try {
      h = normal(decodeURIComponent((location.hash || "").replace(/^#/, "")));
    } catch (e) { return ""; }
    if (!h) { return ""; }
    var achado = "";
    PRODUTOS.forEach(function (p) {
      if (p.canal && normal(p.canal) === h) { achado = p.canal; }
    });
    // ⚠️ A EXTERNA AINDA NAO ESTA' EM PRODUTOS quando a pagina abre por
    // `/#nike` — sem esta linha o endereco da categoria nao abriria nada.
    Object.keys(EXTERNOS).forEach(function (c) {
      if (normal(c) === h) { achado = c; }
    });
    return achado;
  }

  function guardarUrl() {
    if (!history.replaceState) { return; }
    try {
      history.replaceState(null, "",
        canal ? "#" + normal(canal) : location.pathname + location.search);
    } catch (e) { /* endereco nao e' funcionalidade: falhar aqui nao quebra */ }
  }

  function bloco(titulo, itens, quanto, aoVerMais) {
    if (!itens.length) { return; }
    var h = el("h2", "bloco-titulo", titulo);
    h.appendChild(el("span", "bloco-conta", String(itens.length)));
    grade.appendChild(h);
    var frag = document.createDocumentFragment();
    itens.slice(0, quanto).forEach(function (p) {
      frag.appendChild(montar(p));
    });
    grade.appendChild(frag);
    if (itens.length > quanto) {
      var falta = itens.length - quanto;
      var mais = el("button", "ver-mais",
        "ver mais " + Math.min(falta, passoBloco()) + " de " + falta);
      mais.type = "button";
      mais.addEventListener("click", aoVerMais);
      grade.appendChild(mais);
    }
  }

  // ⭐ BAIXA A CATEGORIA EXTERNA UMA VEZ e devolve os cartoes pra PRODUTOS.
  //
  // ⚠️ FALHA COM AVISO, nao com grade vazia: "Nada aqui com esse filtro"
  // sobre uma categoria que anuncia 905 no menu seria mentira da pagina.
  // Se o arquivo nao vier, a grade diz que nao veio e oferece tentar de novo.
  //
  // ⚠️ E CONFERE QUE VEIO JSON: o Pages devolve a PAGINA RAIZ com 200 pra
  // caminho inexistente (medido em 14/09/2026 no /todos). `r.json()` estoura
  // em HTML, e isso cai no mesmo aviso — que e' o comportamento certo.
  function carregarExterno(nome, depois) {
    if (EXTERNO_CARREGADO[nome]) { depois(); return; }
    if (EXTERNO_CARREGADO[nome] === false) { return; } // ja' em voo
    EXTERNO_CARREGADO[nome] = false;
    grade.innerHTML = "";
    var esp = el("div", "vazio");
    esp.appendChild(el("strong", null, "Buscando " + nome + "…"));
    grade.appendChild(esp);
    fetch(EXTERNOS[nome].arquivo, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) { throw new Error("http " + r.status); }
      return r.json();
    }).then(function (j) {
      var lista = (j && j.produtos) || [];
      if (!lista.length) { throw new Error("arquivo sem produtos"); }
      lista.forEach(function (p) { PRODUTOS.push(p); });
      EXTERNO_CARREGADO[nome] = true;
      montarChips();
      depois();
    }).catch(function (e) {
      delete EXTERNO_CARREGADO[nome];
      grade.innerHTML = "";
      var v = el("div", "vazio");
      v.appendChild(el("strong", null, "Não consegui carregar " + nome + "."));
      v.appendChild(document.createElement("br"));
      var b = el("button", "ver-mais", "tentar de novo");
      b.type = "button";
      b.addEventListener("click", function () { desenhar(); });
      v.appendChild(b);
      grade.appendChild(v);
    });
  }

  function desenhar() {
    // ⭐ a grade real substitui o indice estatico do crawler (17/09/2026)
    var estatico = document.getElementById("indice-estatico");
    if (estatico) { estatico.parentNode.removeChild(estatico); }
    // ⛔ O DEFEITO (17/09/2026, celular do Bryan): "Clovis Calçados 5983" no
    // menu LOJA e "0 achadinhos" na grade. O download da externa so'
    // disparava pelo menu CATEGORIA; pelo menu Loja a pagina filtrava por
    // `loja` numa lista onde a Clovis ainda nao tinha sido baixada. O nome
    // da loja externa E' o nome da categoria (ver EXTERNOS): qualquer um
    // dos dois menus dispara o download.
    var ext = externa(canal) ? canal : (externa(loja) ? loja : "");
    if (ext && !EXTERNO_CARREGADO[ext]) {
      carregarExterno(ext, desenhar);
      return;
    }
    var f = FILTROS.filter(function (x) { return x.id === atual; })[0];
    var termo = normal(busca.value.trim());
    var lista = PRODUTOS.filter(function (p) {
      if (!f.cabe(p)) { return false; }
      if (canal && p.canal !== canal) { return false; }
      if (loja && p.loja !== loja) { return false; }
      // ⭐ A BUSCA CASA COM A CATEGORIA, e nao so' com o nome. Sem isto,
      // digitar "calçados" devolvia VAZIO — os nomes sao "Tênis Nike Air
      // Force 1", a palavra "calçado" nao aparece em nenhum deles. Quem
      // digita o nome de uma prateleira espera a prateleira.
      if (termo && normal(p.nome).indexOf(termo) < 0
                && normal(p.canal || "").indexOf(termo) < 0) { return false; }
      if (!visivel(p)) { return false; }
      return true;
    });
    if (f.ordem) { lista = lista.slice().sort(f.ordem); }
    // ⭐ A EXTERNA ABRE PELOS MAIS BARATOS — decisao do Bryan em 16/09/2026
    // ("mais baratos primeiro comunica melhor com nosso publico"). O feed
    // nao tem `vendas`, entao `ganho x vendas` e' zero pra todos e a ordem
    // de "tudo" seria a do arquivo, que nao e' criterio nenhum.
    if (ext && atual === "todos") {
      lista = lista.slice().sort(function (a, b) {
        return num(a.preco) - num(b.preco);
      });
    }
    // ⭐ A VITRINE: na abertura (sem filtro, sem busca), o melhor do Mercado
    // Livre vai pra 2a posicao, ao lado dos do Ali — decisao do Bryan em
    // 16/09 ("a pagina principal e' nossa vitrine"). Quem marca e' o
    // publicador (`marcar_vitrine_ml`); aqui so' se move UM cartao.
    if (atual === "todos" && !canal && !loja && !termo) {
      var iv = -1;
      lista.some(function (p, i) { if (p.vitrine) { iv = i; return true; } return false; });
      if (iv > 1) {
        var v = lista[iv];
        lista = lista.slice();
        lista.splice(iv, 1);
        lista.splice(1, 0, v);
      }
    }

    grade.innerHTML = "";
    if (!lista.length) {
      var v = el("div", "vazio");
      v.appendChild(el("strong", null, "Nada aqui com esse filtro."));
      v.appendChild(document.createElement("br"));
      v.appendChild(document.createTextNode(
        "Tente outra palavra, ou volte pra Tudo."));
      grade.appendChild(v);
    } else if ((canal || loja) && lista.some(caro) && lista.some(function (p) {
      return !caro(p);
    })) {
      // ⛔ DOIS BLOCOS, E SO' DENTRO DA CATEGORIA.
      //
      // ⭐ O corte e' o MESMO TETO que tira da vitrine — um numero, dois
      // usos, nada de segundo limiar pra lembrar.
      //
      // ⚠️ E os titulos sao FACTUAIS de proposito. "Premium / Básico" foi
      // recusado pelo Bryan em 15/09 com o argumento certo: "de marca" dizia
      // o que a secao TEM, "básico" diria o que o produto E' — e diria isso
      // pra 62 dos 63 itens do catalogo. Quem compra um organizador de R$ 11
      // leria "voce esta' na prateleira basica". Preco nao ofende ninguem.
      //
      // ⚠️ E so' aparece quando os DOIS grupos existem. Categoria inteira
      // barata mostraria um titulo "Ate' R$ 250" sobre a lista inteira e um
      // bloco vazio embaixo — divisao que nao divide nada.
      // ⭐ O BARATO VEM PRIMEIRO — decisao do Bryan em 15/09, e ela e'
      // coerente com o topo da pagina: "Eu garimpo. Você paga menos." Abrir
      // a categoria pelo caro contradiria a frase que a pessoa acabou de
      // ler, mesmo dentro de uma prateleira de marca.
      bloco("Até R$ " + tetoAtual(), lista.filter(function (p) {
              return !caro(p);
            }), mostrandoBaixo, function () {
              mostrandoBaixo += passoBloco(); desenhar();
            });
      bloco("Acima de R$ " + tetoAtual(), lista.filter(caro),
            mostrandoAlto, function () {
              mostrandoAlto += passoBloco(); desenhar();
            });
    } else {
      var pedaco = document.createDocumentFragment();
      lista.slice(0, mostrando).forEach(function (p) {
        pedaco.appendChild(montar(p));
      });
      grade.appendChild(pedaco);
      // ⚠️ O BOTAO SO' APARECE SE HOUVER RESTO. Botao que nao faz nada ensina
      // a pessoa a ignorar botao.
      if (lista.length > mostrando) {
        var falta = lista.length - mostrando;
        var mais = el("button", "ver-mais",
          "ver mais " + Math.min(falta, passoLista()) + " de " + falta);
        mais.type = "button";
        mais.addEventListener("click", function () {
          mostrando += passoLista();
  desenhar();
        });
        grade.appendChild(mais);
      }
    }
    // ⚠️ A CONTAGEM E' DA LISTA NA TELA, sempre. Numero de cabecalho que nao
    // bate com o que se ve' embaixo e' a mentira mais facil de cometer.
    contagem.textContent = lista.length === 1
      ? "1 achadinho" : lista.length + " achadinhos";
  }

  // ⚠️ FECHAR AO TOCAR FORA. Sem isto o painel fica aberto por cima da
  // lista e a pessoa nao encontra como sair — no telefone nao ha' Esc.
  function fecharMenus() {
    var abertos = document.querySelectorAll(".opcoes");
    for (var i = 0; i < abertos.length; i++) { abertos[i].hidden = true; }
    var bs = document.querySelectorAll(".escolha[aria-expanded='true']");
    for (var j = 0; j < bs.length; j++) {
      bs[j].setAttribute("aria-expanded", "false");
    }
  }
  document.addEventListener("click", fecharMenus);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { fecharMenus(); }
  });

  function montarChips() {
    var caixa = document.getElementById("chips");
    // limpar antes de remontar: sem isto cada troca ANEXA controles novos e
    // os antigos ficam na tela com o estado velho.
    caixa.innerHTML = "";
    caixa.classList.remove("tres");

    // DOIS SELETORES, UMA LINHA.
    //
    // Duas tentativas erradas antes desta, e vale saber por que:
    //   1. fila de chips com ROLAGEM HORIZONTAL — escondia metade das
    //      opcoes; pra achar "Fitness" a pessoa arrastava as cegas.
    //   2. chips quebrando em LINHAS — tudo visivel, mas viraram CINCO
    //      linhas e empurraram os produtos pra fora da tela.
    //
    // O seletor nativo resolve os dois: ocupa UMA linha e, ao tocar, o iOS
    // abre a roda do sistema com todas as opcoes de uma vez. O filtro e'
    // acessorio; o produto e' o principal e nao pode sair da primeira tela.
    //
    // A contagem vai DENTRO da opcao ("Beleza (13)"): responde antes da
    // escolha o que a pessoa so' descobriria depois.
    function seletor(titulo, opcoes, valorAtual, aoMudar, temFiltro) {
      var cx = el("div", "escolha-caixa");
      var sel = opcoes.filter(function (o) { return o.id === valorAtual; })[0]
                || opcoes[0];
      // ⭐ ROTULO FIXO + VALOR, e nao so' o valor. "Tudo (62)" sozinho nao
      // diz sobre O QUE aquele menu decide; "Preço: tudo" diz. E' o padrao
      // de loja seria — o menu se apresenta antes de mostrar a escolha.
      var b = el("button", "escolha");
      var fixo = el("span", "rotulo-fixo", titulo);
      var val = el("span", "valor-escolhido", sel.rotulo);
      b.appendChild(fixo);
      b.appendChild(val);
      if (sel.n != null) { b.appendChild(el("span", "n", String(sel.n))); }
      b.type = "button";
      b.setAttribute("aria-expanded", "false");
      b.setAttribute("aria-haspopup", "listbox");
      b.setAttribute("data-ativo", temFiltro ? "sim" : "nao");
      b.setAttribute("data-icone",
        titulo === "Preço" ? "preco" : (titulo === "Loja" ? "loja" : "categoria"));

      var painel = el("div", "opcoes");
      painel.setAttribute("role", "listbox");
      painel.hidden = true;
      opcoes.forEach(function (o) {
        var op = el("button", "opcao", o.rotulo);
        op.type = "button";
        op.setAttribute("role", "option");
        op.setAttribute("aria-selected", String(o.id === valorAtual));
        if (o.n != null) { op.appendChild(el("span", "n", String(o.n))); }
        op.addEventListener("click", function (ev) {
          ev.stopPropagation();
          fecharMenus();
          aoMudar(o.id);
        });
        painel.appendChild(op);
      });

      b.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var vaiAbrir = painel.hidden;
        // fecha o OUTRO menu antes: dois paineis abertos se sobrepoem e a
        // pessoa toca no que nao esta' vendo.
        fecharMenus();
        if (vaiAbrir) {
          painel.hidden = false;
          b.setAttribute("aria-expanded", "true");
        }
      });

      cx.appendChild(b);
      cx.appendChild(painel);
      return cx;
    }

    var deEstado = FILTROS.map(function (f) {
      return {
        id: f.id, rotulo: f.rotulo,
        // ⚠️ MESMO RECORTE DA GRADE. Contagem que conta o que a grade
        // nao desenha e' a mentira mais facil de cometer aqui — a pessoa
        // le' "tudo 63" e conta 57 cartoes.
        n: PRODUTOS.filter(function (p) {
          return f.cabe(p) && (!canal || p.canal === canal)
              && (!loja || p.loja === loja) && visivel(p);
        }).length
      };
    });
    caixa.appendChild(seletor("Preço", deEstado, atual, function (v) {
      atual = v;
      mostrando = passoLista();
      montarChips();
      desenhar();
    }, atual !== "todos"));

    var canais = {};
    PRODUTOS.forEach(function (p) {
      if (p.canal) { canais[p.canal] = (canais[p.canal] || 0) + 1; }
    });
    // ⚠️ A EXTERNA ENTRA NO MENU ANTES DE SER BAIXADA, com a contagem que o
    // publicador mediu — e' o unico lugar onde a pessoa descobre que ela
    // existe. Depois de baixada, a contagem passa a ser a real (de PRODUTOS),
    // e as duas tem de bater; se nao baterem, o publicador e' quem errou.
    Object.keys(EXTERNOS).forEach(function (c) {
      if (!canais[c]) { canais[c] = EXTERNOS[c].n || 0; }
    });
    var areas = Object.keys(canais).sort(function (a, b) {
      return canais[b] - canais[a];
    });
    if (areas.length) {
      // ⚠️ "todas" NAO CONTA A EXTERNA: ela nunca aparece no rolar de
      // "todas", e o numero pularia de 142 pra 1.047 no clique que a baixou
      // — sobre a mesma grade de 142.
      var deArea = [{ id: "", rotulo: "Todas", n: PRODUTOS.filter(function (p) {
        return !externa(p.canal);
      }).length }];
      areas.forEach(function (c) {
        deArea.push({ id: c, rotulo: c, n: canais[c] });
      });
      caixa.appendChild(seletor("Categoria", deArea, canal, function (v) {
        canal = v;
        // ⚠️ os dois blocos recomecam do zero a cada troca: herdar "ver
        // mais" da categoria anterior abre a proxima ja' esticada.
        mostrando = passoLista();
        mostrandoAlto = passoBloco();
        mostrandoBaixo = passoBloco();
        guardarUrl();
        montarChips();
        desenhar();
      }, canal !== ""));
    }

    // ⭐ LOJA — mesmo recorte da grade na contagem (categoria escolhida
    // conta so' dentro dela). Externa ainda nao baixada conta pelo indice.
    var lojas = {};
    PRODUTOS.forEach(function (p) {
      if (!p.loja) { return; }
      if (canal && p.canal !== canal) { return; }
      lojas[p.loja] = (lojas[p.loja] || 0) + 1;
    });
    Object.keys(EXTERNOS).forEach(function (c) {
      if (!lojas[c] && !EXTERNO_CARREGADO[c] && (!canal || canal === c)) {
        lojas[c] = EXTERNOS[c].n || 0;
      }
    });
    var nomesLoja = Object.keys(lojas).sort(function (a, b) { return lojas[b] - lojas[a]; });
    if (nomesLoja.length > 1 || loja) {
      var deLoja = [{ id: "", rotulo: "Todas", n: Object.keys(lojas).reduce(function (t, k) { return t + lojas[k]; }, 0) }];
      nomesLoja.forEach(function (l) { deLoja.push({ id: l, rotulo: l, n: lojas[l] }); });
      caixa.appendChild(seletor("Loja", deLoja, loja, function (v) {
        loja = v;
        mostrando = passoLista();
        mostrandoAlto = passoBloco();
        mostrandoBaixo = passoBloco();
        montarChips();
        desenhar();
      }, loja !== ""));
    }
    marcarTres();
  }

  function marcarTres() {
    var caixa = document.getElementById("chips");
    caixa.classList.toggle("tres", caixa.children.length >= 3);
  }

  function reais(v) {
    return "R$ " + v.toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }

  // ⭐ O MULTOMETRO (Bryan, 16/09/2026): "como o multometro que calcula as
  // multas de uma cidade, o nosso calcula a economia total que o site ja'
  // gerou". Decisao dele: o volume e' o do RADAR (queda encontrada), nao de
  // venda — "mudar o multometro no futuro vai pegar mal". Fica assim.
  //
  // ⭐ Por produto: maior preco visto - menor preco visto. So' sobe, por
  // construcao (ver `economia_radar` no publicador). A linha e' o total dia a
  // dia. O rotulo diz o que e': "que o radar ja' encontrou de queda".
  function montarEconomia() {
    var caixa = document.getElementById("economia");
    var r = (ECONOMIA || {}).radar || {};
    // ⚠️ SO' APARECE SE HOUVER O QUE MOSTRAR: "R$ 0,00" prova o contrario.
    if (!(r.total > 0)) { return; }
    // ⭐ UMA LINHA SO' (Bryan, 16/09: "mais compactado"): valor, a frase
    // dele, a linha. A definicao honesta vive no title da faixa inteira.
    // ⭐ A FRASE E' A VOZ DO SITE ("Eu garimpo"): o numero e' quanto o
    // garimpo ja' achou de queda, e a linha e' esse garimpo crescendo. As
    // versoes "economia no bolso dos clientes" (2 linhas, nao explicava) e
    // "que o radar ja' encontrou" (longa) ficaram pra tras em 16/09.
    var lado = el("div", "lado");
    lado.appendChild(el("strong", "numero", reais(r.total)));
    lado.appendChild(el("span", "oque", "de garimpo já entregue"));
    caixa.appendChild(lado);
    caixa.title = "queda de preço encontrada pelo radar em " + r.produtos +
      " produtos, medida por mim contra o maior preço que eu mesmo vi — não o \"de/por\" da loja";
    var linha = grafico({ serie: r.serie || [], queda: 100, suave: true });
    if (linha) { caixa.appendChild(linha); } else { caixa.classList.add("so-numero"); }
    caixa.hidden = false;
  }

  function montarProva() {
    var caixa = document.getElementById("prova");
    if (!PRODUTOS.length) { return; }
    var precos = PRODUTOS.map(function (p) { return num(p.preco); })
      .filter(function (v) { return v > 0; });
    var vendas = PRODUTOS.reduce(function (a, p) { return a + (p.vendas || 0); }, 0);
    var caiu = PRODUTOS.filter(function (p) { return (p.queda || 0) >= 5; }).length;

    // ⚠️ CADA NUMERO SO' APARECE SE EXISTIR. Prova social com zero prova o
    // contrario do que pretende.
    var linhas = [[String(PRODUTOS.length), "achadinhos de pé agora"]];
    // ⚠️ SO' O NUMERO: "32 de 148" quebrava em duas linhas no celular e
    // esticava o painel (Bryan, 16/09). O 148 ja' esta' na primeira caixa.
    if (caiu) { linhas.push([String(caiu), "baixaram de preço"]); }
    if (vendas > 0) {
      linhas.push([vendas.toLocaleString("pt-BR"), "vendas destes na loja"]);
    } else if (precos.length) {
      linhas.push(["R$ " + Math.min.apply(null, precos).toFixed(2).replace(".", ","),
                   "o mais barato de hoje"]);
    }
    // ⚠️ os tres numeros entram ANTES da faixa do multometro, que ja' esta'
    // no HTML como ultima filha da prova
    var faixa = document.getElementById("economia");
    linhas.forEach(function (par) {
      var d = el("div");
      d.appendChild(el("strong", "numero", par[0]));
      d.appendChild(el("span", "oque", par[1]));
      caixa.insertBefore(d, faixa);
    });
  }

  // ⚠️ UM RELOGIO SO'. Dois `setTimeout` escrevendo no mesmo paragrafo
  // embaralham o texto — letra de um produto no meio do outro.
  var relogio = null;
  var vivoAtual = null;

  function escapar(t) {
    var d = document.createElement("div");
    d.textContent = t;
    return d.innerHTML;
  }

  function animarVivo() {
    var alvo = document.getElementById("vivo");
    var aNome = document.getElementById("vivo_nome");
    var aPreco = document.getElementById("vivo_preco");
    var aDica = document.getElementById("vivo_dica");
    if (relogio) { clearTimeout(relogio); relogio = null; }

    // ⭐ OS QUE MAIS CAIRAM PRIMEIRO: se so' da' tempo de ver um, que seja
    // o que melhor prova a promessa da pagina.
    // ⛔ O TOPO E' A CARA DA PAGINA e obedece ao teto ANTES de ordenar.
    // Ele pesca "os 8 que mais cairam" — e um tenis de marca com 30% de
    // queda entraria sozinho, na primeira tela, que e' exatamente o que a
    // regra existe pra evitar. Filtrar aqui, e nao so' na grade.
    var lista = PRODUTOS.filter(function (p) {
      return !caro(p) && !soNoSegmento(p);
    }).sort(function (a, b) {
      return (b.queda || 0) - (a.queda || 0);
    }).slice(0, 8);
    if (!lista.length) { alvo.hidden = true; return; }

    var calmo = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var i = 0;

    function proximo() {
      var p = lista[i % lista.length];
      i += 1;
      vivoAtual = p;
      alvo.href = p.link;
      aDica.textContent = "toque para ver na loja →";
      aPreco.innerHTML = "";
      var curto = String(p.nome || "").trim();

      function fecharPreco() {
        aPreco.innerHTML = escapar(p.preco) +
          (p.antes ? "<s>" + escapar(p.antes) + "</s>" : "") +
          ((p.queda || 0) >= 5
            ? '<span class="pct">↓ ' + Math.round(p.queda) + '%</span>'
            : "");
        aPreco.classList.remove("entra");
        void aPreco.offsetWidth;
        aPreco.classList.add("entra");
      }
      if (calmo) {
        aNome.textContent = curto;
        fecharPreco();
        relogio = setTimeout(proximo, 3400);
        return;
      }
      var n = 0;
      (function digitar() {
        n += 1;
        aNome.innerHTML = escapar(curto.slice(0, n)) + '<span class="cursor"></span>';
        if (n < curto.length) {
          relogio = setTimeout(digitar, 24);
          return;
        }
        aNome.textContent = curto;
        fecharPreco();
        relogio = setTimeout(proximo, 2600);
      })();
    }
    proximo();

    // ⚠️ O DEDO PARA O CARROSSEL, e ele volta sozinho em 6s. Sem parar, o
    // produto podia rodar entre o toque e o clique e a pessoa abriria um
    // item que nao escolheu. Sem voltar, um encostao congelava a linha.
    var retomar = null;
    ["pointerdown", "touchstart"].forEach(function (ev) {
      alvo.addEventListener(ev, function () {
        if (relogio) { clearTimeout(relogio); relogio = null; }
        if (retomar) { clearTimeout(retomar); }
        retomar = setTimeout(function () {
          if (!relogio) { animarVivo(); }
        }, 6000);
      }, { passive: true });
    });
    alvo.addEventListener("click", function () {
      if (!vivoAtual) { return; }
      try {
        sessionStorage.setItem("ultimo", vivoAtual.id || vivoAtual.link);
      } catch (e) { /* sem sessao: segue sem upsell */ }
    });
  }

  if (BRASAO) {
    var img = document.createElement("img");
    img.src = BRASAO;
    img.alt = "Achadinho Total";
    document.getElementById("logo").appendChild(img);
  }
  // ⚠️ O UPSELL ACONTECE NA VOLTA, e nao na saida.
  //
  // Antes ele contava com a nossa aba viva atras — e como a aba nova nem
  // abria, ele nunca era visto no celular. Agora o gatilho e' a pessoa
  // ESTAR aqui de novo: ela viu o produto na loja e voltou.
  //
  // ⚠️ `pageshow` e nao `load`: voltando pelo botao 'voltar' o Safari
  // restaura a pagina do cache (bfcache) e `load` NAO dispara.
  window.addEventListener("pageshow", function () {
    var id;
    try {
      id = sessionStorage.getItem("ultimo");
      sessionStorage.removeItem("ultimo");
    } catch (e) { return; }
    if (!id) { return; }
    var base = PRODUTOS.filter(function (p) {
      return String(p.id) === String(id) || p.link === id;
    })[0];
    if (!base) { return; }
    // espera a grade existir antes de tentar encaixar o bloco
    setTimeout(function () { sugerir(null, base); }, 60);
  });

  // ⚠️ ANTES de montar os controles: `visivel()` consulta `canal`, entao
  // ler a url depois faria a primeira pintura sair com o recorte errado.
  canal = daUrl();
  mostrando = passoLista();
  mostrandoAlto = passoBloco();
  mostrandoBaixo = passoBloco();

  animarVivo();
  montarProva();
  montarEconomia();
  montarChips();
  desenhar();

  // ⭐ O BOTAO VOLTAR TAMBEM. Quem entrou por `/#calcados`, filtrou outra
  // coisa e apertou voltar espera a prateleira de novo — nao o catalogo.
  window.addEventListener("hashchange", function () {
    var novo = daUrl();
    if (novo === canal) { return; }
    canal = novo;
    mostrando = passoLista();
    mostrandoAlto = passoBloco();
    mostrandoBaixo = passoBloco();
    montarChips();
    desenhar();
  });
  // ⚠️ BUSCAR REINICIA A CONTAGEM. Sem isto, quem ja' tinha clicado em "ver
  // mais" e depois digita fica com um limite alto colado numa lista curta —
  // e o oposto tambem: acha 80 resultados e ve' 30 sem entender por que.
  busca.addEventListener("input", function () {
    mostrando = passoLista();
    desenhar();
    anotarBusca();
  });

  // ⭐ O QUE AS PESSOAS PROCURAM E NAO ACHAM — ordem do Bryan em 16/09/2026:
  // "meu amigo pesquisou macbook e nao tinha nada; eu queria que a gente
  // soubesse e o proximo radar ja' viesse com o item". A pagina so' ANOTA
  // (termo, quantos apareceram, categoria); quem procura fonte e' o motor.
  //
  // ⚠️ MESMO CONTRATO da bio: so' INSERT com a chave publica, que as
  // politicas do banco deixam somar e nao deixam ler. Sem IP, sem
  // identificador. E medir NUNCA derruba a pagina: sem rede, sem chave, o
  // catalogo abre igual.
  //
  // ⚠️ SO' QUANDO A PESSOA PARA DE DIGITAR (900 ms), e uma vez por termo:
  // registrar cada tecla gravaria "m", "ma", "mac"... e o motor sairia
  // procurando fonte pra prefixo.
  var SUPABASE = {
    url: "https://lwtqfwkfcknzyyzmuymg.supabase.co",
    anon: "sb_publishable_0jl-vQuNumE-unzla0XMeQ__cz46cqy"
  };
  var buscaTimer = null;
  var ultimaAnotada = "";
  function anotarBusca() {
    if (buscaTimer) { clearTimeout(buscaTimer); }
    buscaTimer = setTimeout(function () {
      var termo = busca.value.trim().slice(0, 80);
      if (termo.length < 2 || termo === ultimaAnotada) { return; }
      ultimaAnotada = termo;
      var n = document.querySelectorAll("#grade .item").length;
      if (!SUPABASE.url || !SUPABASE.anon) { return; }
      try {
        fetch(SUPABASE.url + "/rest/v1/busca", {
          method: "POST",
          headers: { "apikey": SUPABASE.anon,
                     "Authorization": "Bearer " + SUPABASE.anon,
                     "Content-Type": "application/json",
                     "Prefer": "return=minimal" },
          body: JSON.stringify({ termo: termo, resultados: n,
                                 categoria: canal || null }),
          keepalive: true
        }).catch(function () { /* medir nunca derruba a pagina */ });
      } catch (e) { /* idem */ }
    }, 900);
  }
})();
</script>
