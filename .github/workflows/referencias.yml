name: Referencias visuais
# Coleta imagens de referencia (gallery-dl) e le com o Gemini; so' o JSON fica (artefato).
on:
  workflow_dispatch:
    inputs:
      fonte:
        description: "base da busca (secret REF_FONTE se vazio)"
        default: ""
      termos:
        description: "termos separados por || (vazio = secret REF_TERMOS)"
        default: ""
      quantos:
        default: "20"
permissions:
  contents: read
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt gallery-dl pillow
      - name: Coletar
        env:
          TERMOS: ${{ inputs.termos || secrets.REF_TERMOS }}
          N: ${{ inputs.quantos }}
          FONTE: ${{ inputs.fonte || secrets.REF_FONTE }}
        run: |
          mkdir -p ref
          python - <<'EOF'
          import os, subprocess, urllib.parse
          for t in [x.strip() for x in os.environ["TERMOS"].split("||") if x.strip()]:
              url = os.environ["FONTE"] + urllib.parse.quote(t)
              r = subprocess.run(["gallery-dl", "-q", "--range", "1-" + os.environ["N"], "-D", "ref",
                                  "-f", "{id}.{extension}", url])
              print("termo", "ok" if r.returncode == 0 else "sem retorno")
          print("imagens:", len(os.listdir("ref")))
          EOF
      - name: Ler
        env:
          REF_ROTEIRO: ${{ secrets.REF_ROTEIRO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          GEMINI_API_KEY_21: ${{ secrets.GEMINI21 }}
          GEMINI_API_KEY_22: ${{ secrets.GEMINI_API_KEY_22 }}
          GEMINI_API_KEY_23: ${{ secrets.GEMINI_API_KEY_23 }}
          GEMINI_API_KEY_24: ${{ secrets.GEMINI_API_KEY_24 }}
          GEMINI_API_KEY_25: ${{ secrets.GEMINI_API_KEY_25 }}
          GEMINI_API_KEY_26: ${{ secrets.GEMINI_API_KEY_26 }}
          GEMINI_API_KEY_27: ${{ secrets.GEMINI_API_KEY_27 }}
          GEMINI_API_KEY_28: ${{ secrets.GEMINI_API_KEY_28 }}
          GEMINI_API_KEY_29: ${{ secrets.GEMINI_API_KEY_29 }}
          GEMINI_API_KEY_30: ${{ secrets.GEMINI_API_KEY_30 }}
          GEMINI_API_KEY_31: ${{ secrets.GEMINI_API_KEY_31 }}
        run: python -X utf8 ferramentas/ler_referencias.py ref ref.json
      - uses: actions/upload-artifact@v4
        with:
          name: referencias
          path: ref.json
          retention-days: 7
