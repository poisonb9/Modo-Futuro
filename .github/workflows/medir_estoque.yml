name: Medir estoque (so' le, nao agenda)

# POR QUE ESTE WORKFLOW EXISTE
#
# Os quatro tokens do Buffer so' existem nos SECRETS deste repositorio — o
# `.env` da maquina do Bryan tem so' o do modofuturo. Entao "quantos clipes
# prontos cada canal ainda tem" e' uma pergunta que SO' da' pra responder
# aqui. Em 04/09/2026 a falta disto levou uma sessao a concluir "a fabrica
# esta' seca" a partir de um numero que ninguem tinha contado.
#
# ⚠️ NAO AGENDA NADA. Roda o `agendar_buffer.py --simular`, que e' read-only
# por construcao. Pode ser disparado a qualquer hora, inclusive no meio de um
# corte, sem mexer em fila nenhuma.

on:
  workflow_dispatch:
    inputs:
      canais:
        description: "Quais medir, separados por virgula. Vazio = todos."
        required: false
        default: ""

# Leitura pura: nao precisa de contents: write.
permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Medir
        env:
          CANAIS: ${{ inputs.canais }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_TOKEN_COZINHA: ${{ secrets.BUFFER_TOKEN_COZINHA }}
          BUFFER_TOKEN_SEMANESTESIA: ${{ secrets.BUFFER_TOKEN_SEMANESTESIA }}
          BUFFER_TOKEN_ATEFALHAR: ${{ secrets.BUFFER_TOKEN_ATEFALHAR }}
          BUFFER_TOKEN_TRUQUEIMPORTADO: ${{ secrets.BUFFER_TOKEN_TRUQUEIMPORTADO }}
        run: python -X utf8 medir_estoque.py

      - name: Avisar no Telegram
        if: always()
        run: |
          if [ -f relato_estoque.txt ]; then T="$(cat relato_estoque.txt)"
          else T="Medicao de estoque FALHOU: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode text="$T"
