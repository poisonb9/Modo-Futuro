name: Cupons (de hora em hora)

# Grava estado/cupons.json (Awin + AliExpress). A pagina /cupons le' este
# arquivo direto do repo ao abrir — atualiza sem republicar o site.
# Custo: APIs gratuitas, zero token de IA, runner gratis (repo publico).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cupons
  cancel-in-progress: false

jobs:
  cupons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv
      - name: Buscar cupons
        env:
          AWIN_TOKEN: ${{ secrets.AWIN_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
        run: python -X utf8 -m engine.cupons --gravar
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f estado/cupons.json
          git diff --cached --quiet && exit 0
          git commit -m "cupons: atualizacao de 3 em 3 h"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
