# Garimpo da Shein — por navegador, porque a API interna deles e' assinada.
#
# ⚠️ Medido em 13/09/2026: o HTML da busca vem SEM produto (montado por JS), o
# endpoint de busca da' 403 e o de categoria devolve `code 836000` fora do
# navegador. Chromium le' a mesma pagina que qualquer pessoa ve'.
name: Garimpo Shein

on:
  workflow_dispatch:
    inputs:
      canal:
        description: canal
        required: true
        default: truque.importado

jobs:
  garimpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python -X utf8 -m engine.shein --canal "${{ inputs.canal }}"
