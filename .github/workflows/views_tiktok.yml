# Views de cada video no TikTok (Buffer da o link; a pagina publica da as views).
# 05/10/2026: o Buffer nao devolve views — sem isto a operacao decidia no escuro.
name: Views TikTok

on:
  schedule:
    - cron: '27 13 * * *'    # 10:27 BRT
    - cron: '53 1 * * *'     # 22:53 BRT
  workflow_dispatch:

jobs:
  ler:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Ler views
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_TOKEN_SEMANESTESIA: ${{ secrets.BUFFER_TOKEN_SEMANESTESIA }}
          BUFFER_TOKEN_ATEFALHAR: ${{ secrets.BUFFER_TOKEN_ATEFALHAR }}
          BUFFER_TOKEN_TRUQUEIMPORTADO: ${{ secrets.BUFFER_TOKEN_TRUQUEIMPORTADO }}
          BUFFER_TOKEN_CAMARIM: ${{ secrets.BUFFER_TOKEN_CAMARIM }}
          BUFFER_TOKEN_COZINHA: ${{ secrets.BUFFER_TOKEN_COZINHA }}
          PAGOMENOS: ${{ secrets.PAGOMENOS }}
          ACHADINHOSINSTANTANEOS: ${{ secrets.ACHADINHOSINSTANTANEOS }}
          ACHADINHOTOTAL: ${{ secrets.ACHADINHOTOTAL }}
        run: python -X utf8 ferramentas/views_tiktok.py
      - name: Guardar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f estado/views_tiktok.jsonl estado/perfis_tiktok.jsonl || true
          git diff --cached --quiet && exit 0
          git commit -m "views: leitura do TikTok"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
