<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sair dos avisos — Achadinho Total</title>
<link rel="icon" href="/icone.png">
<meta name="robots" content="noindex, nofollow">
<style>
:root{--tinta:#16151c;--fraco:#6f6b7d;--linha:#e6e3ec;--fundo:#ffffff;--caixa:#fff;--ouro:#C8901A}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tinta);font:16px/1.6 Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.faixa{max-width:520px;margin:0 auto;padding:56px 18px 64px;text-align:center}
h1{font-size:24px;line-height:1.25;margin:0 0 10px;letter-spacing:-.02em}
p{margin:0 0 12px;color:var(--fraco)}
.caixa{border:1px solid var(--linha);border-radius:16px;padding:22px 20px;margin-top:8px}
a{color:var(--tinta)}
.volta{display:inline-block;margin-top:26px;font-size:14px;color:var(--fraco)}
</style>
</head>
<body>
<div class="faixa">
  <div class="caixa">
    <h1 id="titulo">Tirando você dos avisos…</h1>
    <p id="texto">Um instante.</p>
  </div>
  <a class="volta" href="/">&larr; voltar aos achadinhos</a>
</div>
<script>
// O link do e-mail traz ?e=<email>&s=<assinatura>. A assinatura e' conferida
// pela rotina de envio antes de tirar alguem da lista: sem ela, ninguem tira
// o e-mail de outra pessoa. Aqui so' se registra o pedido.
(function () {
  var q = new URLSearchParams(location.search);
  var e = (q.get("e") || "").trim().toLowerCase(), s = (q.get("s") || "").trim();
  var t = document.getElementById("titulo"), x = document.getElementById("texto");
  if (!e || !s) {
    t.textContent = "Link incompleto";
    x.textContent = "Abra o link “Não quero mais receber avisos” direto do e-mail.";
    return;
  }
  fetch("https://lwtqfwkfcknzyyzmuymg.supabase.co/rest/v1/saida_email", {
    method: "POST",
    headers: { "apikey": "sb_publishable_0jl-vQuNumE-unzla0XMeQ__cz46cqy",
               "Authorization": "Bearer sb_publishable_0jl-vQuNumE-unzla0XMeQ__cz46cqy",
               "Content-Type": "application/json", "Prefer": "return=minimal" },
    body: JSON.stringify({ email: e.slice(0, 120), assinatura: s.slice(0, 128) })
  }).then(function (r) {
    if (!r.ok) { throw new Error(r.status); }
    t.textContent = "Pronto, você saiu dos avisos.";
    x.textContent = "Não vou mais mandar avisos de preço para " + e + ". Pode levar até 1 hora para valer.";
  }).catch(function () {
    t.textContent = "Não deu agora";
    x.textContent = "Tente abrir o link de novo em alguns minutos.";
  });
})();
</script>
</body>
</html>
